schema_version = 1

[[operating_systems]]
id = "centos5"
label = "CentOS 5.11"
image = "centos5.11"

[[operating_systems]]
id = "ubuntu7"
label = "Ubuntu 7.10 (i386)"
image = "ubuntu7.10"

[[tasks]]
number = 1
slug = "shared-nfs-storage"
difficulty = "medium"
nodes = 2
instruction = """
On `node1`, export `/srv/nfs/shared` as an NFS share and mount it at `/mnt/shared` on
`node2`. Use the shared identity `dataops` with UID and GID 4500 on both systems, and
set the shared directory to `dataops:dataops` with mode 2770 so files created on
either system keep consistent ownership and permissions.

Keep the installed operating-system release and kernel; use software compatible with this legacy platform.
"""

[[tasks]]
number = 2
slug = "centralized-log-collector"
difficulty = "medium"
nodes = 2
instruction = """
On `node2`, forward the `inventory` application's log messages to a centralized log
collector on `node1`. Persist the received messages on `node1` under
`/var/log/inventory/node2.log`, and keep the flow of logs working after either
system restarts.

Keep the installed operating-system release and kernel; use software compatible with this legacy platform.
"""

[[tasks]]
number = 3
slug = "ssh-controller-access"
difficulty = "easy"
nodes = 2
instruction = """
On `node1`, create an `opsbot` account and give it SSH key-based access to run
commands as `opsbot` on `node2`. Require key-based authentication for `opsbot` on
both systems.

Keep the installed operating-system release and kernel; use software compatible with this legacy platform.
"""

[[tasks]]
number = 4
slug = "internal-ca-tls"
difficulty = "medium"
nodes = 2
instruction = """
On `node1`, create a certificate authority named `Fleet Internal CA`. Issue it a TLS
certificate for `node2` and configure `node2` to serve HTTPS on port 8443 with that
certificate. Install the CA as a trusted system certificate authority on both
`node1` and `node2`.

Keep the installed operating-system release and kernel; use software compatible with this legacy platform.
"""

[[tasks]]
number = 5
slug = "internal-time-sync"
difficulty = "easy"
nodes = 2
instruction = """
Configure `node1` as the internal time source for the cluster, and configure
`node2` to synchronize its clock against `node1` instead of a public time server.

Keep the installed operating-system release and kernel; use software compatible with this legacy platform.
"""

[[tasks]]
number = 6
slug = "load-balanced-web-tier"
difficulty = "medium"
nodes = 3
instruction = """
Run the inventory web application on `node2` and `node3`, each listening on port
8080. Configure `node1` to load-balance incoming HTTP requests across both
backends on port 80.

Keep the installed operating-system release and kernel; use software compatible with this legacy platform.
"""

[[tasks]]
number = 7
slug = "network-scoped-firewall"
difficulty = "medium"
nodes = 3
instruction = """
On `node1`, enable a persistent host firewall that allows SSH from any address,
allows TCP port 9000 only from `node2`, and rejects that port from `node3` and
everywhere else.

Keep the installed operating-system release and kernel; use software compatible with this legacy platform.
"""

[[tasks]]
number = 8
slug = "config-sync"
difficulty = "easy"
nodes = 2
instruction = """
Treat `/etc/inventory/app.conf` on `node1` as the source of truth for the
inventory application's configuration. Keep the copy of that file on `node2`
synchronized with `node1`, picking up any change within 15 minutes.

Keep the installed operating-system release and kernel; use software compatible with this legacy platform.
"""

[[tasks]]
number = 9
slug = "scheduled-backup"
difficulty = "easy"
nodes = 2
instruction = """
Every night, back up `/srv/inventory/data` from `node2` to `node1`. Store dated
archives under `/var/backups/inventory` on `node1`, and retain the last 7 days.

Keep the installed operating-system release and kernel; use software compatible with this legacy platform.
"""

[[tasks]]
number = 10
slug = "internal-dns-resolution"
difficulty = "easy"
nodes = 2
instruction = """
On `node1`, run an internal DNS resolver that resolves the name
`inventory-api.internal` to `node2`. Configure `node2` to use `node1` as its DNS
resolver for internal lookups.

Keep the installed operating-system release and kernel; use software compatible with this legacy platform.
"""
