[[steps]]
id = "confirm-destination-is-empty"
stage = 30
node = "node2"
command = '''
set -eu
. /etc/os-release
test "$ID" = ubuntu
test "$VERSION_ID" = 24.04
! systemctl is-active --quiet mysql
! sudo -n mysql -e 'SHOW DATABASES' 2>/dev/null | grep -qx legacy_shop
'''
timeout_sec = 120
