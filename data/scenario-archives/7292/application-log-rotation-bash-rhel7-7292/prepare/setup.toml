timeout_sec = 180

[[steps]]
id = "prepare-application-log"
stage = 10
node = "node1"
command = '''
set -eu
sudo -n install -d -o root -g root -m 0755 /var/log/inventory
printf '%s\n' 'inventory service started' 'inventory initial record count: 2' | sudo -n tee /var/log/inventory/app.log > /dev/null
sudo -n chmod 0644 /var/log/inventory/app.log
'''
