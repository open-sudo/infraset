cluster = ["openwrt", "ubuntu24.04 x3"]
max_clusters = 3
base_runbooks = [
  "antrieb/primer",
  "antrieb/networking-primer",
  "antrieb/openwrt-reference",
]
control_node = "node2"
endpoint = "https://antrieb.sh/mcp"

[[networks]]
name = "mgmt"
dhcp = true
egress = true

[[networks]]
name = "wan"
dhcp = true
egress = true

[[networks]]
name = "trusted"
dhcp = false
egress = false

[[networks]]
name = "guest"
dhcp = false
egress = false

[nics]
node1 = [{ net = "mgmt" }, { net = "wan" }, { net = "trusted" }, { net = "guest" }]
node2 = [{ net = "mgmt" }, { net = "trusted" }]
node3 = [{ net = "mgmt" }, { net = "guest" }]
node4 = [{ net = "mgmt" }, { net = "trusted" }]
