cluster = ["sonic", "almalinux9 x2"]
base_runbooks = [
  "antrieb/primer",
  "antrieb/networking-primer",
  "antrieb/sonic-reference",
]
control_node = "node2"
endpoint = "https://antrieb.sh/mcp"

[[networks]]
name = "mgmt"
dhcp = true
egress = true

[[networks]]
name = "seg-a"
dhcp = false
egress = false

[[networks]]
name = "seg-b"
dhcp = false
egress = false

[nics]
node1 = [{ net = "mgmt" }, { net = "seg-a" }, { net = "seg-b" }]
node2 = [{ net = "mgmt" }, { net = "seg-a" }]
node3 = [{ net = "mgmt" }, { net = "seg-b" }]
