cluster = ["vyos", "rhel10.0 x2"]
initialize = ["rhsm"]
base_runbooks = [
  "antrieb/primer",
  "antrieb/networking-primer",
  "antrieb/vyos-reference",
]
control_node = "node2"
endpoint = "https://antrieb.sh/mcp"

[[networks]]
name = "mgmt"
dhcp = true
egress = true

[[networks]]
name = "trunk"
dhcp = false
egress = false

[nics]
node1 = [{ net = "mgmt" }, { net = "trunk" }]
node2 = [{ net = "mgmt" }, { net = "trunk" }]
node3 = [{ net = "mgmt" }, { net = "trunk" }]
