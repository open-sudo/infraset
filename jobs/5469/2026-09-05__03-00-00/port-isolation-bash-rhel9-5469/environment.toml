cluster = ["sonic", "rhel9.8 x2"]
initialize = ["rhsm"]
base_runbooks = [
  "antrieb/primer",
  "antrieb/networking-primer",
  "antrieb/sonic-reference",
]
control_node = "node2"
endpoint = "https://antrieb.sh/mcp"

[[networks]]
name = "mgmt"
dhcp = true
egress = true

[[networks]]
name = "seg"
dhcp = false
egress = false

[nics]
node1 = [{ net = "mgmt" }, { net = "seg" }]
node2 = [{ net = "mgmt" }, { net = "seg" }]
node3 = [{ net = "mgmt" }, { net = "seg" }]
