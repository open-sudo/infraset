cluster = ["openwrt", "ubuntu16.04 x2"]
base_runbooks = [
  "antrieb/primer",
  "antrieb/networking-primer",
  "antrieb/openwrt-reference",
]
control_node = "node2"
endpoint = "https://antrieb.sh/mcp"

[[networks]]
name = "mgmt"
dhcp = true
egress = true

[[networks]]
name = "trunk"
dhcp = false
egress = false

[nics]
node1 = [{ net = "mgmt" }, { net = "trunk" }]
node2 = [{ net = "mgmt" }, { net = "trunk" }]
node3 = [{ net = "mgmt" }, { net = "trunk" }]
