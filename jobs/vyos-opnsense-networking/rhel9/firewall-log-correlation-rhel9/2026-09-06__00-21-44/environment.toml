cluster = ["vyos", "opnsense", "rhel9.8 x2"]
initialize = ["rhsm"]
base_runbooks = [
  "antrieb/primer",
  "antrieb/networking-primer",
  "antrieb/vyos-reference",
  "antrieb/opnsense-reference",
]
control_node = "node3"
endpoint = "https://antrieb.sh/mcp"

[[networks]]
name = "mgmt"
dhcp = true
egress = true

[[networks]]
name = "transit"
dhcp = false
egress = false

[[networks]]
name = "lan-a"
dhcp = false
egress = false

[[networks]]
name = "lan-b"
dhcp = false
egress = false

[nics]
node1 = [{ net = "mgmt" }, { net = "transit" }, { net = "lan-a" }]
node2 = [{ net = "mgmt" }, { net = "transit" }, { net = "lan-b" }]
node3 = [{ net = "mgmt" }, { net = "lan-a" }]
node4 = [{ net = "mgmt" }, { net = "lan-b" }]
