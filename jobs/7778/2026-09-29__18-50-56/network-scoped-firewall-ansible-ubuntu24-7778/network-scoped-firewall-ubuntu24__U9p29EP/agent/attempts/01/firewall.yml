---
- name: Configure persistent host firewall on node1
  hosts: fw
  become: true
  vars:
    node2_ip: "10.100.243.11"
    node3_ip: "10.100.243.12"
  tasks:
    - name: Ensure ufw is installed
      ansible.builtin.package:
        name: ufw
        state: present

    - name: Set default incoming policy to deny
      community.general.ufw:
        direction: incoming
        policy: deny

    - name: Set default outgoing policy to allow
      community.general.ufw:
        direction: outgoing
        policy: allow

    - name: Allow SSH from any address
      community.general.ufw:
        rule: allow
        proto: tcp
        port: '22'

    - name: Allow TCP 9000 from node2 only
      community.general.ufw:
        rule: allow
        proto: tcp
        port: '9000'
        src: "{{ node2_ip }}"

    - name: Reject TCP 9000 from node3 explicitly
      community.general.ufw:
        rule: reject
        proto: tcp
        port: '9000'
        src: "{{ node3_ip }}"

    - name: Reject TCP 9000 from everywhere else
      community.general.ufw:
        rule: reject
        proto: tcp
        port: '9000'

    - name: Enable ufw and ensure it starts on boot
      community.general.ufw:
        state: enabled

    - name: Ensure ufw service is enabled at boot
      ansible.builtin.systemd:
        name: ufw
        enabled: true
