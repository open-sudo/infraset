cluster = ["ubuntu16.04", "ubuntu24.04"]
max_clusters = 3
base_runbooks = ["antrieb/primer", "antrieb/networking-primer"]
control_node = "node1"
endpoint = "https://antrieb.sh/mcp"

[[networks]]
name = "client-lan"
dhcp = true
egress = true

[[networks]]
name = "application-lan"
dhcp = true
egress = false

[nics]
node1 = [{ net = "client-lan" }, { net = "application-lan" }]
node2 = [{ net = "client-lan" }, { net = "application-lan" }]

[prepare]
enabled = true
mode = "static"
setup = "prepare/setup.toml"
baseline = "prepare/baseline.toml"
timeout_sec = 600
