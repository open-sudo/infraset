cluster = ["vyos", "ubuntu24.04 x2"]
max_clusters = 3
base_runbooks = [
  "antrieb/primer",
  "antrieb/networking-primer",
  "antrieb/vyos-reference",
]
control_node = "node2"
endpoint = "https://antrieb.sh/mcp"

[[networks]]
name = "mgmt"
dhcp = true
egress = true

[[networks]]
name = "primary-transit"
dhcp = false
egress = false

[[networks]]
name = "lan-a"
dhcp = false
egress = false

[[networks]]
name = "lan-b"
dhcp = false
egress = false

[nics]
node1 = [{ net = "mgmt" }, { net = "lan-a" }, { net = "lan-b" }]
node2 = [{ net = "mgmt" }, { net = "primary-transit" }, { net = "lan-a" }]
node3 = [{ net = "mgmt" }, { net = "primary-transit" }, { net = "lan-b" }]
