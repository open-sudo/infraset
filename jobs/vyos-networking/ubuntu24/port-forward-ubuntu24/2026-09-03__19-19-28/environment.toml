cluster = ["vyos", "ubuntu24.04 x2"]
base_runbooks = [
  "antrieb/primer",
  "antrieb/networking-primer",
  "antrieb/vyos-reference",
]
control_node = "node2"
endpoint = "https://antrieb.sh/mcp"

[[networks]]
name = "mgmt"
dhcp = true
egress = true

[[networks]]
name = "lan"
dhcp = false
egress = false

[nics]
node1 = [{ net = "mgmt" }, { net = "lan" }]
node2 = [{ net = "mgmt" }, { net = "lan" }]
node3 = [{ net = "mgmt" }]
