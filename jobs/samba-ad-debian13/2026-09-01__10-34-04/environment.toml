cluster = ["debian13 x4"]
max_clusters = 3
base_runbooks = ["antrieb/primer", "antrieb/networking-primer"]
control_node = "node4"
endpoint = "https://antrieb.sh/mcp"

[[networks]]
name = "mgmt"
dhcp = true
egress = true

[[networks]]
name = "identity"
dhcp = true
egress = false

[nics]
node1 = [{ net = "mgmt" }, { net = "identity" }]
node2 = [{ net = "mgmt" }, { net = "identity" }]
node3 = [{ net = "mgmt" }, { net = "identity" }]
node4 = [{ net = "mgmt" }, { net = "identity" }]
