timeout_sec = 180

[[steps]]
id = "prepare-inventory-data"
stage = 10
node = "node1"
command = '''
set -eu
sudo -n install -d -o root -g root -m 0755 /srv/inventory/data
printf '%s\n' 'sku-1001,keyboard,12' 'sku-1002,display,7' | sudo -n tee /srv/inventory/data/records.csv > /dev/null
printf '%s\n' '{"site":"north","generation":4}' | sudo -n tee /srv/inventory/data/config.json > /dev/null
sudo -n chown -R root:root /srv/inventory
sudo -n chmod 0755 /srv/inventory /srv/inventory/data
sudo -n chmod 0644 /srv/inventory/data/records.csv /srv/inventory/data/config.json
'''
