[[tasks]]
number = 1
slug = "account-resource-limits"
difficulty = "medium"
agent_timeout_sec = 900
verifier_timeout_sec = 1200
instruction = """
On `node1`, create the `appworker` account and give its login sessions a limit of 8,192 open files and 256 processes.
"""

[[tasks]]
number = 2
slug = "application-log-rotation"
difficulty = "medium"
agent_timeout_sec = 900
verifier_timeout_sec = 1200
prepare = true
instruction = """
On `node1`, rotate `/var/log/inventory/app.log` daily, keep seven compressed rotations, and allow the application to continue writing after rotation.
"""

[[tasks]]
number = 3
slug = "custom-ca-trust"
difficulty = "medium"
agent_timeout_sec = 900
verifier_timeout_sec = 1200
instruction = """
On `node1`, create a local certificate authority named `OS Comparison Root CA` and install its certificate as a trusted system certificate authority.
"""

[[tasks]]
number = 4
slug = "host-firewall-baseline"
difficulty = "medium"
agent_timeout_sec = 900
verifier_timeout_sec = 1200
instruction = """
On `node1`, enable a persistent host firewall that permits SSH and TCP port 8080 while rejecting unrelated inbound connections.
"""

[[tasks]]
number = 5
slug = "kernel-network-hardening"
difficulty = "medium"
agent_timeout_sec = 900
verifier_timeout_sec = 1200
instruction = """
On `node1`, persistently disable acceptance of ICMP redirects and source-routed packets for IPv4 networking.
"""

[[tasks]]
number = 6
slug = "repair-application-permissions"
difficulty = "medium"
agent_timeout_sec = 900
verifier_timeout_sec = 1200
prepare = true
instruction = """
On `node1`, repair `/srv/inventory` so its existing data is owned by `inventorysvc`, readable by `inventory-readers`, and inaccessible to other users. Preserve the existing contents.
"""

[[tasks]]
number = 7
slug = "scheduled-maintenance"
difficulty = "easy"
agent_timeout_sec = 900
verifier_timeout_sec = 1200
prepare = true
instruction = """
On `node1`, run `/usr/local/bin/inventory-maintenance` every day at 02:15 and retain its output in `/var/log/inventory-maintenance.log`.
"""

[[tasks]]
number = 8
slug = "ssh-key-only"
difficulty = "medium"
agent_timeout_sec = 900
verifier_timeout_sec = 1200
instruction = """
On `node1`, configure `opsadmin` for SSH access with the public key `ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINMKA2+oNHxgmpABaV61Sar8lVW2YxSL8Aw9d7b5yLh1 os-comparison@example.invalid`, and require key-based SSH authentication.
"""

[[tasks]]
number = 9
slug = "sticky-drop-directory"
difficulty = "easy"
agent_timeout_sec = 900
verifier_timeout_sec = 1200
instruction = """
On `node1`, configure `/srv/drop` as a shared writable directory where users cannot remove files owned by other users.
"""

[[tasks]]
number = 10
slug = "unprivileged-service"
difficulty = "medium"
agent_timeout_sec = 900
verifier_timeout_sec = 1200
prepare = true
instruction = """
On `node1`, run `/usr/local/bin/os-comparison-worker` as a managed service named `inventory-worker` under the dedicated `inventorysvc` account.
"""

[[tasks]]
number = 11
slug = "mandatory-access-control-port"
difficulty = "medium"
agent_timeout_sec = 1800
verifier_timeout_sec = 1500
instruction = """
On `node1`, serve the inventory application over TCP port 8181 while the
system's mandatory access control stays in enforcing mode.
"""

[[tasks]]
number = 12
slug = "kernel-module-blacklist"
difficulty = "medium"
agent_timeout_sec = 1800
verifier_timeout_sec = 1500
instruction = """
On `node1`, stop the `usb-storage` kernel module from loading, both now and
after a reboot.
"""

[[tasks]]
number = 13
slug = "boot-kernel-parameter"
difficulty = "medium"
agent_timeout_sec = 1800
verifier_timeout_sec = 1500
instruction = """
On `node1`, have the kernel boot with `audit=1` and keep that setting across
reboots.
"""

[[tasks]]
number = 14
slug = "mount-option-hardening"
difficulty = "medium"
agent_timeout_sec = 1800
verifier_timeout_sec = 1500
instruction = """
On `node1`, mount `/tmp` and `/dev/shm` so that program execution, setuid bits,
and device nodes are all ignored there. The settings should survive a reboot.
"""

[[tasks]]
number = 15
slug = "service-sandboxing"
difficulty = "hard"
agent_timeout_sec = 1800
verifier_timeout_sec = 1500
instruction = """
On `node1`, run a long-running background worker as a managed service named
`inventory-worker`, confined so it writes only inside `/var/lib/inventory` and
gains no new privileges.
"""

[[tasks]]
number = 16
slug = "password-complexity-policy"
difficulty = "medium"
agent_timeout_sec = 1800
verifier_timeout_sec = 1500
instruction = """
On `node1`, require new user passwords to be at least 12 characters long and to
use at least three different character classes.
"""

[[tasks]]
number = 17
slug = "sudo-command-logging"
difficulty = "medium"
agent_timeout_sec = 1800
verifier_timeout_sec = 1500
instruction = """
On `node1`, record every command run through sudo, with the user and timestamp,
to `/var/log/sudo-commands.log`, keeping those entries out of the general
system log.
"""

[[tasks]]
number = 18
slug = "cron-access-control"
difficulty = "easy"
agent_timeout_sec = 1800
verifier_timeout_sec = 1500
instruction = """
On `node1`, allow only `root` and `opsadmin` to schedule cron jobs.
"""

[[tasks]]
number = 19
slug = "ssh-host-certificate"
difficulty = "hard"
agent_timeout_sec = 1800
verifier_timeout_sec = 1500
instruction = """
On `node1`, create an SSH certificate authority and have the host present a
certificate signed by it, so a client that trusts the authority connects
without pinning the host key.
"""

[[tasks]]
number = 20
slug = "disk-quota"
difficulty = "hard"
agent_timeout_sec = 1800
verifier_timeout_sec = 1500
instruction = """
On `node1`, limit the account `datauser` to 100 MB of storage under
`/srv/data`, enforced by the filesystem itself.
"""

[[tasks]]
number = 21
slug = "encrypted-volume"
difficulty = "hard"
agent_timeout_sec = 1800
verifier_timeout_sec = 1500
instruction = """
On `node1`, provide an encrypted volume mounted at `/srv/secure` that unlocks
and mounts on its own at boot.
"""

[[tasks]]
number = 22
slug = "lvm-extend"
difficulty = "medium"
agent_timeout_sec = 1800
verifier_timeout_sec = 1500
instruction = """
On `node1`, provide a logical volume mounted at `/srv/data`, then grow it to at
least 2 GB while it stays mounted and its contents stay intact.
"""

[[tasks]]
number = 23
slug = "filesystem-snapshot-rollback"
difficulty = "hard"
agent_timeout_sec = 1800
verifier_timeout_sec = 1500
instruction = """
On `node1`, keep application data under `/srv/data` recoverable through
filesystem snapshots. After the directory is modified, restore the exact
content captured by an earlier snapshot.
"""

[[tasks]]
number = 24
slug = "zram-swap"
difficulty = "medium"
agent_timeout_sec = 1800
verifier_timeout_sec = 1500
instruction = """
On `node1`, add at least 512 MB of compressed in-memory swap, active at boot
and preferred over any disk-backed swap.
"""

[[tasks]]
number = 25
slug = "package-version-hold"
difficulty = "medium"
agent_timeout_sec = 1800
verifier_timeout_sec = 1500
instruction = """
On `node1`, keep the installed `curl` package at its current version so a
system update leaves it where it is.
"""

[[tasks]]
number = 26
slug = "local-package-repository"
difficulty = "hard"
agent_timeout_sec = 1800
verifier_timeout_sec = 1500
instruction = """
On `node1`, serve a package repository from local storage and install a package
from it while the usual remote repositories are unreachable.
"""

[[tasks]]
number = 27
slug = "oom-protection"
difficulty = "hard"
agent_timeout_sec = 1800
verifier_timeout_sec = 1500
instruction = """
On `node1`, run `inventory-api` as a managed service that keeps serving when a
memory-hungry process drives the system out of memory, leaving the memory hog
as the process the kernel stops.
"""

[[tasks]]
number = 28
slug = "rootless-container-service"
difficulty = "hard"
agent_timeout_sec = 1800
verifier_timeout_sec = 1500
instruction = """
On `node1`, run a containerized web application as the unprivileged account
`appsvc`, serving on port 8080 and starting at boot while that account has no
active login session.
"""

[[tasks]]
number = 29
slug = "certificate-rotation"
difficulty = "hard"
agent_timeout_sec = 1800
verifier_timeout_sec = 1500
instruction = """
On `node1`, serve HTTPS on port 8443 with a certificate that is renewed
automatically before it expires, and have the service pick up each new
certificate while it keeps answering requests.
"""

[[tasks]]
number = 30
slug = "file-integrity-baseline"
difficulty = "medium"
agent_timeout_sec = 1800
verifier_timeout_sec = 1500
instruction = """
On `node1`, establish an integrity baseline for `/etc` so that later changes to
files there can be identified and reported.
"""
