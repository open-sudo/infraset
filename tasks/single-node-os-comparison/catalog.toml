[[tasks]]
number = 1
slug = "account-resource-limits"
difficulty = "medium"
instruction = """
On `node1`, create the `appworker` account and give its login sessions a limit of 8,192 open files and 256 processes.
"""

[[tasks]]
number = 2
slug = "application-log-rotation"
difficulty = "medium"
instruction = """
On `node1`, rotate `/var/log/inventory/app.log` daily, keep seven compressed rotations, and allow the application to continue writing after rotation.
"""

[[tasks]]
number = 3
slug = "custom-ca-trust"
difficulty = "medium"
instruction = """
On `node1`, create a local certificate authority named `OS Comparison Root CA` and install its certificate as a trusted system certificate authority.
"""

[[tasks]]
number = 4
slug = "host-firewall-baseline"
difficulty = "medium"
instruction = """
On `node1`, enable a persistent host firewall that permits SSH and TCP port 8080 while rejecting unrelated inbound connections.
"""

[[tasks]]
number = 5
slug = "kernel-network-hardening"
difficulty = "medium"
instruction = """
On `node1`, persistently disable acceptance of ICMP redirects and source-routed packets for IPv4 networking.
"""

[[tasks]]
number = 6
slug = "repair-application-permissions"
difficulty = "medium"
instruction = """
On `node1`, repair `/srv/inventory` so its existing data is owned by `inventorysvc`, readable by `inventory-readers`, and inaccessible to other users. Preserve the existing contents.
"""

[[tasks]]
number = 7
slug = "scheduled-maintenance"
difficulty = "easy"
instruction = """
On `node1`, run `/usr/local/bin/inventory-maintenance` every day at 02:15 and retain its output in `/var/log/inventory-maintenance.log`.
"""

[[tasks]]
number = 8
slug = "ssh-key-only"
difficulty = "medium"
instruction = """
On `node1`, configure `opsadmin` for SSH access with the public key `ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINMKA2+oNHxgmpABaV61Sar8lVW2YxSL8Aw9d7b5yLh1 os-comparison@example.invalid`, and require key-based SSH authentication.
"""

[[tasks]]
number = 9
slug = "sticky-drop-directory"
difficulty = "easy"
instruction = """
On `node1`, configure `/srv/drop` as a shared writable directory where users cannot remove files owned by other users.
"""

[[tasks]]
number = 10
slug = "unprivileged-service"
difficulty = "medium"
instruction = """
On `node1`, run `/usr/local/bin/os-comparison-worker` as a managed service named `inventory-worker` under the dedicated `inventorysvc` account.
"""
