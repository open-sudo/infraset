command = "set -eu\nPATH=/usr/sbin:/usr/bin:/sbin:/bin\nexport PATH\nLC_ALL=C\nexport LC_ALL\nas_root() {\n  if [ \"$(id -u)\" -eq 0 ]; then\n    \"$@\"\n  else\n    sudo -n \"$@\"\n  fi\n}\nas_root sh -s <<'BASH_MATRIX_SEED'\n# POSIX sh; works with GNU coreutils and BusyBox. No guest Python dependency.\nset -eu\numask 022\nLC_ALL=C\nTZ=UTC0\nexport LC_ALL TZ\nseed_root=/srv/legacy2/hardlink-aware-deduplication\nstaging=\ntrap '[ -z \"$staging\" ] || rm -f \"$staging\"' 0\ntrap 'exit 1' 1 2 15\n\nsafe_dir() (\n    [ ! -L \"$1\" ] || { printf 'Symlink directory: %s\\n' \"$1\" >&2; exit 1; }\n    if [ -e \"$1\" ]; then\n        [ -d \"$1\" ] || exit 1\n        return\n    fi\n    safe_dir \"$(dirname \"$1\")\"\n    mkdir -m 0755 \"$1\"\n)\n\ndestination() {\n    case \"$1\" in ''|/*|..|../*|*/../*|*/..) exit 1;; esac\n    path=\"$seed_root/$1\"\n    safe_dir \"$(dirname \"$path\")\"\n    # Check every existing parent, not just the final directory.\n    [ \"$(cd \"$(dirname \"$path\")\" && pwd -P)\" = \"$(dirname \"$path\")\" ] || exit 1\n}\n\nregular_destination() {\n    [ ! -L \"$path\" ] || exit 1\n    if [ -e \"$path\" ]; then [ -f \"$path\" ] || exit 1; fi\n}\n\nverify_regular() {\n    actual=$(sha256sum \"$path\")\n    [ \"${actual%% *}\" = \"$1\" ] || exit 1\n    [ \"$(stat -c '%a' \"$path\")\" = \"$2\" ] || exit 1\n    [ \"$(stat -c '%Y' \"$path\")\" = \"$3\" ] || exit 1\n}\n\nsafe_dir \"$seed_root\"\ndestination \"$(printf '\\155\\165\\164\\141\\142\\154\\145\\057\\141\\143\\164\\151\\166\\145\\056\\144\\141\\164')\"\nregular_destination\nstaging=$(mktemp \"$(dirname \"$path\")/.seed-XXXXXX\")\nbase64 -d > \"$staging\" <<'BASH_MATRIX_FILE'\\nBASH_MATRIX_FILE\nchmod 644 \"$staging\"\ntouch -t 202311142213.20 \"$staging\"\nmv -f \"$staging\" \"$path\"\nstaging=\nverify_regular 828bd247960da68840beeab9a53b9cd3a55461f98fc89444c79d4211492703e8 644 1700000000\ndestination \"$(printf '\\162\\145\\154\\145\\141\\163\\145\\055\\143\\141\\143\\150\\145\\057\\160\\162\\151\\166\\141\\164\\145\\056\\144\\141\\164')\"\nregular_destination\nstaging=$(mktemp \"$(dirname \"$path\")/.seed-XXXXXX\")\nbase64 -d > \"$staging\" <<'BASH_MATRIX_FILE'\\nBASH_MATRIX_FILE\nchmod 600 \"$staging\"\ntouch -t 202311142213.20 \"$staging\"\nmv -f \"$staging\" \"$path\"\nstaging=\nverify_regular 828bd247960da68840beeab9a53b9cd3a55461f98fc89444c79d4211492703e8 600 1700000000\ndestination \"$(printf '\\162\\145\\154\\145\\141\\163\\145\\055\\143\\141\\143\\150\\145\\057\\162\\061\\057\\160\\141\\171\\154\\157\\141\\144\\056\\144\\141\\164')\"\nregular_destination\nstaging=$(mktemp \"$(dirname \"$path\")/.seed-XXXXXX\")\nbase64 -d > \"$staging\" <<'BASH_MATRIX_FILE'\\nBASH_MATRIX_FILE\nchmod 644 \"$staging\"\ntouch -t 202311142213.20 \"$staging\"\nmv -f \"$staging\" \"$path\"\nstaging=\nverify_regular 828bd247960da68840beeab9a53b9cd3a55461f98fc89444c79d4211492703e8 644 1700000000\ndestination \"$(printf '\\162\\145\\154\\145\\141\\163\\145\\055\\143\\141\\143\\150\\145\\057\\162\\062\\057\\144\\151\\146\\146\\145\\162\\145\\156\\164\\056\\144\\141\\164')\"\nregular_destination\nstaging=$(mktemp \"$(dirname \"$path\")/.seed-XXXXXX\")\nbase64 -d > \"$staging\" <<'BASH_MATRIX_FILE'\nQSBnZW51aW5lbHkgZGlmZmVyZW50IHBheWxvYWQuCg==\nBASH_MATRIX_FILE\nchmod 644 \"$staging\"\ntouch -t 202311142213.20 \"$staging\"\nmv -f \"$staging\" \"$path\"\nstaging=\nverify_regular 028e19d71f8d2ab3b0bfb36659360ea644fb658a596f1d1f09de79a35cd74599 644 1700000000\ndestination \"$(printf '\\162\\145\\154\\145\\141\\163\\145\\055\\143\\141\\143\\150\\145\\057\\162\\062\\057\\160\\141\\171\\154\\157\\141\\144\\056\\144\\141\\164')\"\nregular_destination\nstaging=$(mktemp \"$(dirname \"$path\")/.seed-XXXXXX\")\nbase64 -d > \"$staging\" <<'BASH_MATRIX_FILE'\\nBASH_MATRIX_FILE\nchmod 644 \"$staging\"\ntouch -t 202311142213.20 \"$staging\"\nmv -f \"$staging\" \"$path\"\nstaging=\nverify_regular 828bd247960da68840beeab9a53b9cd3a55461f98fc89444c79d4211492703e8 644 1700000000\nprintf '%s\\n' 'Prepared and checked fixture contents, modes, timestamps and special files'\nBASH_MATRIX_SEED\n"
