[[observations]]
id = "prepared-data-hash"
stage = 10
node = "node1"
command = "sha256sum /var/lib/infraset-app/data/records.db && stat -c '%U:%G:%a' /var/lib/infraset-app/data/records.db"
required = true

[[observations]]
id = "prepared-data-hash-node2"
stage = 10
node = "node2"
command = "sha256sum /var/lib/infraset-app/data/records.db && stat -c '%U:%G:%a' /var/lib/infraset-app/data/records.db"
required = true

[[observations]]
id = "prepared-data-hash-node3"
stage = 10
node = "node3"
command = "sha256sum /var/lib/infraset-app/data/records.db && stat -c '%U:%G:%a' /var/lib/infraset-app/data/records.db"
required = true

[[observations]]
id = "prepared-data-hash-node4"
stage = 10
node = "node4"
command = "sha256sum /var/lib/infraset-app/data/records.db && stat -c '%U:%G:%a' /var/lib/infraset-app/data/records.db"
required = true

[[observations]]
id = "prepared-service-state"
stage = 10
node = "node1"
command = "systemctl is-enabled rsyslog || true; systemctl is-active rsyslog || true"
required = true

[[observations]]
id = "prepared-selinux-state"
stage = 10
node = "node1"
command = "getenforce; ls -Zd /var/log/infraset-app.log"
required = true

[[observations]]
id = "prepared-account-state"
stage = 10
node = "node1"
command = "getent passwd rsyslog || true; getent group rsyslog || true"
required = true

[[observations]]
id = "executor-start-boot-id"
stage = 10
node = "node1"
command = "cat /proc/sys/kernel/random/boot_id"
required = true
