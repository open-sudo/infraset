timeout_sec = 180

[[observations]]
id = "prepared-capacity-failure"
stage = 10
node = "node1"
command = '''
set -eu
mountpoint -q /srv/archive
df -Pk /srv/archive
used_percent="$(df -Pk /srv/archive | awk 'NR == 2 {gsub(/%/, "", $5); print $5}')"
test "$used_percent" -eq 100
if runuser -u archiveapp -- sh -c 'dd if=/dev/zero of=/srv/archive/incoming/.baseline-write-probe bs=1M count=1 conv=fsync status=none' 2>/dev/null; then
  rm -f /srv/archive/incoming/.baseline-write-probe
  exit 1
fi
rm -f /srv/archive/incoming/.baseline-write-probe
'''
required = true

[[observations]]
id = "prepared-space-consumer"
stage = 10
node = "node1"
command = '''
set -eu
stat -c '%n size=%s blocks=%b owner=%U:%G mode=%a' /srv/archive/.telemetry-cache/collector-debug.capture
du -k /srv/archive/.telemetry-cache/collector-debug.capture
'''
required = true

[[observations]]
id = "executor-start-boot-id"
stage = 10
node = "node1"
command = "cat /proc/sys/kernel/random/boot_id"
required = true

[[observations]]
id = "archive-filesystem-identity"
stage = 10
node = "node1"
command = "findmnt -n -o UUID,FSTYPE /srv/archive"
required = true

[[observations]]
id = "archive-manifest-hash"
stage = 10
node = "node1"
command = "sha256sum /srv/archive/records/manifest.db"
required = true

[[observations]]
id = "archive-manifest-metadata"
stage = 10
node = "node1"
command = "stat -c '%U:%G:%a' /srv/archive/records/manifest.db"
required = true

[[observations]]
id = "archiveapp-identity"
stage = 10
node = "node1"
command = "id archiveapp"
required = true

[[observations]]
id = "account-state"
stage = 10
node = "node1"
command = "{ getent passwd; getent group; } | sha256sum"
required = true

[[observations]]
id = "package-state"
stage = 10
node = "node1"
command = "rpm -qa --qf '%{NAME}-%{EPOCHNUM}:%{VERSION}-%{RELEASE}.%{ARCH}\\n' | sort | sha256sum"
required = true

[[observations]]
id = "fstab-state"
stage = 10
node = "node1"
command = "sha256sum /etc/fstab"
required = true

[[observations]]
id = "host-security-state"
stage = 10
node = "node1"
command = '''
getenforce
systemctl is-active firewalld.service || true
systemctl is-enabled firewalld.service || true
'''
required = true
