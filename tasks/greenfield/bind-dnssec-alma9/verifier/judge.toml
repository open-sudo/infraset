reasoning_effort = "medium"
timeout_sec = 1500
allow_ssh_probes = false

[dimensions.functionality]
weight = 0.30
description = "Inspect four AlmaLinux 9 systems. Verify node1 is the writable primary for infra.test, node2 and node3 are authoritative secondaries, and node4 resolves through both secondaries. Discover the live DNS-network addresses, query each authority directly for app.infra.test set to the required node1 service address and status.infra.test=ready, validate authoritative answers and matching serials, perform an authenticated evaluator-owned update from node1, and prove it transfers to both secondaries. Score DNS behavior rather than requiring a particular BIND configuration layout."

[dimensions.security]
weight = 0.25
description = "Validate the infra.test DNSSEC chain and signatures with a trust anchor derived from the served zone, not merely the presence of key files. Confirm unauthenticated updates and unauthorized zone transfers fail, recursion is not exposed by authoritative servers, and DNS access and transfers are restricted to their declared roles and DNS network. Verify the update secret and DNSSEC private material have restrictive ownership and modes, named runs confined and without unnecessary privilege, SELinux stays enforcing, persistent firewalld policy is effective, and SSH is not enabled. Accept equivalent secure signing and firewall layouts."

[dimensions.resilience]
weight = 0.15
description = "After initial resolution and transfer proof, stop one authoritative secondary and record the evaluator action. Confirm node4 continues resolving signed answers through the surviving secondary. Restore the stopped service and verify it becomes authoritative with the current serial. Where safe, also demonstrate that an update accepted while a secondary is unavailable propagates after it returns. Always restore evaluator-changed services."

[dimensions.persistence]
weight = 0.20
description = "Record boot identities and reboot node1, node2, node3, and node4 sequentially, preserving available DNS service during the sequence. Confirm changed boot identities, enabled service recovery, signed authoritative answers, primary-to-secondary transfer of a new evaluator-owned update, resolver use of both secondaries, effective update and transfer authorization, SELinux enforcement, and persistent firewalld policy without evaluator repair."

[dimensions.operational_hygiene]
weight = 0.10
description = "Inspect all nodes for failed units, unsigned or stale duplicate zones, abandoned signing or update files, temporary scripts and logs, broad secrets, duplicate DNS services, debug or unnecessary listeners, enabled SSH, unnecessary users, packages, services, firewall openings, and conflicting resolver configuration. Legitimate zone journals, DNSSEC keys, BIND state, logs, service configuration, and runtime packages are expected. Remove evaluator-created records, files, and state records safely before finishing."
