schema_version = 1

[[probes]]
id = "web-service-contract"
level = 1
targets = ["node1"]
max_exec_calls = 3
procedure = "Inspect service/listener ownership and request / through HAProxy on port 80 and directly through the loopback Node.js backend on port 3000."

[[probes]]
id = "web-security"
level = 2
targets = ["node1"]
max_exec_calls = 3
procedure = "Inspect backend addresses, external reachability, process identities, configuration permissions, UFW, AppArmor, SSH, and unrelated web/debug listeners."

[[probes]]
id = "web-persistent-state"
level = 4
targets = ["node1"]
max_exec_calls = 2
procedure = "Inspect enabled startup, durable HAProxy/application configuration, UFW policy, and AppArmor state."

[[probes]]
id = "web-operational-state"
level = 5
targets = ["node1"]
max_exec_calls = 2
procedure = "Inspect release, failed units, duplicate proxies/apps, unrelated web servers, debug processes, package failures, and temporary or backup residue."

[[probes]]
id = "web-reboot"
level = 8
targets = ["node1"]
effect = "reboot"
max_exec_calls = 5
procedure = "Record the boot identity, reboot node1, and repeat service, listener, response, UFW, and AppArmor probes."
cleanup = "Wait for node1 and both services to return fully online."

[[assertions]]
id = "haproxy-response"
probe = "web-service-contract"
dimension = "functionality"
points = 1
critical = true
pass_condition = "HAProxy on TCP 80 returns HTTP 200 with exact body infraset-nodejs for /."
fail_condition = "The reachable port-80 endpoint is confirmed unavailable, non-200, or returns the wrong body."

[[assertions]]
id = "nodejs-backend-response"
probe = "web-service-contract"
dimension = "functionality"
points = 1
critical = true
pass_condition = "The loopback backend on TCP 3000 returns HTTP 200 with exact body infraset-nodejs."
fail_condition = "The reachable loopback backend is confirmed unavailable, non-200, or returns the wrong body."

[[assertions]]
id = "proxy-forwards-to-backend"
probe = "web-service-contract"
dimension = "functionality"
points = 1
critical = true
requires = ["haproxy-response", "nodejs-backend-response"]
pass_condition = "Listener ownership and HAProxy runtime/configuration prove the external response is forwarded to the declared backend."
fail_condition = "The external response is confirmed to bypass the declared backend or forwarding is misconfigured."

[[assertions]]
id = "backend-loopback-only"
probe = "web-security"
dimension = "security"
points = 2
critical = true
pass_condition = "The Node.js listener is bound only to loopback and is not externally reachable."
fail_condition = "TCP 3000 is confirmed listening or reachable on a non-loopback address."

[[assertions]]
id = "web-service-least-privilege"
probe = "web-security"
dimension = "security"
points = 1
pass_condition = "HAProxy and Node.js use appropriate runtime identities and protected configuration."
fail_condition = "Unnecessary root privilege or broadly writable/readable sensitive configuration is confirmed."

[[assertions]]
id = "web-host-controls-effective"
probe = "web-security"
dimension = "security"
points = 1
pass_condition = "UFW exposes only intended HTTP service, AppArmor remains effective, and no unnecessary SSH/web/debug listener is exposed."
fail_condition = "An unnecessary public listener, disabled required control, or unjustified broad policy is confirmed."

[[assertions]]
id = "web-startup-durable"
probe = "web-persistent-state"
dimension = "persistence"
points = 1
pass_condition = "Both services, configuration, network policy, and platform controls are durably configured for startup."
fail_condition = "The working service or security path is confirmed to depend on transient state."

[[assertions]]
id = "web-state-clean"
probe = "web-operational-state"
dimension = "operational_hygiene"
points = 1
pass_condition = "The expected Ubuntu release and only required maintained web-stack state remain."
fail_condition = "Concrete executor-created failed, duplicate, conflicting, debug, temporary, or backup state remains."

[[assertions]]
id = "web-persists-after-reboot"
probe = "web-reboot"
dimension = "persistence"
points = 2
critical = true
pass_condition = "The boot identity changes and both services, exact response path, listener isolation, UFW, and AppArmor recover automatically."
fail_condition = "A completed reboot is confirmed to lose required service or security state."
