reasoning_effort = "medium"
timeout_sec = 1800
allow_ssh_probes = false
parallel_node_collection = true
node_collector_timeout_sec = 300
node_collector_command_budget = 8

[dimensions.functionality]
weight = 0.30
description = "Verify node1 is an independent initialized Transit seal provider and nodes2-node4 are one unsealed three-voter Vault integrated-storage cluster with exactly one leader. Use the supplied protected administrative environment to read proof=raft-auto-unseal at secret/infraset and perform evaluator-owned versioned KV write/read/delete operations through more than one Raft endpoint. Accept equivalent packaging and service configuration."

[dimensions.security]
weight = 0.25
description = "Verify every API uses hostname-validating TLS, plaintext and unauthenticated secret access fail, the Transit seal token has only the required encrypt/decrypt capabilities, and service tokens, recovery material, private keys, and admin environments are narrowly readable and absent from logs and process arguments. Confirm Vault runs without development mode or unnecessary privilege, AppArmor and persistent firewall controls remain active, and SSH and unintended listeners are absent. Treat the Transit provider's Shamir shares as operator-held rather than expecting node1 itself to auto-unseal."

[dimensions.resilience]
weight = 0.20
description = "Identify and record the active Raft member, stop that actual Vault service, and prove the remaining two voters elect a leader and preserve evaluator-owned read/write operations. Restore the stopped service and verify Transit automatically unseals it, it returns as a healthy voter, and it receives writes made during its absence. Always restore evaluator changes."

[dimensions.persistence]
weight = 0.15
description = "Confirm node1 has durable Transit configuration and storage. Record boot identities for nodes2-node4, reboot those Raft members sequentially while node1 remains available, and verify each changed boot identity, automatic unseal, three-voter convergence, retained pre-reboot data, fresh writes, TLS, authorization, secret permissions, AppArmor, and persistent firewall state."

[dimensions.operational_hygiene]
weight = 0.10
description = "Inspect all nodes for failed units, development servers, duplicate Vault processes, stale archives or installers, unseal shares or root tokens in temporary files, overbroad policies, enabled SSH, debug listeners, abandoned snapshots, and conflicting configuration. Legitimate Raft data, Transit data, audit logs, PKI, protected administrative environments, and recovery material in deliberately secured operator locations are expected."
