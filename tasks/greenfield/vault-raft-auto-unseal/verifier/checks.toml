schema_version = 1

[[probes]]
id = "vault-raft-contract"
level = 1
targets = ["node1", "node2", "node3", "node4"]
effect = "evaluator_owned_data"
max_exec_calls = 11
procedure = "Inspect node1 as an independent initialized Transit seal provider and nodes2-node4 as one unsealed three-voter integrated-storage cluster with exactly one leader. Through protected administrative environments read proof=raft-auto-unseal and create/read/delete a unique versioned KV value through more than one Raft endpoint."
cleanup = "Delete evaluator KV state and leave the required proof secret and all four Vault services healthy."

[[probes]]
id = "vault-raft-security"
level = 2
targets = ["node1", "node2", "node3", "node4"]
max_exec_calls = 8
procedure = "Verify hostname-validating TLS and plaintext/unauthenticated denial on every API, Transit seal-token encrypt/decrypt-only capabilities, protected token/recovery/key/admin files, non-dev service privilege, AppArmor, firewall/listeners, SSH, and absence of secrets in arguments/logs without printing them."

[[probes]]
id = "vault-raft-operational-state"
level = 5
targets = ["node1", "node2", "node3", "node4"]
max_exec_calls = 5
procedure = "Inspect failed units, development/duplicate Vault processes, stale archives/installers, exposed shares/tokens, overbroad policies, debug listeners, abandoned snapshots, conflicting configuration, and executor-created residue."

[[probes]]
id = "vault-raft-leader-loss"
level = 6
targets = ["node2", "node3", "node4"]
effect = "controlled_failure"
max_exec_calls = 13
procedure = "Identify the active Raft leader, stop its actual Vault service, and prove the remaining two voters elect exactly one leader and complete evaluator KV write/read operations. Restore the stopped service and require Transit auto-unseal, healthy voter rejoin, and receipt of outage writes."
cleanup = "Restore the stopped service, wait for one leader and three healthy voters, and delete evaluator KV state."

[[probes]]
id = "vault-raft-representative-reboots"
level = 8
targets = ["node2", "node3"]
effect = "reboot"
max_exec_calls = 9
procedure = "Record boot identities, reboot node2 and node3 sequentially while node1 remains available, and after each verify automatic unseal, voter convergence, retained proof/evaluator data, fresh writes, TLS, and authorization."
cleanup = "Wait for three healthy voters and remove evaluator KV data."

[[probes]]
id = "vault-raft-final-reboot"
level = 10
targets = ["node4"]
effect = "reboot"
max_exec_calls = 6
procedure = "Record node4's boot identity, reboot it, and verify automatic unseal, complete voter recovery, retained proof, fresh multi-endpoint KV operations, and protected host state."
cleanup = "Wait for node4 to rejoin and remove evaluator KV data."

[[assertions]]
id = "vault-raft-required-topology"
probe = "vault-raft-contract"
dimension = "functionality"
points = 3
critical = true
pass_condition = "Node1 is an independent Transit provider and nodes2-node4 are one unsealed three-voter Raft cluster with exactly one leader."
fail_condition = "Authenticated live state confirms wrong role, sealed member, missing voter, split/no leader, or non-integrated storage topology."

[[assertions]]
id = "vault-raft-kv-service"
probe = "vault-raft-contract"
dimension = "functionality"
points = 2
critical = true
pass_condition = "proof=raft-auto-unseal is readable and evaluator versioned KV write/read/delete works through more than one Raft endpoint."
fail_condition = "Healthy authenticated endpoints confirm missing proof, inconsistent data, or failed multi-endpoint KV operations."

[[assertions]]
id = "vault-raft-tls-seal-token-protected"
probe = "vault-raft-security"
dimension = "security"
points = 2
critical = true
pass_condition = "Every API requires validated TLS/authentication and the Transit seal token is restricted to required encrypt/decrypt operations."
fail_condition = "A controlled probe confirms plaintext/unauthorized access, invalid TLS acceptance, or broader Transit token capability."

[[assertions]]
id = "vault-raft-secrets-hosts-protected"
probe = "vault-raft-security"
dimension = "security"
points = 1
pass_condition = "Tokens, recovery material, keys, and admin environments are narrowly readable and non-dev services plus AppArmor/firewall/listener controls are effective."
fail_condition = "Concrete evidence confirms exposed secret/recovery material, dev/overprivileged service, disabled controls, broad listener, or enabled SSH."

[[assertions]]
id = "vault-raft-state-clean"
probe = "vault-raft-operational-state"
dimension = "operational_hygiene"
points = 1
pass_condition = "Only required Transit/Raft storage, PKI, audit, protected administration, recovery, and operational state remains."
fail_condition = "Concrete failed, dev, duplicate, stale, overbroad, secret-bearing, debug, temporary, or abandoned executor state remains."

[[assertions]]
id = "vault-raft-survives-leader-loss"
probe = "vault-raft-leader-loss"
dimension = "resilience"
points = 3
critical = true
pass_condition = "With the active leader stopped, two voters elect one replacement and preserve new KV read/write service."
fail_condition = "The confirmed leader outage loses quorum, yields no/multiple leader, or makes evaluator KV operations unavailable."

[[assertions]]
id = "vault-raft-member-auto-rejoins"
probe = "vault-raft-leader-loss"
dimension = "resilience"
points = 2
critical = true
requires = ["vault-raft-survives-leader-loss"]
pass_condition = "The restored member auto-unseals, rejoins as a healthy current voter, and receives outage writes."
fail_condition = "The restored member needs repair/manual unseal, remains absent/stale, or lacks outage data."

[[assertions]]
id = "vault-raft-two-members-persist"
probe = "vault-raft-representative-reboots"
dimension = "persistence"
points = 2
critical = true
pass_condition = "Node2 and node3 change boot identities and auto-unseal, voter state, data, fresh writes, TLS, and authorization recover automatically."
fail_condition = "A completed representative reboot loses automatic unseal, membership, data, KV service, or protected access."

[[assertions]]
id = "vault-raft-all-members-persist"
probe = "vault-raft-final-reboot"
dimension = "persistence"
points = 1
critical = true
pass_condition = "Node4 changes boot identity and the complete secure three-voter cluster returns automatically with retained and fresh KV operations."
fail_condition = "Node4's completed reboot loses automatic unseal, voter convergence, data, API trust, or KV operations."
