reasoning_effort = "medium"
timeout_sec = 1500
allow_ssh_probes = false
parallel_node_collection = true
node_collector_timeout_sec = 300
node_collector_command_budget = 8

[dimensions.functionality]
weight = 0.30
description = "Inspect all four Debian 13 systems. Verify node1 and node2 are writable replicated Samba AD domain controllers for CORP.EXAMPLE with healthy directory, SYSVOL, DNS, and Kerberos roles; node3 is a joined member server rather than a controller; and node4 is a joined client using both controllers on the declared identity network. Confirm engineering and infrasetuser exist with the required membership. From node4, source /root/corp-user.env without exposing its values, obtain a Kerberos ticket, resolve the domain and both controllers, read engineering/welcome.txt containing infraset-samba, and create, modify, and remove an evaluator-owned file through SMB. Verify resulting ownership and engineering-group semantics on node3."

[dimensions.security]
weight = 0.20
description = "Verify Kerberos-backed domain access, rejection of anonymous and invalid-password share access, no SMB1, effective SMB signing, and encryption where supported by the chosen client/server path. Prove an ordinary non-engineering domain identity cannot write if one is safely available or can be created and removed by the evaluator. Confirm protected database, keytab, credential, and /root/corp-user.env permissions; least-privileged share filesystem ownership and ACLs; AppArmor enforcement; persistent host firewall rules limited to required identity-network peers and role-specific AD, DNS, Kerberos, and SMB ports; and no globally enabled SSH or management-network identity traffic. Avoid printing secrets into evidence."

[dimensions.resilience]
weight = 0.20
description = "Record replication state and stop one domain controller cleanly. While it is unavailable, force node4 and node3 to use the surviving controller, obtain a fresh Kerberos ticket, resolve CORP.EXAMPLE, and perform a new authenticated write and read through the engineering share. Where safe, create an evaluator-owned directory object or DNS record through the surviving controller. Restore the stopped controller and prove it rejoins with current directory, DNS, and SYSVOL state and can again authenticate the client. Always remove evaluator-created identities, records, and files and restore both controllers."

[dimensions.persistence]
weight = 0.20
description = "Record boot identities and reboot node1, node2, node3, and node4 sequentially while preserving directory and share availability. Confirm each identity changes and no evaluator repair occurs. Verify both controllers restore replication, DNS, Kerberos, and secure policy; node3 remains joined with the share and ACLs intact; node4 remains joined, uses both controllers, and obtains a fresh ticket; pre-reboot and post-reboot evaluator data remain accessible; and the one-controller-outage behavior still works after all reboots."

[dimensions.operational_hygiene]
weight = 0.10
description = "Inspect all nodes for failed Samba units, stale join attempts, conflicting resolver state, duplicate realm or workgroup configuration, abandoned provisioning scripts, plaintext passwords outside the declared protected credential file, keytab copies, database dumps, temporary mounts, package archives, debug logging, enabled SSH, unrelated directory services, and unnecessary listeners or firewall rules. Legitimate Samba databases, SYSVOL, DNS state, Kerberos caches with appropriate lifetime and permissions, share data, ACLs, logs, and packages are expected. Remove evaluator-created users, records, tickets, mounts, and files before finishing."
