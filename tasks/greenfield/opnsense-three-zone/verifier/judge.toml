reasoning_effort = "medium"
timeout_sec = 1500
allow_ssh_probes = false
parallel_node_collection = true
node_collector_timeout_sec = 300
node_collector_command_budget = 8

[dimensions.functionality]
weight = 0.35
description = "Inspect OPNsense node1 and all three Ubuntu 24.04 systems. Verify the declared addresses and routes use the WAN, LAN, and DMZ NICs rather than the management network. Exercise node2 HTTP directly from node3 at the declared DMZ service endpoint and through the OPNsense WAN address from node4 at the declared published endpoint, requiring a successful response containing infraset-dmz. Confirm the published connection is translated to node2 while the LAN connection is routed without unintended translation. Inspect effective pf state as well as persistent OPNsense configuration and score behavior rather than one XML layout."

[dimensions.security]
weight = 0.30
description = "Prove the effective stateful boundary from the intended source nodes. Node4 on WAN may reach only the published application path on the declared endpoint and must not initiate representative connections to LAN addresses, the OPNsense administrative plane, or undeclared DMZ ports. Node2 in DMZ must not initiate representative connections to node3 in LAN. Node3 in LAN may use the declared DMZ application and receive return traffic. Confirm no accidental management-network bypass, broad port-forward, any-any pass rule, exposed OPNsense web administration, or unnecessary Ubuntu listener. Verify protected OPNsense configuration, Ubuntu AppArmor, persistent host controls, least-privileged application service, and no globally enabled Ubuntu SSH. Preserve the platform-required management transport rule and do not penalize it when it is confined to the management interface."

[dimensions.persistence]
weight = 0.25
description = "Record boot identities and reboot node1, node2, node3, and node4 sequentially. Confirm every identity changes and no evaluator repair is needed. Verify OPNsense restores all three zone addresses, routes, pf rules, stateful policy, and DNAT; node2 restores its application and secure host controls; node3 and node4 restore their zone addressing and gateways; and the allowed and denied traffic matrix remains effective after all reboots."

[dimensions.operational_hygiene]
weight = 0.10
description = "Inspect OPNsense for valid saved configuration, unapplied changes, duplicate NAT or filter rules, stale backups outside normal configuration history, temporary scripts, packet captures, debug listeners, and unintended management exposure. Inspect Ubuntu nodes for failed units, temporary installers, archives, duplicate routes, unrelated proxies or web servers, enabled SSH, broad firewall openings, and conflicting network configuration. Legitimate OPNsense history, pf state, application files, logs, and platform management transport are expected. Remove evaluator-created probes and state before finishing."
