schema_version = 1

[[probes]]
id = "ssh-mesh"
level = 1
targets = ["node1", "node2", "node3"]
max_exec_calls = 6
procedure = "As clusterops on each source, connect noninteractively by stable name to both peers with strict host-key checking and return remote identity and hostname; inspect the operations document."

[[probes]]
id = "ssh-security"
level = 2
targets = ["node1", "node2", "node3"]
max_exec_calls = 6
procedure = "Inspect and negatively test root/password/keyboard-interactive login, forwarding, clusterops privilege/password, private-key uniqueness and modes, public-key distribution, strict host-key behavior, and network scope."

[[probes]]
id = "ssh-operational-state"
level = 5
targets = ["node1", "node2", "node3"]
max_exec_calls = 3
procedure = "Inspect extra accounts, shared/backup keys, temporary credentials, broad firewall rules, debug artifacts, conflicting SSH settings, duplicate host mappings, and unnecessary services."

[[probes]]
id = "sshd-interruption"
level = 6
targets = ["node1", "node2", "node3"]
effect = "controlled_failure"
max_exec_calls = 6
procedure = "Stop SSH on one node, verify both directed paths between the remaining pair, restart the service, and retest all paths involving the restored node."
cleanup = "Restart the stopped SSH service and confirm the full mesh and original security settings."

[[probes]]
id = "representative-ssh-reboots"
level = 8
targets = ["node1", "node2"]
effect = "reboot"
max_exec_calls = 8
procedure = "Record boot identities, reboot node1 and node2 sequentially, and retest every path involving each returned node."
cleanup = "Wait for both nodes and the full mesh to return online."

[[probes]]
id = "final-ssh-reboot"
level = 10
targets = ["node3"]
effect = "reboot"
max_exec_calls = 6
procedure = "Record node3's boot identity, reboot it, then retest all six paths and server security settings."
cleanup = "Wait for node3 and the full mesh to return online."

[[assertions]]
id = "six-directed-paths"
probe = "ssh-mesh"
dimension = "functionality"
points = 2
critical = true
pass_condition = "All six directed paths succeed noninteractively as clusterops to the correct stable peer name with strict host-key verification."
fail_condition = "Any properly invoked directed path is confirmed to fail, require interaction/root, relax host-key checking, or reach the wrong identity."

[[assertions]]
id = "ssh-operations-document"
probe = "ssh-mesh"
dimension = "functionality"
points = 1
pass_condition = "OPERATIONS.md accurately covers topology, six-path verification, reboot persistence, and interrupted-service recovery."
fail_condition = "The document is absent or materially incomplete/inaccurate for the live implementation."

[[assertions]]
id = "distinct-protected-private-keys"
probe = "ssh-security"
dimension = "security"
points = 1
critical = true
pass_condition = "Each node has a distinct protected Ed25519 private key and only public keys are distributed."
fail_condition = "A private key is shared, broadly readable, or distributed to another node."

[[assertions]]
id = "forbidden-ssh-auth-denied"
probe = "ssh-security"
dimension = "security"
points = 1
critical = true
pass_condition = "Root, password, and keyboard-interactive authentication are effectively disabled."
fail_condition = "Any forbidden authentication mode is confirmed usable."

[[assertions]]
id = "clusterops-unprivileged"
probe = "ssh-security"
dimension = "security"
points = 1
critical = true
pass_condition = "clusterops has no usable password, sudo authority, or unintended forwarding capability."
fail_condition = "clusterops is confirmed to have a usable password, sudo privilege, or forbidden forwarding."

[[assertions]]
id = "strict-host-key-verification"
probe = "ssh-security"
dimension = "security"
points = 1
pass_condition = "Every path uses strict host-key verification with correct peer keys."
fail_condition = "A path is confirmed to disable/relax host-key checking or trust an incorrect peer key."

[[assertions]]
id = "ssh-peer-network-scope"
probe = "ssh-security"
dimension = "security"
points = 1
pass_condition = "Persistent policy permits SSH from the two managed peers and restricts unrelated sources."
fail_condition = "SSH is confirmed broadly exposed beyond managed peers or required peer access depends on transient policy."

[[assertions]]
id = "ssh-state-clean"
probe = "ssh-operational-state"
dimension = "operational_hygiene"
points = 1
pass_condition = "Only required account, packages, keys, mappings, SSH configuration, firewall policy, and documentation remain."
fail_condition = "Concrete executor-created extra account/key, broad rule, debug, conflict, or temporary residue remains."

[[assertions]]
id = "remaining-pair-survives"
probe = "sshd-interruption"
dimension = "resilience"
points = 1
critical = true
pass_condition = "Both directed paths between unaffected nodes continue while the third SSH service is stopped."
fail_condition = "Stopping one SSH service is confirmed to break connectivity between the unaffected pair."

[[assertions]]
id = "stopped-node-rejoins"
probe = "sshd-interruption"
dimension = "resilience"
points = 1
critical = true
requires = ["remaining-pair-survives"]
pass_condition = "The restarted service returns to the full mesh without key regeneration, security relaxation, or repair."
fail_condition = "The restored service is reachable but cannot safely rejoin without repair."

[[assertions]]
id = "two-nodes-persist-after-reboot"
probe = "representative-ssh-reboots"
dimension = "persistence"
points = 1
critical = true
pass_condition = "Both boot identities change and all affected paths, names, keys, permissions, host-key checks, and policy recover automatically."
fail_condition = "A completed reboot is confirmed to lose any required path or security state."

[[assertions]]
id = "full-mesh-persists-after-reboot"
probe = "final-ssh-reboot"
dimension = "persistence"
points = 1
critical = true
pass_condition = "Node3's boot identity changes and the complete secured six-path mesh remains operational."
fail_condition = "The completed final reboot is confirmed to leave any path or security requirement broken."
