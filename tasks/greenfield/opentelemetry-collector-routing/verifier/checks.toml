schema_version = 1

[[probes]]
id = "otel-routing-contract"
level = 1
targets = ["node1", "node2", "node3"]
effect = "evaluator_owned_data"
max_exec_calls = 8
procedure = "Use node1's protected client identity to submit unique OTLP/HTTP JSON traces for payments, inventory, a missing namespace, and an unsupported namespace. Inspect the durable sinks on node2 and node3 and establish exclusive correct routing, rejection or discard of invalid namespaces, and no duplicate delivery."
cleanup = "Remove only evaluator trace records where safe, preserve pre-existing retained telemetry, and confirm no evaluator payload remains duplicated or cross-routed."

[[probes]]
id = "otel-transport-security"
level = 2
targets = ["node1", "node2", "node3"]
max_exec_calls = 6
procedure = "Test the gateway with validated TLS, missing client identity, invalid identity, and plaintext. Inspect collector-to-collector transport, key permissions, service identities, listeners, AppArmor, firewall, and SSH state without printing private material."

[[probes]]
id = "otel-operational-state"
level = 5
targets = ["node1", "node2", "node3"]
max_exec_calls = 4
procedure = "Inspect failed or duplicate collectors, conflicting pipelines, unused receivers/exporters, stale downloads, temporary PKI or credentials, debug listeners, and executor-created residue while preserving legitimate queues and durable sink data."

[[probes]]
id = "otel-downstream-loss"
level = 6
targets = ["node1", "node2"]
effect = "controlled_failure"
max_exec_calls = 9
procedure = "Record the payments sink, stop node2's actual Collector, submit one unique payments trace through node1, distinguish explicit rejection from accepted queued work, restore node2, and determine whether accepted work reaches only node2 exactly once."
cleanup = "Restore node2's Collector, wait for queues to settle, and remove the evaluator outage trace where safe."

[[probes]]
id = "otel-representative-reboots"
level = 8
targets = ["node1", "node2"]
effect = "reboot"
max_exec_calls = 8
procedure = "Record boot identities and retained trace markers, reboot node1 and node2 sequentially, then submit fresh payments and inventory traces and verify routing, retained evidence, and mutual trust."
cleanup = "Wait for both collectors, remove fresh evaluator traces where safe, and leave queues drained."

[[probes]]
id = "otel-final-reboot"
level = 10
targets = ["node3"]
effect = "reboot"
max_exec_calls = 5
procedure = "Record node3's boot identity, reboot it, and verify automatic service recovery, preserved inventory telemetry, fresh exclusive routing, and restored host controls."
cleanup = "Wait for node3 to recover and remove evaluator traces where safe."

[[assertions]]
id = "otel-payments-exclusive"
probe = "otel-routing-contract"
dimension = "functionality"
points = 3
critical = true
pass_condition = "A unique payments trace submitted through node1 appears in node2's durable sink and not node3's sink."
fail_condition = "Concrete sink evidence confirms the payments trace missing, cross-routed, or duplicated."

[[assertions]]
id = "otel-inventory-exclusive"
probe = "otel-routing-contract"
dimension = "functionality"
points = 3
critical = true
pass_condition = "A unique inventory trace submitted through node1 appears in node3's durable sink and not node2's sink."
fail_condition = "Concrete sink evidence confirms the inventory trace missing, cross-routed, or duplicated."

[[assertions]]
id = "otel-invalid-namespaces-contained"
probe = "otel-routing-contract"
dimension = "functionality"
points = 1
pass_condition = "Missing and unsupported namespaces are rejected or discarded and appear in neither durable sink."
fail_condition = "A missing or unsupported namespace is confirmed delivered to either declared sink."

[[assertions]]
id = "otel-mtls-required"
probe = "otel-transport-security"
dimension = "security"
points = 2
critical = true
pass_condition = "Gateway and inter-collector traffic use validated TLS with required client identities; plaintext and unauthenticated submissions fail."
fail_condition = "A controlled probe confirms plaintext, unauthenticated, invalid-identity, or unvalidated forwarding is accepted."

[[assertions]]
id = "otel-secrets-and-hosts-protected"
probe = "otel-transport-security"
dimension = "security"
points = 1
pass_condition = "Private material is narrowly readable and effective service identity, AppArmor, firewall, and listener state expose only required telemetry paths."
fail_condition = "Concrete evidence confirms exposed private material, unnecessary privilege/listener, disabled host control, or broad telemetry access."

[[assertions]]
id = "otel-state-clean"
probe = "otel-operational-state"
dimension = "operational_hygiene"
points = 1
pass_condition = "Only coherent required Collector, queue, durable-sink, PKI, log, and operational-client state remains."
fail_condition = "Concrete failed, duplicate, conflicting, debug, temporary, unsafe, or abandoned executor state remains."

[[assertions]]
id = "otel-downstream-recovery"
probe = "otel-downstream-loss"
dimension = "resilience"
points = 2
critical = true
pass_condition = "During node2 loss the gateway explicitly rejects payments work or durably queues accepted work; after restoration accepted work reaches node2 exactly once and never node3."
fail_condition = "Accepted outage work is silently lost, cross-routed, duplicated, or node2 does not recover automatically."

[[assertions]]
id = "otel-two-nodes-persist"
probe = "otel-representative-reboots"
dimension = "persistence"
points = 2
critical = true
pass_condition = "Node1 and node2 change boot identities and routing, retained data, fresh trace delivery, mutual trust, and controls recover automatically."
fail_condition = "A completed reboot loses required service, routing, retained telemetry, trust, or fresh delivery without repair."

[[assertions]]
id = "otel-all-nodes-persist"
probe = "otel-final-reboot"
dimension = "persistence"
points = 1
critical = true
pass_condition = "Node3 changes boot identity and the complete three-node routing service, inventory retention, and fresh exclusive delivery recover automatically."
fail_condition = "Node3's completed reboot loses required service, retained inventory data, exclusive routing, or host controls."
