reasoning_effort = "medium"
timeout_sec = 1500
allow_ssh_probes = false
parallel_node_collection = true
node_collector_timeout_sec = 300
node_collector_command_budget = 8

[dimensions.functionality]
weight = 0.35
description = "Submit evaluator-owned OTLP/HTTP JSON traces with unique IDs and service.namespace values payments and inventory through node1:4318 using the supplied client identity. Prove payments reaches only node2's durable sink and inventory only node3's sink. Verify missing and unsupported namespaces are rejected or discarded rather than delivered, and inspect the current routing connector/pipeline state without requiring one packaging layout. Remove evaluator telemetry where safe."

[dimensions.security]
weight = 0.25
description = "Verify validated TLS and a client certificate are required at node1, collector-to-collector forwarding is mutually authenticated and encrypted, private keys are narrowly readable, services use appropriate identities and capabilities, and persistent firewall policy exposes only required OTLP and management traffic to intended peers. Confirm AppArmor remains active, unknown namespaces cannot bypass routing, and SSH, plaintext receivers, debug extensions, and public telemetry sinks are absent."

[dimensions.resilience]
weight = 0.10
description = "Record sink state, briefly stop one downstream Collector, submit a trace for that route, restore the Collector, and determine from configured queue/retry behavior and retained evidence whether accepted work recovers without cross-routing or duplicate delivery. Restore all evaluator-changed services and distinguish explicit rejection during outage from silent misrouting."

[dimensions.persistence]
weight = 0.20
description = "Record boot identities and trace evidence, reboot all three systems sequentially, then submit fresh unique traces. Confirm changed boot identities, automatic service recovery, correct exclusive routing, preservation of pre-reboot sink evidence, working mTLS trust, protected keys, AppArmor, and persistent firewall controls."

[dimensions.operational_hygiene]
weight = 0.10
description = "Inspect all nodes for failed units, duplicate Collectors, stale downloads, temporary configs and certificates, world-readable keys, debug listeners, enabled SSH, unused exporters or receivers, and conflicting pipeline definitions. Legitimate Collector binaries, configuration, durable sink data, queues, logs, PKI, and diagnostic clients are expected."
