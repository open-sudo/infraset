schema_version = 1

[[probes]]
id = "nginx-three-node-contract"
level = 1
targets = ["node1", "node2", "node3"]
max_exec_calls = 3
procedure = "Address each Ubuntu node directly, obtain a successful response from its standard local HTTP endpoint, and corroborate that the response is provided by an active distribution-supported Nginx service."

[[probes]]
id = "nginx-three-node-operational-state"
level = 5
targets = ["node1", "node2", "node3"]
max_exec_calls = 3
procedure = "Inspect failed units, duplicate or conflicting web servers, modified replacement content not required by the task, unnecessary identities or packages, debug processes, stale configuration backups, and executor-created temporary residue."

[[probes]]
id = "nginx-representative-reboots"
level = 8
targets = ["node1", "node2"]
effect = "reboot"
max_exec_calls = 8
procedure = "Record boot identities, reboot node1 and node2 sequentially, and confirm each distribution-supported Nginx service and standard HTTP endpoint return automatically."
cleanup = "Wait for both nodes and their HTTP endpoints to return fully online."

[[probes]]
id = "nginx-remaining-reboot"
level = 10
targets = ["node3"]
effect = "reboot"
max_exec_calls = 4
procedure = "Record node3's boot identity, reboot it, and confirm its Nginx service and standard HTTP endpoint return automatically."
cleanup = "Wait for all three Nginx endpoints to be operational."

[[assertions]]
id = "nginx-node1-http"
probe = "nginx-three-node-contract"
dimension = "functionality"
points = 1
critical = true
pass_condition = "Node1's active distribution-supported Nginx service returns a successful response from its standard local HTTP endpoint."
fail_condition = "Node1 is reachable but Nginx is confirmed inactive or its standard local HTTP endpoint fails."

[[assertions]]
id = "nginx-node2-http"
probe = "nginx-three-node-contract"
dimension = "functionality"
points = 1
critical = true
pass_condition = "Node2's active distribution-supported Nginx service returns a successful response from its standard local HTTP endpoint."
fail_condition = "Node2 is reachable but Nginx is confirmed inactive or its standard local HTTP endpoint fails."

[[assertions]]
id = "nginx-node3-http"
probe = "nginx-three-node-contract"
dimension = "functionality"
points = 1
critical = true
pass_condition = "Node3's active distribution-supported Nginx service returns a successful response from its standard local HTTP endpoint."
fail_condition = "Node3 is reachable but Nginx is confirmed inactive or its standard local HTTP endpoint fails."

[[assertions]]
id = "nginx-three-node-state-clean"
probe = "nginx-three-node-operational-state"
dimension = "operational_hygiene"
points = 1
pass_condition = "Only the distribution-supported Nginx package, service, default content/configuration, logs, and necessary platform state remain."
fail_condition = "Concrete executor-created unnecessary users, packages, services, replacement content, debug state, stale backups, or temporary artifacts remain."

[[assertions]]
id = "nginx-two-nodes-persist"
probe = "nginx-representative-reboots"
dimension = "persistence"
points = 2
critical = true
pass_condition = "Node1 and node2 have changed boot identities and their Nginx services plus standard HTTP endpoints recover automatically."
fail_condition = "A completed representative reboot is confirmed to lose Nginx startup or successful HTTP behavior."

[[assertions]]
id = "nginx-all-nodes-persist"
probe = "nginx-remaining-reboot"
dimension = "persistence"
points = 1
critical = true
pass_condition = "Node3 has changed boot identity and all three Nginx HTTP endpoints are operational without repair."
fail_condition = "Node3's completed reboot is confirmed to lose Nginx startup or successful HTTP behavior."
