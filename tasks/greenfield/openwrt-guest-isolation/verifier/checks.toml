schema_version = 1

[[probes]]
id = "openwrt-service-contract"
level = 1
targets = ["node1", "node2", "node3", "node4"]
max_exec_calls = 8
procedure = "Inspect effective and committed OpenWrt network, DHCP, DNS, NAT, and routing state plus every Ubuntu private address and route. From node4 resolve app.home.test and request node2:8080; from node3 prove DNS and representative internet HTTPS use node1."

[[probes]]
id = "openwrt-isolation-boundary"
level = 2
targets = ["node1", "node2", "node3", "node4"]
max_exec_calls = 8
procedure = "From node3 use its guest interface and route to test representative ICMP, TCP including node2:8080, and UDP into trusted addresses while confirming guest DNS/WAN remains usable and node4 still reaches the application. Inspect effective firewall zones and exposure without using management-path failures as evidence."

[[probes]]
id = "openwrt-operational-state"
level = 5
targets = ["node1", "node2", "node3", "node4"]
max_exec_calls = 5
procedure = "Inspect uncommitted or duplicate UCI state, abandoned redirects and scripts, captures, debug/private-interface administration, failed Ubuntu services, stale DHCP or routes, unrelated listeners, and executor-created residue."

[[probes]]
id = "openwrt-gateway-app-reboots"
level = 8
targets = ["node1", "node2"]
effect = "reboot"
max_exec_calls = 8
procedure = "Record boot identities, reboot gateway node1 and application node2 sequentially, and after each recovery retest reservations, DNS, WAN, trusted application access, guest isolation, and saved policy."
cleanup = "Wait for DHCP leases and services to converge and remove evaluator probe artifacts."

[[probes]]
id = "openwrt-client-reboots"
level = 10
targets = ["node3", "node4"]
effect = "reboot"
max_exec_calls = 7
procedure = "Record boot identities, reboot guest node3 and trusted node4 sequentially, then verify their exact reservations, routes, DNS, guest WAN, trusted application access, and guest denial boundary."
cleanup = "Wait for both clients to reacquire their declared state and remove evaluator probes."

[[assertions]]
id = "openwrt-addressing-services"
probe = "openwrt-service-contract"
dimension = "functionality"
points = 2
critical = true
pass_condition = "Node1 owns both gateway addresses; node2, node3, and node4 receive the exact reservations and use node1 for private DNS and routing."
fail_condition = "Live state confirms a wrong reservation, gateway, DNS path, or missing DHCP/DNS service."

[[assertions]]
id = "openwrt-application-and-wan"
probe = "openwrt-service-contract"
dimension = "functionality"
points = 3
critical = true
pass_condition = "app.home.test resolves to the declared trusted service address, node4 receives infraset-trusted from TCP 8080, and node3 has working DNS and internet HTTPS through node1."
fail_condition = "A correctly sourced intended-client probe confirms name resolution, application access, guest DNS, or guest WAN unavailable."

[[assertions]]
id = "openwrt-guest-isolated"
probe = "openwrt-isolation-boundary"
dimension = "security"
points = 3
critical = true
pass_condition = "Guest-originated representative ICMP, TCP, and UDP into trusted are denied while guest DNS/WAN and trusted application access remain working."
fail_condition = "A guest-private-path probe confirms initiation into trusted, or the supposed denial is only a broken guest prerequisite."

[[assertions]]
id = "openwrt-private-admin-contained"
probe = "openwrt-isolation-boundary"
dimension = "security"
points = 1
pass_condition = "Committed zone and input policy expose no unnecessary administrative service on guest or trusted interfaces and Ubuntu host controls remain active."
fail_condition = "Concrete evidence confirms unintended private-interface administration, broad forwarding, disabled host control, or unnecessary Ubuntu service exposure."

[[assertions]]
id = "openwrt-state-clean"
probe = "openwrt-operational-state"
dimension = "operational_hygiene"
points = 1
pass_condition = "Gateway and clients retain only coherent required network, application, lease, log, and platform-management state."
fail_condition = "Concrete uncommitted, duplicate, debug, stale, failed, unsafe, or evaluator-created residue remains."

[[assertions]]
id = "openwrt-core-systems-persist"
probe = "openwrt-gateway-app-reboots"
dimension = "persistence"
points = 3
critical = true
pass_condition = "Node1 and node2 change boot identities and saved gateway, DHCP, DNS, NAT, firewall, application, allowed access, and isolation recover automatically."
fail_condition = "A completed gateway or application reboot loses a required service, policy, address, route, or traffic outcome without repair."

[[assertions]]
id = "openwrt-all-systems-persist"
probe = "openwrt-client-reboots"
dimension = "persistence"
points = 2
critical = true
pass_condition = "Node3 and node4 change boot identities, regain exact reservations and routes, and the complete allowed/denied traffic contract still holds."
fail_condition = "A completed client reboot loses its declared identity, DNS/route, WAN/application access, or isolation boundary."
