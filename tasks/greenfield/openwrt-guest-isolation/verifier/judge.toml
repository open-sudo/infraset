reasoning_effort = "medium"
timeout_sec = 1500
allow_ssh_probes = false
parallel_node_collection = true
node_collector_timeout_sec = 300
node_collector_command_budget = 8

[dimensions.functionality]
weight = 0.35
description = "Inspect OpenWrt node1 and all three Ubuntu 24.04 systems. Verify node2 and node4 obtain the declared trusted reservations, node3 obtains the declared guest reservation, and their private-network routes and DNS use node1 rather than the management NIC. Confirm both networks receive working DHCP and DNS, app.home.test resolves to the declared trusted service address, node4 reaches node2 TCP 8080 with a response containing infraset-trusted, and representative internet DNS and HTTPS traffic from node3 traverses OpenWrt. Check effective runtime state and committed UCI state without requiring one section ordering."

[dimensions.security]
weight = 0.30
description = "Prove from node3 that guest clients cannot initiate representative ICMP, TCP, or UDP sessions into the trusted network, including node2 TCP 8080 and node4, while DNS, DHCP, stateful return traffic, and WAN access still work. Confirm trusted clients are not restricted from the declared application. Detect management-network bypass when testing private policy. Verify OpenWrt input and forwarding defaults, zone membership, scoped DHCP, absence of unintended guest-to-trusted forwarding or port forwards, protected UCI state, and no unnecessary administrative exposure on trusted or guest interfaces. On Ubuntu, verify AppArmor and persistent host controls remain active, the application is least privileged, and SSH is not globally enabled. Preserve the platform-required management transport rule and do not score it as guest exposure."

[dimensions.persistence]
weight = 0.25
description = "Record boot identities and reboot node1 through node4 sequentially. Confirm every boot changes and no evaluator repair is required. Verify committed OpenWrt network, DHCP, DNS, firewall, and NAT state returns; all reservations and app.home.test remain correct; the application and host routes return; guest WAN access and trusted application access still work; and the guest-to-trusted denial boundary remains effective after all reboots."

[dimensions.operational_hygiene]
weight = 0.10
description = "Inspect OpenWrt for uncommitted UCI changes, duplicate zones or forwardings, abandoned redirect rules, temporary scripts, package archives, packet captures, debug services, and unintended LuCI or SSH exposure on private interfaces. Inspect Ubuntu nodes for stale DHCP client state that conflicts with the required reservations, duplicate default routes, temporary installers, unrelated network services, failed units, enabled SSH, and unnecessary firewall openings. Legitimate leases, dnsmasq state, application files, logs, and platform management transport are expected. Remove evaluator-created probes before finishing."
