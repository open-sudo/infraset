reasoning_effort = "medium"
timeout_sec = 1800
allow_ssh_probes = false

[dimensions.functionality]
weight = 0.35
description = "All three nodes run one healthy MariaDB Galera Primary component. Every member is connected, ready, synchronized, and writable; committed InnoDB data written through any member is available through both other members, and all members share the same cluster state."

[dimensions.security]
weight = 0.20
description = "Database accounts, Galera state-transfer credentials, configuration files, and privileges follow least privilege. MariaDB and Galera traffic is limited to the three cluster members, unnecessary listeners and broad firewall access are absent, AppArmor remains effective, and no unrelated security control is weakened."

[dimensions.persistence]
weight = 0.20
description = "After each of node1, node2, and node3 is rebooted, the member returns automatically to the same three-node Primary component with its data, database hardening, firewall policy, AppArmor state, and service enablement intact."

[dimensions.resilience]
weight = 0.20
description = "With any one MariaDB member stopped, the remaining two-member Primary component stays writable and replicates new data. After restoration, the unavailable member synchronizes the missed write and rejoins without rebuilding the cluster, weakening security, or requiring manual repair."

[dimensions.operational_hygiene]
weight = 0.05
description = "The nodes contain only the accounts, packages, services, firewall rules, persistent configuration, and credentials needed for the MariaDB Galera service, with no unnecessary SSH exposure, debug settings, temporary files, stale backups, test data, conflicting configuration, or troubleshooting residue."
