reasoning_effort = "medium"
timeout_sec = 900
allow_ssh_probes = false
parallel_node_collection = true
node_collector_timeout_sec = 180
node_collector_command_budget = 8
coordinator_command_budget = 48

[dimensions.functionality]
weight = 0.45
description = "Verify node1 publishes the required curated RHEL 8.8 DNF repository and public key at the specified URL, node2 discovers zsh from repository offline-rhel8, the exact priority policy is effective, zsh has local-repository provenance, and an isolated DNF transaction can reinstall it with every external repository disabled."

[dimensions.security]
weight = 0.25
description = "Verify node2 enforces RPM and repository-metadata GPG checks with explicit trust, the live metadata signature and every mirrored RPM signature are valid, private signing material is protected, and node1 retains enforcing RHEL security controls, bounded TCP 8080 exposure, safe ownership, and no unintended HTTP listener."

[dimensions.persistence]
weight = 0.20
description = "Reboot both RHEL systems, prove both boot identities changed, and confirm without repair that repository publication, client discovery, priority, metadata and package signature verification, host controls, key protection, and an offline-rhel8-only zsh reinstall all remain operational."

[dimensions.operational_hygiene]
weight = 0.10
description = "Inspect both nodes for executor-created failed units, conflicting repository definitions or web servers, stale staging content, abandoned downloads or scripts, debug processes, insecure key copies, disabled controls, unrelated changes, and unintended listeners while preserving legitimate repository-maintenance state."
