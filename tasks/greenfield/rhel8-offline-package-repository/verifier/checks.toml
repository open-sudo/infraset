schema_version = 1

[[probes]]
id = "offline-repository-smoke"
level = 1
targets = ["node1", "node2"]
max_exec_calls = 7
procedure = "From node2, resolve node1 through the managed cluster naming, fetch http://node1:8080/offline-rhel8/repodata/repomd.xml and the published repository public key, and inspect DNF's effective offline-rhel8 repository state. Prove with DNF repository-query evidence that zsh and its installable architecture are available specifically from offline-rhel8. Corroborate on node1 that the successful responses are served by the intended persistent repository HTTP service."

[[probes]]
id = "repository-client-policy"
level = 2
targets = ["node2"]
max_exec_calls = 7
procedure = "Inspect node2's effective DNF configuration for every repository. Establish that offline-rhel8 is enabled, uses the required node1 URL, has numeric priority 10, enables both gpgcheck and repo_gpgcheck, and references explicit locally or repository-published public keys. Establish that every other enabled repository has numeric priority 90 or greater. Confirm zsh is installed and use DNF or RPM provenance evidence to identify the installed package as one offered by offline-rhel8 without relying only on a matching package name."

[[probes]]
id = "repository-cryptographic-integrity"
level = 3
targets = ["node1", "node2"]
effect = "evaluator_owned_data"
max_exec_calls = 10
procedure = "Using only evaluator-owned temporary directories, fetch the published public key, repomd.xml, and its detached signature from node1 and verify the metadata signature cryptographically. Inspect every mirrored RPM with rpmkeys or an equivalent RPM-native verifier and establish that each has a valid trusted Red Hat package signature. Confirm the metadata-signing public key matches node2's configured trust reference and that private signing material is absent from node2 and the HTTP document tree."
cleanup = "Remove only evaluator-created keyrings, downloaded metadata, signature copies, and other temporary verification files from both nodes. Do not alter repository content, trust configuration, or installed packages."

[[probes]]
id = "offline-client-transaction"
level = 5
targets = ["node2"]
effect = "evaluator_owned_data"
max_exec_calls = 7
procedure = "On node2, first confirm zsh is installed. Perform a noninteractive reinstall of zsh with every repository disabled except offline-rhel8, forcing DNF to obtain and verify the package through the local mirror rather than accepting a pre-existing process or an external repository. Record the selected repository, transaction result, and final installed package state. Treat inability to establish the initial installed state as a task failure, not as proof of offline behavior."
cleanup = "Ensure zsh remains installed in the requested state, remove only evaluator-created temporary files, and leave the candidate's repository configuration unchanged."

[[probes]]
id = "repository-server-security"
level = 6
targets = ["node1", "node2"]
max_exec_calls = 8
procedure = "Inspect node1's live service, sockets, SELinux mode and effective port policy, runtime and permanent firewalld policy, repository ownership and modes, signing-key protection, and HTTP configuration. From node2 establish the positive TCP 8080 repository path before evaluating access controls. Confirm the repository is available over the managed network without an unintended default HTTP listener, directory escape, broadly writable content, exposed private key, disabled mandatory controls, or unrelated service exposure."

[[probes]]
id = "repository-operational-hygiene"
level = 7
targets = ["node1", "node2"]
max_exec_calls = 7
procedure = "Inspect both nodes for executor-created failed units, conflicting repository definitions, duplicate web servers, stale repository staging trees, abandoned downloads or scripts, debug processes, insecure key copies, disabled host controls, unrelated users or packages, and unintended listeners. Accept the packages, caches, logs, repository data, signing material, configuration, and services genuinely required to maintain the requested offline repository."

[[probes]]
id = "repository-reboot-persistence"
level = 10
targets = ["node1", "node2"]
effect = "reboot"
max_exec_calls = 14
procedure = "Record both nodes' boot identities and the complete repository endpoint, DNF policy, GPG verification, priority, package provenance, SELinux, firewall, and service state. Reboot both nodes, wait for each to return, and prove both boot identities changed. Without repair, repeat the node2-to-node1 metadata and key fetch, DNF repository query for zsh, effective priority and GPG-policy inspection, and an offline-rhel8-only zsh reinstall. Confirm the repository HTTP service and required host controls returned automatically."
cleanup = "Wait for both nodes and the TCP 8080 repository endpoint to return fully online. Ensure zsh remains installed and remove only evaluator-owned temporary observations or downloads without repairing candidate configuration."

[[assertions]]
id = "repository-endpoint-publishes-metadata"
probe = "offline-repository-smoke"
dimension = "functionality"
points = 1
critical = true
pass_condition = "Node2 resolves node1 and successfully retrieves valid offline-rhel8 repository metadata and the published public key from the required TCP 8080 URL, with node1 service evidence corroborating the endpoint."
fail_condition = "The nodes are reachable, but the required URL, repository metadata, public key, or intended persistent HTTP service is confirmed absent or unusable."

[[assertions]]
id = "client-discovers-zsh-from-offline-repository"
probe = "offline-repository-smoke"
dimension = "functionality"
points = 2
critical = true
pass_condition = "DNF on node2 recognizes enabled repository offline-rhel8 and repository-query evidence confirms an installable RHEL 8 zsh package is supplied specifically by it."
fail_condition = "DNF is operational, but offline-rhel8 is absent or disabled, or zsh is not available from that repository."

[[assertions]]
id = "client-enforces-repository-priorities"
probe = "repository-client-policy"
dimension = "functionality"
points = 1
pass_condition = "The effective offline-rhel8 priority is exactly 10 and every other enabled repository has a numeric priority of at least 90."
fail_condition = "Effective DNF configuration confirms a different offline-rhel8 priority or another enabled repository with priority below 90."

[[assertions]]
id = "client-enforces-gpg-policy"
probe = "repository-client-policy"
dimension = "security"
points = 2
critical = true
pass_condition = "Node2's effective offline-rhel8 configuration enables both RPM-package and repository-metadata GPG checks and references explicit public trust keys without an insecure bypass."
fail_condition = "Effective configuration confirms gpgcheck or repo_gpgcheck disabled, missing trust-key references, blanket signature acceptance, or another verification bypass."

[[assertions]]
id = "zsh-installed-with-local-provenance"
probe = "repository-client-policy"
dimension = "functionality"
points = 1
pass_condition = "Zsh is installed on node2 and concrete DNF or RPM evidence ties the installed build to the package offered by offline-rhel8."
fail_condition = "Zsh is confirmed absent or its installed build cannot match the package available from offline-rhel8 despite complete provenance evidence."

[[assertions]]
id = "repository-metadata-signature-valid"
probe = "repository-cryptographic-integrity"
dimension = "security"
points = 1
critical = true
pass_condition = "A dedicated published public key cryptographically verifies the detached signature for the live offline-rhel8 repomd.xml, and it matches node2's configured metadata trust."
fail_condition = "The live metadata has no verifiable detached signature, verifies under an unrelated key, or node2 is configured to trust a different or unavailable key."

[[assertions]]
id = "mirrored-rpm-signatures-valid"
probe = "repository-cryptographic-integrity"
dimension = "security"
points = 1
critical = true
pass_condition = "Every RPM exposed by offline-rhel8 passes RPM-native signature verification with its preserved trusted Red Hat signature."
fail_condition = "Any mirrored RPM is unsigned, has a bad or untrusted signature, or has been altered after signing."

[[assertions]]
id = "private-signing-key-protected"
probe = "repository-cryptographic-integrity"
dimension = "security"
points = 1
pass_condition = "Metadata-signing private material is absent from node2 and the HTTP document tree and is protected against non-administrative access on node1."
fail_condition = "Private signing material is confirmed exposed through HTTP, copied to node2, broadly readable, or broadly writable."

[[assertions]]
id = "client-consumes-repository-offline"
probe = "offline-client-transaction"
dimension = "functionality"
points = 2
critical = true
pass_condition = "With every other repository disabled, node2 successfully reinstalls zsh noninteractively from offline-rhel8 with signature verification active and retains a healthy installed package."
fail_condition = "The isolated DNF transaction reaches offline-rhel8 but cannot obtain, verify, or reinstall zsh, requires another repository, or leaves zsh absent or broken."

[[assertions]]
id = "repository-server-controls-effective"
probe = "repository-server-security"
dimension = "security"
points = 1
critical = true
pass_condition = "The required managed-network TCP 8080 path works while SELinux remains enforcing, persistent firewall and service policy support that path, repository content is not broadly writable, and no private key or unintended HTTP listener is exposed."
fail_condition = "Positive-path prerequisites are established, but effective evidence confirms disabled mandatory controls, missing persistent access policy, broad write access, private-key exposure, or an unintended HTTP listener."

[[assertions]]
id = "repository-state-clean"
probe = "repository-operational-hygiene"
dimension = "operational_hygiene"
points = 1
pass_condition = "Both nodes retain only the packages, repository data, keys, configuration, caches, logs, and services needed for the requested repository plus normal RHEL state, without concrete executor-created residue or conflicts."
fail_condition = "Concrete executor-created failed, conflicting, stale, debug, insecure, unrelated, abandoned, or unintended state remains."

[[assertions]]
id = "repository-functionality-persists-after-reboot"
probe = "repository-reboot-persistence"
dimension = "persistence"
points = 2
critical = true
pass_condition = "Both boot identities change and, without repair, node1 automatically serves the required metadata and key while node2 discovers zsh and completes an offline-rhel8-only reinstall."
fail_condition = "A completed reboot is confirmed not to change both boot identities or loses automatic repository service, client discovery, required content, or isolated zsh consumption."

[[assertions]]
id = "repository-policy-persists-after-reboot"
probe = "repository-reboot-persistence"
dimension = "persistence"
points = 1
critical = true
requires = ["repository-functionality-persists-after-reboot"]
pass_condition = "After the confirmed reboots, priority 10, both GPG checks, explicit trust, SELinux enforcement, persistent firewall policy, package signature validity, and protected signing material remain effective."
fail_condition = "After the confirmed reboots, any required priority, signature-verification, trust, host-control, package-integrity, or private-key protection property is lost."
