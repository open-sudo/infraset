reasoning_effort = "medium"
timeout_sec = 1200
allow_ssh_probes = false

[dimensions.functionality]
weight = 0.45
description = "Verify live behavior across all four nodes. Node1 must route between the two LANs using its assigned LAN addresses. Node2 must be the Kubernetes control plane on lan-a; node3 and node4 must be workers on lan-b; all three Ubuntu nodes must be Ready in one cluster and advertise LAN rather than management addresses. Deploy an evaluator-owned workload with one pod per Kubernetes node and prove direct pod-to-pod HTTP from lan-a to lan-b, ClusterIP service access, and cluster DNS. Confirm that cross-LAN node and overlay traffic actually uses the VyOS path. Accept any sound Kubernetes distribution and CNI; score behavior rather than file layout or product choice."

[dimensions.security]
weight = 0.20
description = "Verify effective security without requiring cargo-cult VyOS rules. Kubernetes control and data traffic must use the two LANs, while the management network serves only acquisition. Confirm authenticated API access, protected kubeconfigs, join tokens, PKI keys and service-account material, least-privilege file modes, no anonymous administrative access, and no unnecessary management-network exposure. Check applicable Ubuntu host firewall policy, AppArmor enforcement, disabled swap where required by the chosen runtime, secure control-plane and kubelet endpoints, and absence of unnecessary SSH. On VyOS, confirm forwarding is intentional and persistent without unnecessary cross-LAN NAT; an absent VyOS firewall is not itself a defect when no restrictive policy was requested."

[dimensions.persistence]
weight = 0.25
description = "Record every boot identity and reboot node1 through node4. Confirm each boot changed and no evaluator repair was needed. Verify that VyOS restores both LAN addresses and forwarding, each Ubuntu host restores its route through VyOS, all three Kubernetes members become Ready with the same LAN roles, cluster state and DNS return, and an evaluator workload again communicates directly and through a ClusterIP across the LAN boundary."

[dimensions.operational_hygiene]
weight = 0.10
description = "Inspect all nodes for abandoned installer scripts, temporary manifests and logs, stale backups, duplicate CNI or Kubernetes installations, unnecessary container engines, enabled SSH, failed task services, debug configuration, insecure credential copies, unrelated firewall/NAT changes, or conflicting routes. Legitimate Kubernetes runtime images, CNI state, manifests, certificates, and VyOS saved configuration are expected. Remove all evaluator-created workloads, files, and probes before finishing."
