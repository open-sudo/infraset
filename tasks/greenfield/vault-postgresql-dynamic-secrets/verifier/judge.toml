reasoning_effort = "medium"
timeout_sec = 1200
allow_ssh_probes = false
parallel_node_collection = true
node_collector_timeout_sec = 240
node_collector_command_budget = 9

[dimensions.functionality]
weight = 0.40
description = "Verify node1 provides an initialized, unsealed production Vault HTTPS API with the database engine mounted at database/, connection pg-main, and role infraset-app using 30-second default and 60-second maximum leases. Obtain at least two distinct dynamic credentials through the protected client environment and prove each can perform only the declared DML against node2:infraset.public.credential_probe over hostname-validating PostgreSQL TLS. Revoke one exact returned lease and prove its PostgreSQL login stops authenticating promptly. Allow another lease to expire and prove it also stops authenticating without operator action. Confirm fresh credentials continue to work afterward."

[dimensions.security]
weight = 0.25
description = "Verify Vault and PostgreSQL use hostname-validating TLS and reject plaintext or unauthenticated access. Confirm the client token can inspect and issue only infraset-app credentials and revoke returned leases without root, sudo, engine-management, policy-management, or unrelated secret access. Verify generated PostgreSQL roles are unique, non-superuser, non-CREATEROLE, non-CREATEDB, non-replication logins limited to the declared database, schema, and table operations. Inspect the Vault PostgreSQL manager account, SCRAM authentication, narrow pg_hba and firewall scope, service identities, protected tokens/private keys/client files, AppArmor, and absence of enabled SSH or unintended listeners."

[dimensions.persistence]
weight = 0.20
description = "Record boot identities, reboot node1 and node2 sequentially, and verify each boot identity changes. Confirm Vault returns initialized and unsealed, PostgreSQL returns ready, the database engine connection and role retain their TTLs and policies, TLS remains valid, client variables remain protected, and a newly issued credential can perform declared DML and be revoked after both reboots."

[dimensions.operational_hygiene]
weight = 0.15
description = "Inspect both systems for failed units, development-mode Vault processes, duplicate services, stale dynamic PostgreSQL roles after revocation and expiration, plaintext credentials in process arguments or broadly readable files, temporary response files, abandoned downloads or installers, enabled SSH, unnecessary packages/listeners/firewall rules, and conflicting Vault or PostgreSQL configuration. Legitimate Vault storage, PostgreSQL data, PKI, audit logs, and protected operational credentials are expected."
