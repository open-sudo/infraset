schema_version = 1

[[probes]]
id = "postgresql-live-topology"
level = 1
targets = ["node1", "node2", "node3"]
max_exec_calls = 7
procedure = "Discover the installed PostgreSQL service and a working protected local administrative client method on each node. Inspect live recovery and replication views directly to establish that node1 is writable and not in recovery, node2 and node3 are read-only streaming standbys, and node1 has both standbys connected and streaming over the database network. Diagnose local client or service layout differences instead of assuming one package path."

[[probes]]
id = "postgresql-replication-io"
level = 1
targets = ["node1", "node2", "node3"]
effect = "evaluator_owned_data"
max_exec_calls = 8
procedure = "Using the discovered protected local PostgreSQL access, create a uniquely named evaluator schema and table on node1, commit a distinctive value, and poll both standbys until that exact value is returned. Confirm the write originated on node1 and neither standby accepts a normal write."
cleanup = "Drop only the evaluator-owned schema on node1, wait for its removal to replicate to both standbys, and confirm no evaluator database objects remain."

[[probes]]
id = "postgresql-security-state"
level = 2
targets = ["node1", "node2", "node3"]
max_exec_calls = 10
procedure = "Inspect effective PostgreSQL authentication, the live replication login, listeners, active connections, data and credential file ownership and modes, SELinux state and process labels, and firewalld runtime and persistent policy on every node. Confirm the replication role is dedicated and non-superuser with a SCRAM verifier; reject effective trust, password, or MD5 host authentication. Establish required connectivity over the declared replication network and verify that PostgreSQL exposure is confined to that network or narrower member-specific addresses, accepting equivalent secure HBA and firewalld layouts."

[[probes]]
id = "postgresql-operational-state"
level = 5
targets = ["node1", "node2", "node3"]
max_exec_calls = 4
procedure = "Inspect failed services, duplicate or conflicting PostgreSQL instances and configuration, executor-created databases or test tables, debug settings, unrelated database or proxy packages, unnecessary listeners, setup scripts, stale backups and temporary files, and insecure credential residue. Treat a PostgreSQL-owned mode-0600 .pgpass required for streaming as legitimate."

[[probes]]
id = "postgresql-standby-reboots"
level = 8
targets = ["node1", "node2", "node3"]
effect = "reboot"
max_exec_calls = 14
procedure = "Create a uniquely named evaluator replication marker on node1, record node2 and node3 boot identities, reboot the standbys sequentially with convergence after each reboot, and prove both identities changed. Verify each standby automatically returns read-only and streaming, retains the marker, node1 again sees two streaming standbys, and SELinux, credential protection, and firewalld scope remain effective."
cleanup = "Wait for both standbys to return to streaming, restore no configuration, and remove the evaluator-owned replication marker on node1 with replicated removal confirmed on node2 and node3."

[[probes]]
id = "postgresql-primary-reboot"
level = 10
targets = ["node1", "node2", "node3"]
effect = "reboot"
max_exec_calls = 12
procedure = "Create a uniquely named evaluator replication marker, record node1's boot identity, reboot node1, and prove its identity changed. Confirm node1 automatically returns as the writable primary, both standbys reconnect streaming and retain the pre-reboot marker, then commit a new post-reboot value on node1 and prove it reaches both standbys while security controls remain effective. Automatic promotion is not required."
cleanup = "Wait for the original primary and both standbys to be healthy, remove all evaluator-owned replication state through node1, and confirm replicated removal without changing topology."

[[assertions]]
id = "postgresql-primary-writable"
probe = "postgresql-live-topology"
dimension = "functionality"
points = 2
critical = true
pass_condition = "Node1's live PostgreSQL service is healthy, not in recovery, and reports normal transactions as writable."
fail_condition = "Node1 is reachable but PostgreSQL is absent, unhealthy, in recovery, or reports normal transactions as read-only."

[[assertions]]
id = "postgresql-two-streaming-standbys"
probe = "postgresql-live-topology"
dimension = "functionality"
points = 3
critical = true
pass_condition = "Node2 and node3 are both live read-only standbys in recovery with active streaming receivers, and node1 reports both connected in streaming state."
fail_condition = "Live views confirm either standby writable, absent, disconnected, not in recovery, not streaming, or connected to the wrong topology."

[[assertions]]
id = "postgresql-write-reaches-both-standbys"
probe = "postgresql-replication-io"
dimension = "functionality"
points = 4
critical = true
requires = ["postgresql-primary-writable", "postgresql-two-streaming-standbys"]
pass_condition = "One exact committed evaluator value written on node1 converges intact to both node2 and node3, while both standbys reject normal writes."
fail_condition = "Healthy replication clients confirm the committed value missing or changed on either standby, or a standby accepts a normal write."

[[assertions]]
id = "postgresql-replication-role-secure"
probe = "postgresql-security-state"
dimension = "security"
points = 2
critical = true
pass_condition = "The active replication connection uses a dedicated non-superuser role with a SCRAM verifier, and effective host authentication uses no trust, password, or MD5 method."
fail_condition = "Live role and authentication evidence confirms broad privilege, no dedicated replication identity, a non-SCRAM verifier, or effective trust, password, or MD5 host authentication."

[[assertions]]
id = "postgresql-network-confined"
probe = "postgresql-security-state"
dimension = "security"
points = 3
critical = true
pass_condition = "Required PostgreSQL and replication traffic works over the declared replication network, while listeners, HBA policy, and active and persistent firewalld rules confine network access to that network or narrower member-specific addresses."
fail_condition = "Effective evidence confirms required database-network traffic blocked, PostgreSQL exposed outside the database network, or access dependent on transient or broader policy."

[[assertions]]
id = "postgresql-files-and-selinux-secure"
probe = "postgresql-security-state"
dimension = "security"
points = 2
critical = true
pass_condition = "Every node keeps SELinux enforcing with PostgreSQL correctly confined, and database, HBA, and credential files have secure PostgreSQL ownership and modes."
fail_condition = "Any node confirms SELinux non-enforcing or PostgreSQL unconfined, or sensitive database, authentication, or credential material insecurely owned or readable."

[[assertions]]
id = "postgresql-state-clean"
probe = "postgresql-operational-state"
dimension = "operational_hygiene"
points = 1
pass_condition = "Only required PostgreSQL services, configuration, data, protected streaming credentials, logs, network policy, and maintained operational tooling remain."
fail_condition = "Concrete executor-created failed, duplicate, conflicting, debug, temporary, backup, unrelated, test, or insecure credential state remains."

[[assertions]]
id = "postgresql-standbys-persist"
probe = "postgresql-standby-reboots"
dimension = "persistence"
points = 2
critical = true
pass_condition = "Node2 and node3 have changed boot identities and each automatically returns read-only and streaming with pre-reboot data and effective SELinux, credential, and firewall controls."
fail_condition = "A completed standby reboot is confirmed to lose recovery mode, streaming, replicated data, automatic service, or a required security control."

[[assertions]]
id = "postgresql-primary-and-replication-persist"
probe = "postgresql-primary-reboot"
dimension = "persistence"
points = 3
critical = true
requires = ["postgresql-standbys-persist"]
pass_condition = "Node1 has a changed boot identity and automatically returns writable with both standbys streaming; pre-reboot data survives, a new post-reboot write reaches both standbys, and security controls remain effective."
fail_condition = "The completed primary reboot is confirmed to lose the original topology, service, data, new replication writes, or a required security control."
