reasoning_effort = "medium"
timeout_sec = 600
allow_ssh_probes = false

[dimensions.functionality]
weight = 0.40
description = "Verify live behavior: node1 is the writable PostgreSQL primary; node2 and node3 are read-only streaming standbys connected to node1; a committed evaluator-created write on node1 converges to both standbys with its value intact. Confirm service health and replication state on every node. Do not award credit merely for packages, processes, or configuration text."

[dimensions.security]
weight = 0.25
description = "Verify effective PostgreSQL security on all nodes: a dedicated non-superuser replication login has a SCRAM verifier; host authentication does not use trust, password, or MD5; PostgreSQL exposure and firewalld runtime and persistent policy are confined to the declared replication network or narrower member-specific addresses; data, authentication, and credential files have secure ownership and modes; and SELinux remains enforcing with PostgreSQL correctly confined. Accept semantically equivalent secure implementations, including one network-wide replication rule or separate member-specific rules, and firewalld source zones or source-scoped rich rules. Penalize actual weak authentication or broad exposure, not harmless configuration-layout differences."

[dimensions.persistence]
weight = 0.25
description = "Create a replication probe, reboot node2, node3, and node1 sequentially, confirm each has a changed boot identity and returns without evaluator repair, then verify the same primary/standby topology, pre-reboot data, streaming state, firewalld policy, credential protection, and enforcing SELinux. Commit a new write after all reboots and prove it reaches both standbys. Automatic promotion or failover is not required by this task and must not be scored."

[dimensions.operational_hygiene]
weight = 0.10
description = "Inspect all nodes for executor-created test tables or databases, temporary output files, setup scripts, stale backups, duplicate or conflicting PostgreSQL configuration, failed services, debug settings, unrelated database or proxy packages, unnecessary listeners, and insecure credential residue. A PostgreSQL-owned mode-0600 .pgpass needed for persistent streaming is legitimate and must not be treated as residue. Remove all evaluator-created probes before finishing and distinguish them from executor-created artifacts."
