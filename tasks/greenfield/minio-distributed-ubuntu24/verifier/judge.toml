reasoning_effort = "medium"
timeout_sec = 1500
allow_ssh_probes = false

[dimensions.functionality]
weight = 0.30
description = "Inspect all four Ubuntu 24.04 nodes and verify they form one healthy distributed MinIO service using /srv/minio on every node. Through authenticated TLS S3 or MinIO Client operations, confirm infra-data/proof.txt contains distributed-storage-ready and perform evaluator-owned object upload, readback, metadata comparison, and removal through multiple endpoints. Validate actual distributed service state rather than a particular unit or configuration layout."

[dimensions.security]
weight = 0.25
description = "Verify node-name-validating TLS and authentication on S3 port 9000 through every node. Plaintext, anonymous, default, and invalid-credential access must fail unless an explicitly intended bucket policy grants only the required narrow access. Confirm storage traffic is confined to the storage network, unnecessary console or debug listeners are absent, administrative credentials and private keys have restrictive ownership and modes, MinIO lacks unnecessary privilege, AppArmor and persistent firewall policy remain active, and SSH is not enabled. Accept equivalent secure service, firewall, and PKI layouts."

[dimensions.resilience]
weight = 0.20
description = "After initial object proof, stop the actual MinIO service on one storage node and record the action. Confirm existing objects remain readable and evaluator-owned objects can be written, read, and removed through surviving endpoints. Restore the node and confirm it automatically rejoins healthy with current object state and no manual repair. Always restore evaluator-changed services before finishing."

[dimensions.persistence]
weight = 0.15
description = "Record boot identities and reboot all four storage systems sequentially, allowing distributed health to recover after each reboot. Confirm changed boot identities, enabled service recovery, all four nodes and drives return healthy, required and evaluator-owned objects remain consistent, fresh object operations work, and TLS, authentication, AppArmor, and persistent firewall controls remain effective without evaluator repair."

[dimensions.operational_hygiene]
weight = 0.10
description = "Inspect every node for failed units, abandoned MinIO downloads, archives, installers, temporary scripts or credentials, world-readable secrets, stale cluster endpoints, duplicate services or binaries, debug listeners, enabled SSH, unnecessary users, packages, services, firewall openings, and conflicting configuration. Legitimate MinIO data, erasure metadata, logs, PKI, service configuration, and runtime tools are expected. Remove evaluator-created objects, files, and state records safely before finishing."
