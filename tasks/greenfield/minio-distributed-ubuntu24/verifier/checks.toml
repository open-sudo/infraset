schema_version = 1

[[probes]]
id = "minio-distributed-state"
level = 1
targets = ["node1", "node2", "node3", "node4"]
max_exec_calls = 5
procedure = "Inspect every node directly and use authenticated administrative access from node1 to establish one distributed MinIO service with all four intended nodes and /srv/minio storage online. Discover storage-network addresses from live interfaces rather than assuming node-name resolution."

[[probes]]
id = "minio-object-contract"
level = 1
targets = ["node1", "node2", "node3", "node4"]
effect = "evaluator_owned_data"
max_exec_calls = 6
procedure = "Read infra-data/proof.txt through authenticated service access, then upload a uniquely named evaluator object through one healthy endpoint, read and compare it through another endpoint, and remove it."
cleanup = "Remove the evaluator-owned object and confirm it is absent while preserving infra-data/proof.txt."

[[probes]]
id = "minio-operational-state"
level = 5
targets = ["node1", "node2", "node3", "node4"]
max_exec_calls = 4
procedure = "Inspect failed or duplicate MinIO services, stale endpoints, abandoned downloads/installers, debug processes, conflicting storage configuration, and executor-created temporary credentials or test objects."

[[probes]]
id = "minio-single-node-loss"
level = 6
targets = ["node1", "node4"]
effect = "controlled_failure"
max_exec_calls = 8
procedure = "Stop the actual MinIO service on node4, read the required object and complete a new evaluator object lifecycle through surviving endpoints, restore node4, and confirm it returns online with current object state."
cleanup = "Restore node4, wait for four-node distributed health, and remove evaluator-owned outage objects."

[[probes]]
id = "minio-representative-reboots"
level = 8
targets = ["node1", "node2"]
effect = "reboot"
max_exec_calls = 8
procedure = "Record boot identities, reboot node1 and node2 sequentially, wait for distributed convergence after each reboot, and repeat required-object and evaluator I/O checks."
cleanup = "Wait for all four nodes and drives to return online and remove evaluator-owned objects."

[[probes]]
id = "minio-remaining-reboots"
level = 10
targets = ["node3", "node4"]
effect = "reboot"
max_exec_calls = 8
procedure = "Record boot identities, reboot node3 and node4 sequentially, and confirm the complete distributed service, required object, administrative access, and fresh object I/O return automatically."
cleanup = "Wait for four-node distributed health and remove evaluator-owned objects."

[[assertions]]
id = "minio-four-node-service"
probe = "minio-distributed-state"
dimension = "functionality"
points = 3
critical = true
pass_condition = "Administrative runtime evidence confirms one distributed MinIO service containing all four intended online nodes and their /srv/minio storage."
fail_condition = "Authenticated runtime evidence confirms a missing node, missing declared storage, separate service, or unavailable required member."

[[assertions]]
id = "minio-required-object"
probe = "minio-object-contract"
dimension = "functionality"
points = 2
critical = true
pass_condition = "infra-data/proof.txt is readable through authenticated S3-compatible access and contains exactly distributed-storage-ready."
fail_condition = "A healthy authenticated service confirms the required bucket/object missing, unreadable, or incorrect."

[[assertions]]
id = "minio-cross-endpoint-io"
probe = "minio-object-contract"
dimension = "functionality"
points = 3
critical = true
requires = ["minio-four-node-service"]
pass_condition = "An evaluator object uploaded through one endpoint is returned byte-for-byte through another endpoint and can be removed cleanly."
fail_condition = "Healthy authenticated endpoints confirm evaluator upload, cross-endpoint readback, content integrity, or deletion does not work."

[[assertions]]
id = "minio-state-clean"
probe = "minio-operational-state"
dimension = "operational_hygiene"
points = 1
pass_condition = "Only required MinIO services, data, erasure metadata, logs, PKI, configuration, and maintained administrative tooling remain."
fail_condition = "Concrete executor-created failed, duplicate, stale, debug, conflicting, temporary, or abandoned state remains."

[[assertions]]
id = "minio-io-survives-node-loss"
probe = "minio-single-node-loss"
dimension = "resilience"
points = 3
critical = true
pass_condition = "With node4's service confirmed stopped, surviving endpoints read existing data and complete new evaluator object write/read/delete operations."
fail_condition = "One confirmed storage-node outage makes required data unreadable or new object I/O unavailable through healthy survivors."

[[assertions]]
id = "minio-node-rejoins-current"
probe = "minio-single-node-loss"
dimension = "resilience"
points = 2
critical = true
requires = ["minio-io-survives-node-loss"]
pass_condition = "Restored node4 returns automatically to healthy distributed service and current object state without repair."
fail_condition = "Restored node4 is reachable but cannot rejoin healthy/current service without manual repair."

[[assertions]]
id = "minio-two-nodes-persist"
probe = "minio-representative-reboots"
dimension = "persistence"
points = 2
critical = true
pass_condition = "Node1 and node2 have changed boot identities and distributed service, required data, administrative access, and fresh object I/O recover automatically after each reboot."
fail_condition = "A completed reboot is confirmed to lose required service, storage membership, object data, administrative access, or I/O."

[[assertions]]
id = "minio-all-nodes-persist"
probe = "minio-remaining-reboots"
dimension = "persistence"
points = 2
critical = true
pass_condition = "Node3 and node4 have changed boot identities and all four nodes return healthy with the required object and fresh cross-endpoint I/O intact."
fail_condition = "A completed remaining-node reboot is confirmed to lose required membership, data, or object operations."
