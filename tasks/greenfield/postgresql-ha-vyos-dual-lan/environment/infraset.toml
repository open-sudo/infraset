cluster = ["vyos", "ubuntu24.04 x3"]
max_clusters = 3
base_runbooks = [
  "antrieb/primer",
  "antrieb/networking-primer",
  "antrieb/vyos-reference",
]
control_node = "node2"
endpoint = "https://antrieb.sh/mcp"

[[networks]]
name = "mgmt"
egress = true
dhcp = true

[[networks]]
name = "lan-a"
egress = false
dhcp = true

[[networks]]
name = "lan-b"
egress = false
dhcp = true

[nics]
node1 = [{ net = "mgmt" }, { net = "lan-a" }, { net = "lan-b" }]
node2 = [{ net = "mgmt" }, { net = "lan-a" }]
node3 = [{ net = "mgmt" }, { net = "lan-b" }]
node4 = [{ net = "mgmt" }, { net = "lan-b" }]
