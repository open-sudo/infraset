reasoning_effort = "medium"
timeout_sec = 1500
allow_ssh_probes = false

[dimensions.functionality]
weight = 0.25
description = "Verify live outcomes on all four nodes. Node1 must route between the two declared LANs using its declared LAN addresses. Node2 must initially be the sole writable PostgreSQL primary; node3 and node4 must be read-only streaming replicas. Create an evaluator-owned table in appdb, commit distinct rows, and prove both replicas receive the exact data. Confirm that PostgreSQL replication and HA coordination use LAN addresses and traverse the VyOS path. Score observable behavior rather than a particular PostgreSQL HA product or file layout."

[dimensions.security]
weight = 0.20
description = "Verify effective network and database security. PostgreSQL and HA coordination must be reachable only between the three database members over lan-a and lan-b; management addresses must not expose those services. VyOS must permit the required stateful HA flows while rejecting unrelated cross-LAN traffic, with no cross-LAN NAT. PostgreSQL host authentication must use SCRAM or certificate authentication, replication must use a least-privileged non-superuser identity, secrets and key material must have restrictive ownership and modes, and AppArmor must remain enabled. Check runtime behavior as well as persisted rules. Do not penalize a sound implementation because it uses a different firewall or HA manager."

[dimensions.resilience]
weight = 0.25
description = "After the initial replication proof, make node2 unavailable by stopping its actual PostgreSQL/HA service stack and record every changed unit or process so it can be restored. Confirm either node3 or node4 is promoted automatically, the other remains a streaming replica, exactly one writable primary exists, and a new committed write on the promoted member reaches the remaining replica. Restore node2 and confirm it automatically rejoins as a replica, receives both pre-failure and post-failover data, and does not trigger automatic failback or split brain. Always restore node2 before finishing, including after a failed assertion."

[dimensions.persistence]
weight = 0.20
description = "After the resilience drill has left node3 as primary, record boot identities and reboot node1, node4, node2, then node3 sequentially, waiting for recovery after each reboot. Confirm each boot identity changes without evaluator repair. Verify saved VyOS addressing and filtering, persistent host routes, database services, appdb data, one-primary/two-replica health, automatic promotion and rejoin, and LAN-only replication after the sequence. The sole primary after the final reboot may be any eligible database member. Commit another write on that primary and prove it reaches both replicas."

[dimensions.operational_hygiene]
weight = 0.10
description = "Inspect every node for abandoned installers, temporary scripts and logs, stale backup configurations, evaluator-like test artifacts created by the executor, failed services, duplicate PostgreSQL or HA stacks, unnecessary packages or listeners, enabled SSH, debug settings, insecure credential copies, broad or conflicting routes, and unrelated VyOS firewall or NAT changes. Legitimate PostgreSQL data, WAL, HA metadata, runtime packages, and saved VyOS configuration are expected. Remove all evaluator-created schemas, files, probes, and service-state records before finishing."
