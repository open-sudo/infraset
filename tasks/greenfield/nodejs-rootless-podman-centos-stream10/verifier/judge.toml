reasoning_effort = "medium"
timeout_sec = 600
allow_ssh_probes = false

[dimensions.functionality]
weight = 0.40
description = "Verify live behavior on node1: CentOS Stream 10 has Podman installed; a container named node-hello is running in nodeapp's rootless Podman context; the container executes a Node.js application; and HTTP GET / on TCP 8080 returns exactly 'Hello, world!'. Confirm that node-hello is managed by an active, boot-enabled service. Accept a system service running as nodeapp or a nodeapp user service with lingering enabled. Do not award credit for configuration text or a non-containerized host process alone."

[dimensions.security]
weight = 0.25
description = "Verify effective security: the Podman engine and container process are owned by the unprivileged nodeapp account; nodeapp has no administrative group membership and has valid subordinate UID/GID mappings; the container is not privileged, does not use host networking or host PID mode, has no unnecessary added capabilities or sensitive host mounts, and does not disable SELinux labeling; SELinux remains enforcing and the container is confined; firewalld is enabled and active with persistent policy permitting TCP 8080. Judge effective isolation rather than requiring a particular Containerfile, image tag, Quadlet layout, or systemd implementation. Container UID 0 inside a correctly configured rootless user namespace is not by itself a failure."

[dimensions.persistence]
weight = 0.25
description = "Record the boot identity, reboot node1, and confirm that a different boot completes without evaluator repair. Verify that the node-hello service and rootless container return without an interactive nodeapp login, the exact HTTP response is available on TCP 8080, the host container process is still owned by nodeapp, and SELinux and persistent firewalld policy remain effective."

[dimensions.operational_hygiene]
weight = 0.10
description = "Inspect node1 for unnecessary container engines, host Node.js runtimes or unrelated web servers, duplicate containers, debug-mode Node.js processes, failed task services, stale backup or temporary setup files, permissive service/application files, root-owned copies of the workload, and evaluator-created residue. Retain legitimate application source, container build input, image layers, and service definitions. Remove all evaluator-created probes before finishing."
