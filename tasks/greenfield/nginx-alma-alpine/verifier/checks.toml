schema_version = 1

[[probes]]
id = "nginx-four-node-contract"
level = 1
targets = ["node1", "node2", "node3", "node4"]
max_exec_calls = 4
procedure = "Address every node directly, confirm its declared AlmaLinux 9 or Alpine role, obtain a successful HTTP response from / on TCP 6700, and corroborate that the listener is provided by an active distribution-supported Nginx service."

[[probes]]
id = "nginx-four-node-operational-state"
level = 5
targets = ["node1", "node2", "node3", "node4"]
max_exec_calls = 4
procedure = "Inspect failed units, duplicate or conflicting web servers, HAProxy installation, stale Nginx configuration copies, debug processes, and executor-created temporary residue while accepting distribution-specific service layouts."

[[probes]]
id = "nginx-representative-reboots"
level = 8
targets = ["node1", "node3"]
effect = "reboot"
max_exec_calls = 8
procedure = "Record boot identities, reboot one AlmaLinux node and one Alpine node, and confirm Nginx and successful HTTP service on TCP 6700 return automatically on both."
cleanup = "Wait for both nodes and their HTTP endpoints to return fully online."

[[probes]]
id = "nginx-remaining-reboots"
level = 10
targets = ["node2", "node4"]
effect = "reboot"
max_exec_calls = 8
procedure = "Record boot identities, reboot the remaining AlmaLinux and Alpine nodes, and confirm their Nginx TCP-6700 endpoints return automatically."
cleanup = "Wait for all four Nginx endpoints to be online."

[[assertions]]
id = "nginx-alma-node1-http"
probe = "nginx-four-node-contract"
dimension = "functionality"
points = 1
critical = true
pass_condition = "Node1 is AlmaLinux 9 and its active Nginx service returns a successful HTTP response at / on TCP 6700."
fail_condition = "Node1 is confirmed to have the wrong role, inactive Nginx, or a reachable TCP-6700 endpoint that does not return successful HTTP."

[[assertions]]
id = "nginx-alma-node2-http"
probe = "nginx-four-node-contract"
dimension = "functionality"
points = 1
critical = true
pass_condition = "Node2 is AlmaLinux 9 and its active Nginx service returns a successful HTTP response at / on TCP 6700."
fail_condition = "Node2 is confirmed to have the wrong role, inactive Nginx, or a reachable TCP-6700 endpoint that does not return successful HTTP."

[[assertions]]
id = "nginx-alpine-node3-http"
probe = "nginx-four-node-contract"
dimension = "functionality"
points = 1
critical = true
pass_condition = "Node3 is Alpine and its active Nginx service returns a successful HTTP response at / on TCP 6700."
fail_condition = "Node3 is confirmed to have the wrong role, inactive Nginx, or a reachable TCP-6700 endpoint that does not return successful HTTP."

[[assertions]]
id = "nginx-alpine-node4-http"
probe = "nginx-four-node-contract"
dimension = "functionality"
points = 1
critical = true
pass_condition = "Node4 is Alpine and its active Nginx service returns a successful HTTP response at / on TCP 6700."
fail_condition = "Node4 is confirmed to have the wrong role, inactive Nginx, or a reachable TCP-6700 endpoint that does not return successful HTTP."

[[assertions]]
id = "nginx-four-node-state-clean"
probe = "nginx-four-node-operational-state"
dimension = "operational_hygiene"
points = 1
pass_condition = "Each node retains only its role-appropriate Nginx service, configuration, content, logs, and necessary distribution tooling."
fail_condition = "Concrete executor-created HAProxy, duplicate web service, failed unit, debug process, stale configuration, or temporary residue remains."

[[assertions]]
id = "nginx-cross-distro-persistence"
probe = "nginx-representative-reboots"
dimension = "persistence"
points = 2
critical = true
pass_condition = "Node1 and node3 have changed boot identities and their distribution-supported Nginx TCP-6700 endpoints return automatically."
fail_condition = "A completed representative reboot is confirmed to lose Nginx startup, listener, or successful HTTP behavior."

[[assertions]]
id = "nginx-all-node-persistence"
probe = "nginx-remaining-reboots"
dimension = "persistence"
points = 2
critical = true
pass_condition = "Node2 and node4 have changed boot identities and all four required TCP-6700 Nginx endpoints are operational without repair."
fail_condition = "A completed remaining-node reboot is confirmed to lose any required Nginx endpoint."
