reasoning_effort = "medium"
timeout_sec = 1500
allow_ssh_probes = false

[dimensions.functionality]
weight = 0.30
description = "Inspect all three Ubuntu 24.04 nodes and verify that they form one healthy RabbitMQ cluster named infra-rabbit. Through the authenticated TLS management API and AMQP service, confirm that /infra exists, infra.jobs is a durable three-member quorum queue, and evaluator-owned messages can be published and consumed. Validate real service behavior and cluster membership rather than requiring a particular package source, file layout, or provisioning method."

[dimensions.security]
weight = 0.25
description = "Verify effective TLS and authentication on AMQP 5671 and management 15671 using node-name certificate validation. Plaintext, anonymous, default, and invalid-credential access must fail. Confirm messaging and Erlang distribution are confined to the messaging network, unnecessary listeners are absent, operator credentials, private keys, and the Erlang cookie have restrictive ownership and modes, services do not run with unnecessary privilege, AppArmor and the persistent host firewall remain active, and SSH is not enabled. Accept equivalent secure firewall and PKI layouts."

[dimensions.resilience]
weight = 0.20
description = "After initial message-flow proof, stop the actual RabbitMQ service on one non-leader broker and record the evaluator action. Confirm the quorum queue remains available for new publish and consume operations. Restore that broker, wait for it to rejoin the same cluster, and prove it is current and healthy. Always attempt to restore any service changed by the evaluator before finishing."

[dimensions.persistence]
weight = 0.15
description = "Record boot identities and reboot node1, node2, and node3 sequentially, allowing the cluster to recover after each reboot. Confirm every boot identity changes, services start without evaluator repair, the same three-member cluster and quorum queue return, retained and new messages remain usable, TLS and authentication still work, and the persistent firewall and AppArmor controls remain effective."

[dimensions.operational_hygiene]
weight = 0.10
description = "Inspect every node for failed units, abandoned installers, archives, temporary scripts or credentials, world-readable secrets, stale cluster members, duplicate RabbitMQ installations, debug listeners, enabled SSH, unnecessary users, packages, services, or firewall openings, and conflicting configuration. Legitimate RabbitMQ data, logs, PKI, service configuration, and runtime packages are expected. Remove all evaluator-created messages, files, and state records that can be removed safely."
