reasoning_effort = "medium"
timeout_sec = 900
allow_ssh_probes = false
parallel_node_collection = true
node_collector_timeout_sec = 180
node_collector_command_budget = 7
coordinator_command_budget = 32

[dimensions.functionality]
weight = 0.45
description = "Verify node1 uses the distribution-supported RHEL 9 Nginx package to provide successful HTTP responses at / over TCP 6500 through both loopback and its managed network address. Confirm the native configuration is valid, systemd is enabled and active, and live process and socket evidence identifies Nginx as the server while accepting equivalent persistent configuration layouts."

[dimensions.security]
weight = 0.30
description = "Verify SELinux remains enforcing with an effective persistent authorization for Nginx on TCP 6500, runtime and permanent firewalld policy permits the required managed-network access without broad exposure, Nginx has no unintended HTTP listener including TCP 80, workers are unprivileged, and service configuration is not insecurely writable."

[dimensions.persistence]
weight = 0.20
description = "Record node1's boot identity, reboot it, and confirm the identity changes. Without repair, verify automatic Nginx startup, successful loopback and managed-address HTTP behavior on TCP 6500, absence of unintended Nginx HTTP listeners, and intact SELinux and runtime plus permanent firewalld controls."

[dimensions.operational_hygiene]
weight = 0.05
description = "Inspect node1 for executor-created failed units, conflicting web servers, unrelated users or packages, disabled controls, broad exposure, stale backups or downloads, abandoned setup scripts, debug processes, temporary files, and unintended listeners while preserving necessary Nginx and normal RHEL state."
