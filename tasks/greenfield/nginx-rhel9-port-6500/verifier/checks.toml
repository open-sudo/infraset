schema_version = 1

[[probes]]
id = "nginx-http-contract"
level = 1
targets = ["node1"]
max_exec_calls = 4
procedure = "On node1, establish its managed NODE_IP, then obtain successful HTTP responses from both 127.0.0.1:6500/ and NODE_IP:6500/. Corroborate from live systemd, process, package-ownership, and socket evidence that the responses are served by the active distribution-supported Nginx service rather than an unrelated process."

[[probes]]
id = "nginx-rhel-security"
level = 2
targets = ["node1"]
max_exec_calls = 7
procedure = "Inspect effective RHEL host controls and Nginx runtime state. Verify SELinux is enforcing and persistently permits Nginx to bind TCP 6500, the active and permanent firewalld policy permits the required managed-network HTTP access on 6500, Nginx workers are unprivileged, and Nginx has no HTTP listener on TCP 80 or another unintended port. Establish the positive 6500 endpoint before treating any negative connection test as evidence."

[[probes]]
id = "nginx-installation-quality"
level = 3
targets = ["node1"]
max_exec_calls = 5
procedure = "Validate the installed Nginx configuration with its native checker and inspect package provenance, enabled and active systemd state, effective listen directives, runtime sockets, relevant file ownership and modes, and recent service failures. Accept equivalent persistent configuration layouts when the effective service contract is identical."

[[probes]]
id = "nginx-operational-hygiene"
level = 5
targets = ["node1"]
max_exec_calls = 4
procedure = "Inspect node1 for executor-created failed units, duplicate or conflicting web servers, unrelated users or packages, disabled host controls, broad firewall exposure, stale configuration backups, downloaded archives, abandoned setup scripts, debug processes, temporary files, and unintended listeners. Preserve normal RHEL state and the packages, configuration, logs, policy, and service artifacts necessary for this task."

[[probes]]
id = "nginx-reboot-persistence"
level = 10
targets = ["node1"]
effect = "reboot"
max_exec_calls = 9
procedure = "Record node1's boot identity and complete Nginx endpoint, listener, SELinux, and firewalld state. Reboot node1, wait for it to return, prove the boot identity changed, and verify without repair that Nginx starts automatically, both loopback and managed-address HTTP requests on TCP 6500 succeed, no unintended HTTP listener appears, SELinux remains enforcing with the effective port authorization, and the required runtime and permanent firewall policy remains effective."
cleanup = "Wait for node1 and its TCP 6500 HTTP endpoint to return fully online, and remove only evaluator-owned temporary observations without changing the service configuration."

[[assertions]]
id = "nginx-http-on-port-6500"
probe = "nginx-http-contract"
dimension = "functionality"
points = 2
critical = true
pass_condition = "Node1 returns successful HTTP responses at / over TCP 6500 through both loopback and its managed network address."
fail_condition = "Node1 is reachable, but a correctly addressed loopback or managed-address HTTP request to TCP 6500 is confirmed unsuccessful."

[[assertions]]
id = "nginx-serves-endpoint"
probe = "nginx-http-contract"
dimension = "functionality"
points = 1
critical = true
pass_condition = "Live package, service, process, and socket evidence confirms the TCP 6500 endpoint is served by active distribution-supported Nginx."
fail_condition = "The endpoint is confirmed absent, served by software other than Nginx, or backed by an inactive or unsupported Nginx installation."

[[assertions]]
id = "selinux-enforces-nginx-port"
probe = "nginx-rhel-security"
dimension = "security"
points = 2
critical = true
pass_condition = "SELinux is enforcing and its effective persistent policy authorizes the Nginx HTTP domain to bind TCP 6500 without a broad or disabling workaround."
fail_condition = "Node1 confirms SELinux disabled or permissive, TCP 6500 lacks the required effective persistent authorization, or an unsafe broad bypass was used."

[[assertions]]
id = "firewall-allows-only-required-http"
probe = "nginx-rhel-security"
dimension = "security"
points = 1
critical = true
pass_condition = "Effective runtime and permanent firewalld policy permits the required managed-network access to TCP 6500 without introducing broader web or debug exposure."
fail_condition = "Positive endpoint evidence confirms the service path, but runtime or permanent policy is absent, transient, blocks required access, or broadly exposes unrelated web or debug ports."

[[assertions]]
id = "nginx-listener-and-privilege-bounded"
probe = "nginx-rhel-security"
dimension = "security"
points = 1
pass_condition = "Nginx listens for HTTP only on TCP 6500, its workers run unprivileged, and its persistent configuration is not insecurely writable."
fail_condition = "Runtime evidence confirms an Nginx HTTP listener on TCP 80 or another unintended port, privileged workers, or insecurely writable service configuration."

[[assertions]]
id = "nginx-configuration-valid"
probe = "nginx-installation-quality"
dimension = "functionality"
points = 1
pass_condition = "The distribution Nginx package owns the running service, its native configuration check succeeds, and systemd reports it enabled and active with the effective TCP 6500 listener."
fail_condition = "Package provenance, the native configuration check, systemd state, or live sockets confirm an invalid, inactive, unsupported, or conflicting installation."

[[assertions]]
id = "nginx-state-clean"
probe = "nginx-operational-hygiene"
dimension = "operational_hygiene"
points = 1
pass_condition = "Only necessary Nginx packages, configuration, logs, SELinux policy, firewall policy, and normal RHEL state remain, with no executor-created failed or abandoned artifacts."
fail_condition = "Concrete executor-created failed, duplicate, unrelated, disabled-control, overly broad, stale, debug, temporary, or abandoned state remains."

[[assertions]]
id = "nginx-service-persists-after-reboot"
probe = "nginx-reboot-persistence"
dimension = "persistence"
points = 2
critical = true
pass_condition = "Node1's boot identity changes and Nginx automatically returns successful loopback and managed-address HTTP service on TCP 6500 without evaluator repair."
fail_condition = "A completed reboot is confirmed not to change boot identity or to lose automatic Nginx startup or required TCP 6500 HTTP behavior."

[[assertions]]
id = "nginx-security-persists-after-reboot"
probe = "nginx-reboot-persistence"
dimension = "persistence"
points = 1
critical = true
requires = ["nginx-service-persists-after-reboot"]
pass_condition = "After the confirmed reboot, the sole Nginx HTTP listener remains TCP 6500 and the effective SELinux and runtime plus permanent firewalld controls remain intact."
fail_condition = "After the confirmed reboot, an unintended Nginx HTTP listener appears or a required SELinux or firewalld control is lost."
