schema_version = 1

[[probes]]
id = "wireguard-routed-contract"
level = 1
targets = ["node1", "node2", "node3", "node4"]
max_exec_calls = 10
procedure = "Inspect both VyOS gateways and Ubuntu systems. Establish the assigned LAN and wg01 addresses, routes, peer public identities and a current handshake. From node4 request node3:8080 and require lan-a application; inspect node3's observed source plus routing/NAT state to prove source-preserving tunnel transit."

[[probes]]
id = "wireguard-access-boundary"
level = 2
targets = ["node1", "node2", "node3", "node4"]
max_exec_calls = 9
procedure = "Confirm the declared TCP 8080 path works, then with prerequisites established test representative undeclared new cross-LAN TCP and UDP paths. Inspect stateful firewall/NAT, WireGuard key identity/modes, private-interface management exposure, Ubuntu AppArmor/firewall/SSH, and saved VyOS policy."

[[probes]]
id = "wireguard-operational-state"
level = 5
targets = ["node1", "node2", "node3", "node4"]
max_exec_calls = 5
procedure = "Inspect failed units, unsaved VyOS changes, key-generation files, scripts/archives/credentials, duplicate tunnels/routes, stale firewall/NAT, debug listeners, enabled SSH, unnecessary services/openings, conflicting network state, and residue."

[[probes]]
id = "wireguard-path-recovery"
level = 6
targets = ["node1", "node2", "node3", "node4"]
effect = "controlled_failure"
max_exec_calls = 13
procedure = "Record handshake and application state, interrupt node1's WireGuard path without changing persistent configuration, restore it, and require a fresh handshake plus source-preserving application request with the same denied boundary. Then restart node3's actual application service and require automatic recovery."
cleanup = "Restore the WireGuard path and application service, remove temporary interface/process/probe state, and leave a current handshake."

[[probes]]
id = "wireguard-gateway-reboots"
level = 8
targets = ["node1", "node2"]
effect = "reboot"
max_exec_calls = 9
procedure = "Record boot identities and WireGuard public identities, reboot both gateways sequentially, and after each verify saved tunnel/routes/firewall, unchanged identities, fresh handshake, application path, denial boundary, and no NAT."
cleanup = "Wait for tunnel convergence and remove evaluator probes."

[[probes]]
id = "wireguard-host-reboots"
level = 10
targets = ["node3", "node4"]
effect = "reboot"
max_exec_calls = 8
procedure = "Record boot identities, reboot application node3 and client node4 sequentially, then verify persistent addressing/routes/application, fresh handshake, allowed TCP 8080, denied undeclared paths, source preservation, and host controls."
cleanup = "Wait for all services and remove evaluator files/processes/probes."

[[assertions]]
id = "wireguard-required-tunnel"
probe = "wireguard-routed-contract"
dimension = "functionality"
points = 3
critical = true
pass_condition = "Both gateways and hosts own exact addresses/routes and wg01 peers have matching identities with a current handshake."
fail_condition = "Live state confirms missing/wrong addressing, route, peer identity, tunnel, or handshake."

[[assertions]]
id = "wireguard-application-path"
probe = "wireguard-routed-contract"
dimension = "functionality"
points = 3
critical = true
pass_condition = "Node4 receives lan-a application from node3:8080 through the tunnel and node3 observes the untranslated node4 LAN source."
fail_condition = "Correctly sourced probes confirm unavailable/wrong application, tunnel bypass, or translated source."

[[assertions]]
id = "wireguard-policy-effective"
probe = "wireguard-access-boundary"
dimension = "security"
points = 3
critical = true
pass_condition = "TCP 8080 and stateful return traffic work while representative undeclared new cross-LAN TCP/UDP paths fail with valid prerequisites and no NAT."
fail_condition = "A prerequisite-valid probe confirms an undeclared path, blocked declared path, or address translation."

[[assertions]]
id = "wireguard-identities-hosts-protected"
probe = "wireguard-access-boundary"
dimension = "security"
points = 1
pass_condition = "Unique private keys and host configuration are protected and management/AppArmor/firewall/SSH exposure is appropriately constrained."
fail_condition = "Concrete evidence confirms reused/exposed private key, private-interface management access, disabled host control, or enabled unnecessary SSH."

[[assertions]]
id = "wireguard-state-clean"
probe = "wireguard-operational-state"
dimension = "operational_hygiene"
points = 1
pass_condition = "Only coherent saved VyOS tunnel/firewall/routes and persistent Ubuntu application/network state remains without failures or residue."
fail_condition = "Concrete unsaved, duplicate, stale, debug, failed, secret-bearing, temporary, or abandoned executor state remains."

[[assertions]]
id = "wireguard-path-recovers"
probe = "wireguard-path-recovery"
dimension = "resilience"
points = 2
critical = true
pass_condition = "After the tunnel interruption and application restart, a fresh handshake and source-preserving declared request recover automatically with the denial boundary intact."
fail_condition = "A restored component requires configuration repair, lacks a fresh handshake/application path, changes source, or weakens the boundary."

[[assertions]]
id = "wireguard-gateways-persist"
probe = "wireguard-gateway-reboots"
dimension = "persistence"
points = 3
critical = true
pass_condition = "Both gateway boot identities change while WireGuard identities remain stable and tunnel, routes, policy, handshake, app path, and no-NAT behavior recover."
fail_condition = "A completed gateway reboot changes peer identity or loses tunnel, route, policy, handshake, application path, or source preservation."

[[assertions]]
id = "wireguard-all-hosts-persist"
probe = "wireguard-host-reboots"
dimension = "persistence"
points = 2
critical = true
pass_condition = "Node3/node4 change boot identities and complete addressing, application, allowed/denied paths, tunnel use, and host controls return automatically."
fail_condition = "A completed host reboot loses required address/route/service, traffic contract, source preservation, or controls."
