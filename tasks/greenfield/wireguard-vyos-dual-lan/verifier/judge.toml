reasoning_effort = "medium"
timeout_sec = 1500
allow_ssh_probes = false

[dimensions.functionality]
weight = 0.35
description = "Inspect both VyOS gateways and both Ubuntu 24.04 application systems. Verify the declared LAN and wg01 tunnel addressing, persistent routes, current WireGuard handshake, and routed end-to-end access from node4 to node3 TCP 8080 with a response containing lan-a application. Confirm source addresses remain untranslated and inspect live routing and interface state. Score the outcome rather than requiring a particular VyOS firewall syntax or Ubuntu web implementation."

[dimensions.security]
weight = 0.25
description = "Verify that node4 can initiate only the declared TCP 8080 application path into lan-a and that representative undeclared new cross-LAN TCP and UDP connections fail, while required return traffic works statefully. Confirm there is no cross-LAN NAT, WireGuard private keys are unique and protected, public-key identities match configured peers, tunnel transport is encrypted, management services are not exposed to the private LANs, Ubuntu AppArmor and persistent host firewalls remain active, VyOS persistent firewall policy is effective, and SSH is not enabled on Ubuntu. Accept equivalent secure firewall rule organization."

[dimensions.resilience]
weight = 0.15
description = "Record evaluator actions and exercise recovery without changing configuration: restart or temporarily disable and restore one WireGuard gateway path, then restart the application service. After each action, wait for automatic recovery and prove a fresh WireGuard handshake and successful node4-to-node3 application request with the same access boundary and no NAT. Always restore any service or interface changed by the evaluator."

[dimensions.persistence]
weight = 0.15
description = "Record boot identities and reboot node1, node2, node3, and node4 sequentially, waiting for recovery after each reboot. Confirm every identity changes, saved VyOS configuration restores the tunnel, routes, and firewall; Ubuntu addressing, routes, application service, AppArmor, and firewall return; WireGuard public identities remain unchanged; and the declared application path, denial boundary, and absence of NAT still hold without evaluator repair."

[dimensions.operational_hygiene]
weight = 0.10
description = "Inspect all four systems for failed units, unsaved VyOS changes, abandoned key-generation files, setup scripts, archives, temporary credentials, duplicate tunnels or routes, stale firewall or NAT rules, debug listeners, enabled Ubuntu SSH, unnecessary users, packages, services, firewall openings, and conflicting network configuration. Legitimate WireGuard keys, saved VyOS configuration, Ubuntu application files, service configuration, logs, and runtime packages are expected. Remove evaluator-created probes, files, processes, and state records before finishing."
