reasoning_effort = "medium"
timeout_sec = 600
allow_ssh_probes = false
parallel_node_collection = true
node_collector_timeout_sec = 180
node_collector_command_budget = 5

[dimensions.functionality]
weight = 0.45
description = "Verify node1 runs a ready Prometheus service on TCP 9090 and scrapes node_exporter on node2, node3, and node4 over TCP 9100. Use the Prometheus targets API to prove that each declared target is uniquely identifiable by its node name and currently UP, then query current node_exporter metrics that distinguish all three systems. Inspect actual target health, scrape errors, timestamps, and metric values while accepting equivalent persistent configuration layouts."

[dimensions.security]
weight = 0.20
description = "Verify Prometheus and every node_exporter run under dedicated unprivileged service identities, AppArmor and persistent host firewall controls remain active, node_exporter is reachable from node1 but not from peer target systems, and the Prometheus administrative endpoint is not exposed to the target nodes. Confirm SSH, debug endpoints, broad firewall rules, writable service configuration, and unnecessary privileged capabilities were not introduced."

[dimensions.persistence]
weight = 0.25
description = "Record boot identities and target state, then reboot node1, node2, node3, and node4 sequentially with convergence between reboots. Confirm every boot identity changes, services recover automatically, all three targets return to UP with their node identities intact, fresh host metrics resume, and firewall and AppArmor controls remain effective."

[dimensions.operational_hygiene]
weight = 0.10
description = "Inspect all four systems for failed units, duplicate Prometheus or node_exporter processes, stale downloads and archives, temporary configuration, enabled SSH, unrelated packages or users, conflicting scrape definitions, abandoned setup scripts, and unintended listeners. Legitimate Prometheus data, exporter packages or binaries, service units, logs, and persistent configuration are expected."
