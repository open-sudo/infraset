reasoning_effort = "medium"
timeout_sec = 1500
allow_ssh_probes = false
parallel_node_collection = true
node_collector_timeout_sec = 300
node_collector_command_budget = 8
coordinator_command_budget = 64

[dimensions.functionality]
weight = 0.30
description = "Two active 389 Directory Server suppliers provide the required naming context and POSIX identities over LDAPS, replicate in both directions, and integrate with the SSSD client."

[dimensions.security]
weight = 0.25
description = "TLS identities validate, plaintext and anonymous directory access are rejected, self-service ACLs are least privilege, credentials are protected, and persistent AlmaLinux security controls remain effective."

[dimensions.resilience]
weight = 0.20
description = "The SSSD client and authenticated LDAP access survive either supplier outage, writes continue through the survivor, and recovered suppliers rejoin with current data."

[dimensions.persistence]
weight = 0.15
description = "Both suppliers and the client actually reboot and retain directory data, replication, SSSD integration, TLS trust, credentials, and security controls."

[dimensions.operational_hygiene]
weight = 0.10
description = "Each AlmaLinux node contains only role-appropriate directory state without duplicate local identities, unrelated directory servers, failed units, temporary credentials, or stale setup artifacts."
