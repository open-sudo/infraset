reasoning_effort = "medium"
timeout_sec = 1200
allow_ssh_probes = false
parallel_node_collection = true
node_collector_timeout_sec = 240
node_collector_command_budget = 10

[dimensions.functionality]
weight = 0.40
description = "Inspect SONiC node1 and both Ubuntu peers. Verify the declared link and /32 endpoint addresses, FRR processes, AS identities, and exactly two relevant established eBGP adjacencies: node1 AS 65100 to node2 AS 65101 and node3 AS 65102. Prove each Ubuntu originates its declared /32, node1 learns both with the correct peer and AS path, each Ubuntu learns the other endpoint, and selected BGP routes reach the kernel FIB. Run bidirectional probes sourced from the /32 endpoints. Use SONiC eth1/eth2 counters or narrowly scoped packet captures to prove the traffic enters one data interface and exits the other with original source and destination addresses; management traffic is not evidence. Account for SONiC-VS using kernel eth interfaces rather than cosmetic Ethernet abstractions."

[dimensions.security]
weight = 0.20
description = "Verify import and export policy limits each peer to the exact declared /32 and no default, management, connected-link, or unrelated prefixes are exchanged. Confirm BGP adjacency is limited to the two data-link peers, management is not used for BGP or transit, no NAT rewrites endpoint traffic, and forwarding is enabled only where required. On SONiC, confirm the harmful docker0 address is absent and native SONiC/FRR state is coherent. On Ubuntu, verify AppArmor remains active, SSH was not enabled, default egress still uses management, FRR configuration and permissions are protected, and no permissive firewall exposure was introduced."

[dimensions.persistence]
weight = 0.25
description = "Record all three boot identities and reboot every node. Prove every identity changes. Without repairing anything after reboot, verify SONiC data interfaces and forwarding state, Ubuntu data and /32 addresses, all three FRR instances, both established eBGP sessions, exact route exchange, kernel FIB installation, sourced bidirectional transit through SONiC, route policy, and host security state return automatically."

[dimensions.operational_hygiene]
weight = 0.15
description = "Inspect every node for duplicate addresses or routes, stale static routes that bypass BGP, docker0 source leakage, conflicting interface reconcilers, unnecessary routing protocols, failed FRR or system units, unsafe config permissions, abandoned scripts, packet captures, package archives, debug state, credentials, enabled Ubuntu SSH, and unrelated listeners or services. SONiC's pre-existing AS 65100 instance and dormant template neighbors are baseline platform state and are not residue unless modified in a way that affects this topology. Require saved SONiC FRR and persistent Ubuntu configuration while accepting equivalent secure policy layouts."
