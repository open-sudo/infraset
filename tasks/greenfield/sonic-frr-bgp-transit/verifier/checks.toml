schema_version = 1

[[probes]]
id = "bgp-transit-contract"
level = 1
targets = ["node1", "node2", "node3"]
max_exec_calls = 10
procedure = "Inspect SONiC and both Ubuntu peers directly. Establish exact data-link and /32 endpoint addresses, AS identities 65100/65101/65102, two established eBGP adjacencies, exact /32 origin/learning and kernel FIB installation. Run bidirectional /32-sourced probes and use data-interface counters or narrow captures to prove transit through node1 without NAT or management path."

[[probes]]
id = "bgp-policy-boundary"
level = 2
targets = ["node1", "node2", "node3"]
max_exec_calls = 7
procedure = "Inspect live advertised/received routes and policy, peer addresses, forwarding/NAT, default and management routes, SONiC docker0 state, FRR permissions, AppArmor, firewall, listeners, and SSH. Confirm only declared /32s and peers participate."

[[probes]]
id = "bgp-operational-state"
level = 5
targets = ["node1", "node2", "node3"]
max_exec_calls = 5
procedure = "Inspect duplicate addresses/routes, static bypasses, docker0 leakage, conflicting reconcilers, extra protocols, failed FRR/system units, unsafe configs, scripts/captures/archives, debug state, enabled SSH, and executor-created residue while respecting dormant SONiC baseline templates."

[[probes]]
id = "bgp-representative-reboots"
level = 8
targets = ["node1", "node2"]
effect = "reboot"
max_exec_calls = 9
procedure = "Record boot identities, reboot SONiC node1 and peer node2 sequentially, and after each recovery verify addressing, forwarding, sessions, exact route exchange, FIBs, /32-sourced transit, and route policy."
cleanup = "Wait for BGP convergence and remove evaluator captures/probes."

[[probes]]
id = "bgp-final-reboot"
level = 10
targets = ["node3"]
effect = "reboot"
max_exec_calls = 6
procedure = "Record node3's boot identity, reboot it, and prove the complete three-node BGP topology, exact route exchange, kernel forwarding, source-preserving bidirectional transit, and host controls return automatically."
cleanup = "Wait for both adjacencies and remove evaluator capture files."

[[assertions]]
id = "bgp-required-sessions-routes"
probe = "bgp-transit-contract"
dimension = "functionality"
points = 3
critical = true
pass_condition = "Exactly the two declared eBGP adjacencies are established and each exact endpoint /32 is originated, learned through the correct peer/AS path, and installed in FIBs."
fail_condition = "Live FRR/FIB evidence confirms a missing/wrong session, AS, prefix origin, peer path, or route installation."

[[assertions]]
id = "bgp-source-preserving-transit"
probe = "bgp-transit-contract"
dimension = "functionality"
points = 3
critical = true
pass_condition = "Bidirectional probes sourced from the declared /32s cross SONiC data interfaces and retain original source/destination addresses."
fail_condition = "Correctly sourced probes confirm no bidirectional transit, management bypass, or address translation."

[[assertions]]
id = "bgp-prefix-policy-exact"
probe = "bgp-policy-boundary"
dimension = "security"
points = 2
critical = true
pass_condition = "Only the declared two peers and exact /32 prefixes participate; default, management, connected-link, and unrelated routes are not exchanged."
fail_condition = "Live advertised/received-route evidence confirms an undeclared peer or prefix exchange."

[[assertions]]
id = "bgp-data-plane-contained"
probe = "bgp-policy-boundary"
dimension = "security"
points = 1
pass_condition = "Management is outside BGP/transit, no NAT/docker0 leakage occurs, and forwarding plus protected host controls are scoped to required data paths."
fail_condition = "Concrete evidence confirms management transit, NAT, harmful docker0 source, unsafe FRR config, or disabled/broad host controls."

[[assertions]]
id = "bgp-state-clean"
probe = "bgp-operational-state"
dimension = "operational_hygiene"
points = 1
pass_condition = "Only coherent saved SONiC/FRR and persistent Ubuntu routing state remains without bypasses, conflicts, failures, debug state, or evaluator residue."
fail_condition = "Concrete executor-created duplicate, bypass, leaking, failed, unsafe, temporary, debug, or abandoned state remains."

[[assertions]]
id = "bgp-router-peer-persist"
probe = "bgp-representative-reboots"
dimension = "persistence"
points = 3
critical = true
pass_condition = "Node1 and node2 change boot identities and addressing, forwarding, sessions, exact routes, FIBs, policy, and transit recover automatically."
fail_condition = "A completed router/peer reboot loses required BGP state, route policy, FIB, or source-preserving transit."

[[assertions]]
id = "bgp-full-topology-persists"
probe = "bgp-final-reboot"
dimension = "persistence"
points = 2
critical = true
pass_condition = "Node3 changes boot identity and the complete exact-policy bidirectional BGP transit service returns automatically."
fail_condition = "Node3's completed reboot leaves a missing session/route, broken transit, policy leak, or host-control regression."
