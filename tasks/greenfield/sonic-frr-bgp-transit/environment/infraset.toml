cluster = ["sonic", "ubuntu24.04 x2"]
max_clusters = 3
base_runbooks = [
  "antrieb/primer",
  "antrieb/networking-primer",
  "antrieb/sonic-reference",
]
control_node = "node2"
endpoint = "https://antrieb.sh/mcp"

[[networks]]
name = "mgmt"
dhcp = true
egress = true

[[networks]]
name = "peer-a"
dhcp = false
egress = false

[[networks]]
name = "peer-b"
dhcp = false
egress = false

[nics]
node1 = [{ net = "mgmt" }, { net = "peer-a" }, { net = "peer-b" }]
node2 = [{ net = "mgmt" }, { net = "peer-a" }]
node3 = [{ net = "mgmt" }, { net = "peer-b" }]
