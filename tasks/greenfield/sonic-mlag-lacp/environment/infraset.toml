cluster = ["sonic x2", "ubuntu24.04 x2"]
max_clusters = 3
base_runbooks = [
  "antrieb/primer",
  "antrieb/networking-primer",
  "antrieb/sonic-reference",
]
control_node = "node3"
endpoint = "https://antrieb.sh/mcp"

[[networks]]
name = "mgmt"
dhcp = true
egress = true

[[networks]]
name = "peer-a"
dhcp = false
egress = false

[[networks]]
name = "peer-b"
dhcp = false
egress = false

[[networks]]
name = "host3-a"
dhcp = false
egress = false

[[networks]]
name = "host3-b"
dhcp = false
egress = false

[[networks]]
name = "host4-a"
dhcp = false
egress = false

[[networks]]
name = "host4-b"
dhcp = false
egress = false

[nics]
node1 = [
  { net = "mgmt" },
  { net = "peer-a" },
  { net = "peer-b" },
  { net = "host3-a" },
  { net = "host4-a" },
]
node2 = [
  { net = "mgmt" },
  { net = "peer-a" },
  { net = "peer-b" },
  { net = "host3-b" },
  { net = "host4-b" },
]
node3 = [{ net = "mgmt" }, { net = "host3-a" }, { net = "host3-b" }]
node4 = [{ net = "mgmt" }, { net = "host4-a" }, { net = "host4-b" }]
