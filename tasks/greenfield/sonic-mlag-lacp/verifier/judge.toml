reasoning_effort = "medium"
timeout_sec = 1500
allow_ssh_probes = false
parallel_node_collection = true
node_collector_timeout_sec = 300
node_collector_command_budget = 8

[dimensions.functionality]
weight = 0.30
description = "Inspect both SONiC switches and both Ubuntu 24.04 hosts. Map every added NIC to its declared point-to-point network. Verify both inter-switch links participate in the infraset-fabric peer connection, node3 and node4 each use an LACP bond across different switches, VLAN 100 is carried end to end, and the bonded VLAN interfaces own the declared host addresses. Prove bidirectional L2 communication and MAC learning between the two hosts with no routing or NAT. Judge kernel dataplane behavior on SONiC-VS as well as persistent state; do not require cosmetic Ethernet port state or one exact implementation layout."

[dimensions.security]
weight = 0.20
description = "Verify that the data fabric carries only VLAN 100 between the declared host and peer links, management addresses and services are not reachable through the data bonds, and there is no unintended L3 forwarding, NAT, docker0 source leakage, or extra VLAN access. Confirm host bond and VLAN configuration is protected and persistent, Ubuntu AppArmor and host firewall controls remain effective, and Ubuntu SSH is not globally enabled. On SONiC, accept the platform management plane on its management NIC but reject data-interface management exposure, stale default template peers that affect this topology, or unsafe debug listeners introduced by the executor."

[dimensions.resilience]
weight = 0.20
description = "Record initial LACP members, peer state, MAC learning, and host traffic. Separately disable and restore one node3 member link, one inter-switch member link, and one SONiC switch or its complete data path. After each action, prove continuous or promptly recovered node3-to-node4 traffic through the remaining path with the same source addresses and no duplicate frames or routing. Restore every evaluator-changed link and switch, then verify LACP and peer state return fully active. Balance disruptive commands across appropriate nodes and never leave a link down."

[dimensions.persistence]
weight = 0.20
description = "Record boot identities and reboot node1, node2, node3, and node4 sequentially while checking connectivity through the surviving fabric. Confirm each boot identity changes and no evaluator repair is needed. Verify both SONiC switches restore peer links, bridges or MLAG state, and VLAN membership; both Ubuntu hosts restore their LACP bonds, VLAN addresses, AppArmor, and firewall policy; and the final fabric again tolerates a member-link loss."

[dimensions.operational_hygiene]
weight = 0.10
description = "Inspect all nodes for failed services, duplicate bridges or bonds, stale network namespaces, unmanaged duplicate addresses, conflicting NetworkManager or systemd-networkd profiles, abandoned setup scripts, temporary packet captures, archive files, enabled Ubuntu SSH, unrelated routing daemons, debug listeners, and unnecessary firewall or NAT rules. On SONiC, distinguish expected platform containers and configuration from executor-created residue, and require no harmful docker0 address leakage or unsaved runtime-only dataplane. Remove evaluator-created link state, captures, probes, and files before finishing."
