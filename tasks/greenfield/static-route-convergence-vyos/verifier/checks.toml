schema_version = 1

[[probes]]
id = "static-route-contract"
level = 1
targets = ["node1", "node2", "node3"]
max_exec_calls = 10
procedure = "Inspect all assigned data addresses, stable endpoint addresses, node1 forwarding and saved routes, and both endpoint routing tables. Run bidirectional endpoint-sourced probes plus route decisions/counters to prove the healthy direct primary-transit path is preferred, the VyOS standby exists at lower preference, and neither path uses NAT or management."

[[probes]]
id = "static-route-boundary"
level = 2
targets = ["node1", "node2", "node3"]
max_exec_calls = 6
procedure = "Inspect default/data routes, VyOS NAT and native saved configuration, dynamic-routing state, Ubuntu AppArmor/SSH/firewall state, and network configuration for management transit or conflicting mechanisms."

[[probes]]
id = "static-route-operational-state"
level = 5
targets = ["node1", "node2", "node3"]
max_exec_calls = 4
procedure = "Inspect duplicate addresses/routes, unexpected defaults, dynamic routing, NAT, failed units, enabled SSH, backup/transient route scripts, captures/probes, debug services, and unrelated executor-created state."

[[probes]]
id = "static-route-primary-loss"
level = 6
targets = ["node1", "node2", "node3"]
effect = "controlled_failure"
max_exec_calls = 14
procedure = "Start timestamped one-second bidirectional /32-sourced probes, identify both primary-transit interfaces, and take both ends down. Require successful packets in each direction within ten seconds, prove effective routes and packets cross node1 with original endpoint addresses, restore both interfaces, and prove direct preference returns automatically while traffic continues."
cleanup = "Restore both primary-transit interfaces, wait for direct preference, and remove evaluator captures/probe logs."

[[probes]]
id = "static-route-representative-reboots"
level = 8
targets = ["node1", "node2"]
effect = "reboot"
max_exec_calls = 8
procedure = "Record boot identities, reboot VyOS node1 and endpoint node2 sequentially, and verify saved addresses/routes, direct preference, standby route, /32 reachability, source preservation, and controls."
cleanup = "Wait for routes to converge and remove evaluator probes."

[[probes]]
id = "static-route-final-reboot"
level = 10
targets = ["node3"]
effect = "reboot"
max_exec_calls = 5
procedure = "Record node3's boot identity, reboot it, and prove the complete direct-preferred/standby-routed service, bidirectional /32 reachability, source preservation, and host security return automatically."
cleanup = "Wait for route convergence and remove evaluator state."

[[assertions]]
id = "static-route-required-topology"
probe = "static-route-contract"
dimension = "functionality"
points = 3
critical = true
pass_condition = "All declared data and /32 addresses exist, node1 forwards between standby LANs, and persistent bidirectional static routes provide direct-preferred plus lower-preference standby paths."
fail_condition = "Live route/address evidence confirms a missing/wrong address, forwarding, direction, or path preference."

[[assertions]]
id = "static-route-direct-path-works"
probe = "static-route-contract"
dimension = "functionality"
points = 2
critical = true
pass_condition = "Healthy bidirectional /32-sourced traffic uses primary-transit and preserves source/destination addresses."
fail_condition = "Correctly sourced probes confirm broken transit, VyOS/management use while direct is healthy, or NAT."

[[assertions]]
id = "static-route-management-contained"
probe = "static-route-boundary"
dimension = "security"
points = 1
critical = true
pass_condition = "Management is not selected for endpoint transit, no NAT or dynamic-routing substitute exists, and defaults plus host controls remain sound."
fail_condition = "Concrete evidence confirms management transit, NAT, dynamic routing, redirected default, disabled controls, or conflicting raw state."

[[assertions]]
id = "static-route-state-clean"
probe = "static-route-operational-state"
dimension = "operational_hygiene"
points = 1
pass_condition = "Only coherent saved VyOS and persistent Ubuntu static-routing state remains without duplicates, failures, transient helpers, or residue."
fail_condition = "Concrete duplicate, unexpected, failed, dynamic, NAT, temporary, debug, or abandoned executor state remains."

[[assertions]]
id = "static-route-fails-over-in-time"
probe = "static-route-primary-loss"
dimension = "resilience"
points = 3
critical = true
pass_condition = "After both direct interfaces go down, each direction records a successful /32-sourced packet through VyOS no later than ten seconds."
fail_condition = "A confirmed complete direct-path outage fails to restore either direction through VyOS within ten seconds."

[[assertions]]
id = "static-route-prefers-direct-after-restore"
probe = "static-route-primary-loss"
dimension = "resilience"
points = 2
critical = true
requires = ["static-route-fails-over-in-time"]
pass_condition = "During failure traffic preserves endpoint addresses through node1, and after restoration traffic continues while the direct path automatically becomes preferred."
fail_condition = "The standby path translates/bypasses node1 or restored direct preference requires repair or interrupts service."

[[assertions]]
id = "static-route-two-nodes-persist"
probe = "static-route-representative-reboots"
dimension = "persistence"
points = 2
critical = true
pass_condition = "Node1 and node2 change boot identities and saved addressing, route preferences, reachability, source preservation, and controls recover automatically."
fail_condition = "A completed representative reboot loses a required address, route, preference, traffic outcome, or host control."

[[assertions]]
id = "static-route-all-nodes-persist"
probe = "static-route-final-reboot"
dimension = "persistence"
points = 1
critical = true
pass_condition = "Node3 changes boot identity and the complete resilient static-routing contract returns automatically."
fail_condition = "Node3's completed reboot leaves broken direct/standby routing, endpoint traffic, source preservation, or security state."
