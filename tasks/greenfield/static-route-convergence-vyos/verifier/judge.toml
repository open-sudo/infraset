reasoning_effort = "medium"
timeout_sec = 1200
allow_ssh_probes = false
parallel_node_collection = true
node_collector_timeout_sec = 240
node_collector_command_budget = 10

[dimensions.functionality]
weight = 0.30
description = "Inspect all three nodes. Verify the declared data-plane addresses and stable /32 endpoints are effective, node1 forwards IPv4 between lan-a and lan-b, and static routes exist in both directions without source NAT. Under healthy conditions, route selection and packet traces must show bidirectional ICMP between the two declared stable endpoints using the direct primary-transit link, while the routed path through node1 is available as a less-preferred alternative. Verify actual packets, route decisions, and source addresses rather than configuration text alone."

[dimensions.security]
weight = 0.10
description = "Verify the management network remains management-only and is not selected for endpoint transit, VyOS performs no address translation for the declared networks, and no dynamic-routing protocol substitutes for the requested static routes. Confirm Ubuntu AppArmor and baseline host protections remain active, SSH is not newly enabled, no default route was redirected into the private data plane, and VyOS configuration was made through its persistent native configuration rather than conflicting raw firewall state."

[dimensions.resilience]
weight = 0.30
description = "Start timestamped one-second bidirectional probes between the two stable /32 endpoint addresses. Identify the primary-transit interface on each Ubuntu node, take both ends of that path down as one evaluator-controlled failure, and prove each direction has a successful packet no later than 10 seconds after failure. While failed, verify both effective routes use the appropriate VyOS lan-a or lan-b address, packet traffic crosses node1, and original endpoint source addresses are preserved. Restore both interfaces, prove traffic continues, and verify the direct path automatically becomes preferred again. Always restore evaluator-changed links and remove probes."

[dimensions.persistence]
weight = 0.20
description = "After restoring the failed path, record every boot identity and reboot all three nodes. Prove every identity changes. Without repairing configuration after reboot, verify VyOS addresses and static routes, Ubuntu addresses and both route preferences, direct-path bidirectional endpoint traffic, source-address preservation, and host security state all return automatically."

[dimensions.operational_hygiene]
weight = 0.10
description = "Inspect every node for duplicate addresses or routes, unexpected default routes, NAT, dynamic-routing configuration, failed units, enabled Ubuntu SSH, abandoned netplan or NetworkManager backups, transient route scripts, packet captures, evaluator probes, debug services, credentials, or unrelated packages and services. Require a coherent saved VyOS configuration and persistent Ubuntu network configuration, while accepting equivalent native layouts that produce the required routing behavior."
