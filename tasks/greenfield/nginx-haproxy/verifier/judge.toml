[dimensions.functionality]
weight = 0.45
description = "Nginx is installed, enabled, and active on node1, node2, and node3; each backend listens on port 5660 and returns its correct stable node identifier. HAProxy is installed, enabled, and active on node4; it listens on port 80, targets all three backends on port 5660, and repeated requests through HAProxy demonstrably reach all three backends."

[dimensions.security]
weight = 0.10
description = "Nginx is not exposed on unintended ports, HAProxy has no exposed statistics or administration interface, and the executor did not install/configure SSH, create credentials, or weaken unrelated security controls."

[dimensions.persistence]
weight = 0.15
description = "After rebooting all four nodes, Nginx and HAProxy start automatically, the expected listeners return, each backend responds on port 5660, and HAProxy again distributes successful requests across all three backends without repair."

[dimensions.resilience]
weight = 0.20
description = "When Nginx is stopped on one backend, HAProxy detects the failure and continues serving requests using the other two backends; after Nginx is restarted, the backend becomes healthy and rejoins rotation without configuration changes or manual repair."

[dimensions.operational_hygiene]
weight = 0.10
description = "The implementation contains only the required Nginx packages/configuration/content on node1-node3 and HAProxy package/configuration on node4, with no unrelated packages, users, services, temporary files, debug artifacts, stats interface, conflicting listeners, or stale configuration backups."
