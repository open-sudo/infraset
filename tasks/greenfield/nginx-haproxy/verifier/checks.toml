schema_version = 1

[[probes]]
id = "nginx-backend-contract"
level = 1
targets = ["node1", "node2", "node3"]
max_exec_calls = 3
procedure = "Address each backend directly, request / on TCP 5660, and corroborate that an active Nginx service returns that backend's exact stable node identifier."

[[probes]]
id = "haproxy-distribution-contract"
level = 1
targets = ["node1", "node2", "node3", "node4"]
max_exec_calls = 4
procedure = "Discover backend addresses from live node state, confirm HAProxy is active with valid configuration that declares those addresses on TCP 5660, and issue enough independent requests to node4 on TCP 80 to observe node1, node2, and node3. Treat successful responses carrying each stable backend identifier as direct runtime evidence that every backend participates; do not require an optional stats socket or stats endpoint."

[[probes]]
id = "web-tier-operational-state"
level = 5
targets = ["node1", "node2", "node3", "node4"]
max_exec_calls = 4
procedure = "Inspect failed or duplicate web/proxy services, wrong-role packages and processes, stale backend definitions, debug endpoints, configuration backups, and executor-created temporary residue."

[[probes]]
id = "haproxy-single-backend-loss"
level = 6
targets = ["node1", "node4"]
effect = "controlled_failure"
max_exec_calls = 8
procedure = "Stop Nginx on node1, confirm HAProxy marks it unavailable and continues successful requests through node2 and node3, restore node1, and observe its stable identifier return to rotation automatically."
cleanup = "Restart Nginx on node1 and wait until HAProxy reports all three backends healthy."

[[probes]]
id = "web-tier-representative-reboots"
level = 8
targets = ["node1", "node4"]
effect = "reboot"
max_exec_calls = 8
procedure = "Record boot identities, reboot one backend and then the load balancer, and after each recovery repeat direct backend and three-backend load-distribution checks."
cleanup = "Wait for node1 and node4 to return and leave all three backends healthy in HAProxy."

[[probes]]
id = "web-tier-remaining-reboots"
level = 10
targets = ["node2", "node3"]
effect = "reboot"
max_exec_calls = 8
procedure = "Record boot identities, reboot node2 and node3 sequentially, and confirm their direct endpoints and automatic return to the three-backend HAProxy rotation."
cleanup = "Wait for all four nodes and all three HAProxy backends to be healthy."

[[assertions]]
id = "nginx-backend-node1"
probe = "nginx-backend-contract"
dimension = "functionality"
points = 1
critical = true
pass_condition = "Node1's active Nginx service returns successful HTTP on TCP 5660 with exact body node1."
fail_condition = "Node1's required endpoint is confirmed unavailable, non-successful, or returns a different identifier."

[[assertions]]
id = "nginx-backend-node2"
probe = "nginx-backend-contract"
dimension = "functionality"
points = 1
critical = true
pass_condition = "Node2's active Nginx service returns successful HTTP on TCP 5660 with exact body node2."
fail_condition = "Node2's required endpoint is confirmed unavailable, non-successful, or returns a different identifier."

[[assertions]]
id = "nginx-backend-node3"
probe = "nginx-backend-contract"
dimension = "functionality"
points = 1
critical = true
pass_condition = "Node3's active Nginx service returns successful HTTP on TCP 5660 with exact body node3."
fail_condition = "Node3's required endpoint is confirmed unavailable, non-successful, or returns a different identifier."

[[assertions]]
id = "haproxy-serves-http"
probe = "haproxy-distribution-contract"
dimension = "functionality"
points = 2
critical = true
requires = ["nginx-backend-node1", "nginx-backend-node2", "nginx-backend-node3"]
pass_condition = "Node4's active HAProxy service returns successful HTTP on TCP 80."
fail_condition = "Node4 is reachable but the required HAProxy endpoint is confirmed unavailable or non-successful."

[[assertions]]
id = "haproxy-uses-every-backend"
probe = "haproxy-distribution-contract"
dimension = "functionality"
points = 3
critical = true
requires = ["haproxy-serves-http"]
pass_condition = "Independent successful requests through node4 return all three stable backend identifiers, and HAProxy's active validated configuration associates those identifiers' live addresses with the three declared TCP-5660 backends."
fail_condition = "HAProxy's declared backend addresses do not match live node state, its configuration is invalid, or enough successful independent requests confirm that one or more directly healthy declared backends do not participate in load-balanced service."

[[assertions]]
id = "web-tier-state-clean"
probe = "web-tier-operational-state"
dimension = "operational_hygiene"
points = 1
pass_condition = "Backends retain only required Nginx state and node4 only required HAProxy state, with no failed, duplicate, conflicting, debug, backup, or temporary executor residue."
fail_condition = "Concrete executor-created wrong-role, failed, duplicate, stale, debug, conflicting, backup, or temporary state remains."

[[assertions]]
id = "haproxy-survives-backend-loss"
probe = "haproxy-single-backend-loss"
dimension = "resilience"
points = 2
critical = true
pass_condition = "With node1 Nginx confirmed stopped, node4 continues successful service through both node2 and node3 without returning node1."
fail_condition = "One confirmed backend outage makes the load-balanced service unavailable or routes requests to the stopped backend."

[[assertions]]
id = "haproxy-backend-rejoins"
probe = "haproxy-single-backend-loss"
dimension = "resilience"
points = 1
critical = true
requires = ["haproxy-survives-backend-loss"]
pass_condition = "Restored node1 becomes healthy and its stable identifier returns to rotation automatically."
fail_condition = "Restored node1 is directly healthy but does not rejoin HAProxy service without manual repair."

[[assertions]]
id = "web-tier-primary-roles-persist"
probe = "web-tier-representative-reboots"
dimension = "persistence"
points = 2
critical = true
pass_condition = "Node1 and node4 have changed boot identities and direct backend service plus complete three-backend load balancing recover automatically."
fail_condition = "A completed representative reboot is confirmed to lose backend service, HAProxy service, or complete load distribution."

[[assertions]]
id = "web-tier-all-roles-persist"
probe = "web-tier-remaining-reboots"
dimension = "persistence"
points = 2
critical = true
pass_condition = "Node2 and node3 have changed boot identities and all direct backends plus complete HAProxy rotation are operational without repair."
fail_condition = "A completed remaining-backend reboot is confirmed to lose direct service or automatic load-balancer membership."
