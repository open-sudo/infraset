reasoning_effort = "medium"
timeout_sec = 1800
allow_ssh_probes = false
parallel_node_collection = true
node_collector_timeout_sec = 300
node_collector_command_budget = 8

[dimensions.functionality]
weight = 0.30
description = "Verify two independent Prometheus replicas scrape current host metrics from all four systems with unique replica labels. Query node3:10902 and prove Thanos deduplicates replicas, exposes all required stores, returns current data, and reads older blocks from the authenticated object store on node4. Inspect real APIs, labels, targets, block metadata, and object state while accepting equivalent service layouts."

[dimensions.security]
weight = 0.20
description = "Verify object-store traffic uses validated TLS and authentication, anonymous and plaintext access fail, credentials and private keys are root-protected, services run with appropriate privilege, and persistent firewall policy limits Prometheus, Thanos, and object-store ports to required peers. Confirm AppArmor remains active, SSH and debug/admin exposure were not added, and no secrets appear in logs, unit command lines, or temporary files."

[dimensions.resilience]
weight = 0.20
description = "Capture a current and historical query result, stop one actual Prometheus service, and prove node3 continues to return retained data and current data from the surviving replica without duplicate logical series. Restore the service and verify its sidecar rejoins automatically and deduplication remains correct. Repeat only as needed to establish that either replica can be lost; always restore evaluator changes."

[dimensions.persistence]
weight = 0.20
description = "Record boot identities, reboot all four systems sequentially, and allow the monitoring stack to converge. Prove boot identities changed, both Prometheus replicas scrape all hosts, Thanos query/store/compactor are healthy, retained pre-reboot samples remain queryable from object storage, fresh samples arrive, and TLS, authentication, firewall, AppArmor, and secret permissions remain effective."

[dimensions.operational_hygiene]
weight = 0.10
description = "Inspect every node for failed units, duplicate monitoring processes, abandoned archives or binaries, temporary certificates or credentials, stale setup scripts, excessive privileges, enabled SSH, unintended listeners, and conflicting service configuration. Legitimate TSDB blocks, Thanos object blocks, compactor state, logs, PKI, and operational clients are expected."
