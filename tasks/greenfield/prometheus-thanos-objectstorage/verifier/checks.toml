schema_version = 1

[[probes]]
id = "thanos-metrics-contract"
level = 1
targets = ["node1", "node2", "node3", "node4"]
max_exec_calls = 9
procedure = "Inspect both Prometheus replicas, all scrape targets and replica labels, Thanos query/store/compactor APIs, and authenticated object-store state. Through node3:10902 prove deduplicated current host metrics for all four nodes and older samples backed by node4 object blocks."

[[probes]]
id = "thanos-objectstore-security"
level = 2
targets = ["node3", "node4"]
max_exec_calls = 6
procedure = "Using protected configuration without printing secrets, verify hostname-validating TLS and authentication to the object store; test anonymous/plaintext failure and inspect credential/key modes, service identity, listener/firewall scope, AppArmor, and SSH state."

[[probes]]
id = "thanos-operational-state"
level = 5
targets = ["node1", "node2", "node3", "node4"]
max_exec_calls = 5
procedure = "Inspect failed or duplicate monitoring processes, stale binaries/archives, temporary PKI or credentials, conflicting configs, excessive privilege, enabled SSH, debug/admin exposure, and executor-created residue."

[[probes]]
id = "thanos-prometheus-loss"
level = 6
targets = ["node1", "node2", "node3"]
effect = "controlled_failure"
max_exec_calls = 10
procedure = "Capture a current deduplicated query and a historical query, stop node1's actual Prometheus service, and prove node3 continues current and retained queries without duplicate logical series. Restore node1 and require Prometheus plus sidecar to rejoin while deduplication remains correct."
cleanup = "Restore node1 services, wait for all stores and scrape targets, and remove evaluator query artifacts."

[[probes]]
id = "thanos-representative-reboots"
level = 8
targets = ["node1", "node3"]
effect = "reboot"
max_exec_calls = 9
procedure = "Record boot identities, reboot one Prometheus node and the Thanos query/store node sequentially, then prove current deduplicated and retained historical queries recover automatically."
cleanup = "Wait for all monitoring components and stores to become healthy."

[[probes]]
id = "thanos-remaining-reboots"
level = 10
targets = ["node2", "node4"]
effect = "reboot"
max_exec_calls = 9
procedure = "Record boot identities, reboot the second Prometheus replica and object-store node sequentially, then verify both replicas scrape all hosts, object blocks remain, fresh samples arrive, and deduplicated current/historical queries work."
cleanup = "Wait for complete stack convergence and remove evaluator query artifacts."

[[assertions]]
id = "thanos-two-replicas-scrape-all-hosts"
probe = "thanos-metrics-contract"
dimension = "functionality"
points = 3
critical = true
pass_condition = "Two independent Prometheus replicas with unique replica labels actively scrape current host metrics from all four systems."
fail_condition = "Live target/API evidence confirms a missing replica label, replica, host target, or current scrape."

[[assertions]]
id = "thanos-query-deduplicates-and-retains"
probe = "thanos-metrics-contract"
dimension = "functionality"
points = 3
critical = true
pass_condition = "Node3 query exposes required stores, returns one deduplicated logical series for current metrics, and reads older samples from node4 object blocks."
fail_condition = "Authenticated API/object evidence confirms duplicate logical series, missing store, absent retained blocks, or unavailable historical query."

[[assertions]]
id = "thanos-objectstore-protected"
probe = "thanos-objectstore-security"
dimension = "security"
points = 2
critical = true
pass_condition = "Object traffic requires validated TLS and authentication, private material is protected, and exposure is limited to required peers."
fail_condition = "A valid probe confirms plaintext/anonymous access, invalid TLS acceptance, exposed secrets, broad listener/firewall scope, or disabled host controls."

[[assertions]]
id = "thanos-state-clean"
probe = "thanos-operational-state"
dimension = "operational_hygiene"
points = 1
pass_condition = "Only required Prometheus, Thanos, object-store, TSDB/object data, PKI, logs, and maintained tooling remain."
fail_condition = "Concrete failed, duplicate, stale, debug, unsafe, temporary, or abandoned executor state remains."

[[assertions]]
id = "thanos-survives-prometheus-loss"
probe = "thanos-prometheus-loss"
dimension = "resilience"
points = 3
critical = true
pass_condition = "During node1 Prometheus loss, current data from the survivor and retained historical data remain queryable without duplicate logical series."
fail_condition = "The confirmed replica outage removes required current/historical query service or creates duplicate logical series."

[[assertions]]
id = "thanos-prometheus-rejoins"
probe = "thanos-prometheus-loss"
dimension = "resilience"
points = 2
critical = true
requires = ["thanos-survives-prometheus-loss"]
pass_condition = "Restored Prometheus and its sidecar rejoin automatically and deduplicated current queries remain correct."
fail_condition = "Restored services require repair, remain absent/stale, or reintroduce duplicate query series."

[[assertions]]
id = "thanos-two-roles-persist"
probe = "thanos-representative-reboots"
dimension = "persistence"
points = 2
critical = true
pass_condition = "Node1 and node3 change boot identities and Prometheus, Thanos query/store, current metrics, and historical queries recover automatically."
fail_condition = "A completed representative reboot loses required service, current data, store visibility, deduplication, or retained query access."

[[assertions]]
id = "thanos-full-stack-persists"
probe = "thanos-remaining-reboots"
dimension = "persistence"
points = 2
critical = true
pass_condition = "Node2 and node4 change boot identities and the complete stack restores both replicas, all targets, object blocks, fresh samples, and deduplicated queries."
fail_condition = "A completed remaining-role reboot loses replica health, object data, fresh ingestion, or current/historical query service."
