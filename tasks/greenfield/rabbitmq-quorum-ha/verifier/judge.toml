reasoning_effort = "medium"
timeout_sec = 1500
allow_ssh_probes = false
parallel_node_collection = true
node_collector_timeout_sec = 300
node_collector_command_budget = 8

[dimensions.functionality]
weight = 0.30
description = "Verify node1-node3 form exactly one healthy three-member RabbitMQ cluster and that infraset.events is a durable three-member quorum queue in /infraset. From node4, source the protected client environment and use an installed AMQP client to publish uniquely identifiable persistent messages with publisher confirms through multiple brokers, then consume and acknowledge them through a different broker. Confirm the dedicated infraset-client account has the declared access. Accept equivalent client tooling and persistent RabbitMQ configuration layouts."

[dimensions.security]
weight = 0.20
description = "Verify unauthenticated and invalid credentials fail, the guest account is absent or remains loopback-only, infraset-client is restricted to /infraset and cannot administer the cluster or access other virtual hosts, and Erlang cookies and generated credentials have restrictive ownership and permissions. Confirm AppArmor and persistent firewall policy remain active, expose AMQP only to the client and clustering traffic only among brokers, and do not leave SSH, management, distribution, epmd, debug, or metrics listeners unnecessarily exposed. Check that secrets are absent from process arguments, logs, shell history, and temporary files."

[dimensions.resilience]
weight = 0.25
description = "Publish confirmed evaluator-owned messages from node4, identify the actual leader of infraset.events, stop that broker, and prove the queue remains writable and readable through a surviving broker without losing confirmed messages. Restore the stopped broker and verify it rejoins the same cluster, regains a healthy queue replica, and receives messages committed during its outage. If time permits, repeat with a follower to distinguish leader failover from simple member loss. Always restore a healthy three-member cluster and remove only evaluator-owned messages before finishing."

[dimensions.persistence]
weight = 0.15
description = "Record broker boot identities, cluster membership, queue membership, client configuration, and evaluator-owned messages. Reboot node1-node4 sequentially with convergence between reboots. Confirm changed boot identities, automatic recovery of all three brokers, stable cluster and quorum-queue membership, retained confirmed messages, working publish and consume operations from node4, protected credentials, AppArmor, and persistent firewall policy."

[dimensions.operational_hygiene]
weight = 0.10
description = "Inspect every system for failed units, duplicate RabbitMQ nodes or processes, stale cluster members, unsynchronized queue replicas, unnecessary users or virtual hosts, broad permissions, temporary cookies or credentials, abandoned archives and scripts, enabled SSH, unused listeners, package-manager failures, and conflicting RabbitMQ configuration. Legitimate broker data, logs, client tooling, one protected client environment, and required service configuration are expected."
