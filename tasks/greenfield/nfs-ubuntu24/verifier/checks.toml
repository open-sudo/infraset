schema_version = 1

[[probes]]
id = "nfs-service-and-mounts"
level = 1
targets = ["node1", "node2", "node3"]
max_exec_calls = 3
procedure = "Inspect node1's active NFSv4 export of /srv/nfs/shared and directly establish that node2 and node3 have live /mnt/shared mounts backed by that export over the declared storage network."

[[probes]]
id = "nfs-cross-client-io"
level = 1
targets = ["node1", "node2", "node3"]
effect = "evaluator_owned_data"
max_exec_calls = 6
procedure = "As sharedops rather than root, create uniquely named files through each client with deliberate non-default modes; observe each file through the other client and the server, including numeric owner, group, and mode."
cleanup = "Remove evaluator-owned files as sharedops, confirm removal through both clients, and leave the mounts active."

[[probes]]
id = "nfs-operational-state"
level = 5
targets = ["node1", "node2", "node3"]
max_exec_calls = 3
procedure = "Inspect failed units, conflicting exports or mounts, inappropriate server/client role packages and services, stale configuration copies, temporary scripts, debug state, and executor-created test data."

[[probes]]
id = "nfs-server-client-reboots"
level = 8
targets = ["node1", "node2"]
effect = "reboot"
max_exec_calls = 8
procedure = "Create evaluator data that must survive, record boot identities, reboot node1 and node2 sequentially, wait for the export and client mounts to reconnect, then repeat cross-client reads and writes as sharedops."
cleanup = "Wait for server and mounts to recover and remove evaluator-owned persistence data."

[[probes]]
id = "nfs-remaining-client-reboot"
level = 10
targets = ["node3"]
effect = "reboot"
max_exec_calls = 5
procedure = "Record node3's boot identity, reboot it, and confirm /mnt/shared reconnects automatically with shared data, numeric ownership, modes, and new sharedops I/O intact."
cleanup = "Wait for node3's mount to return and remove evaluator-owned data."

[[assertions]]
id = "nfs-server-export-live"
probe = "nfs-service-and-mounts"
dimension = "functionality"
points = 2
critical = true
pass_condition = "Node1 actively serves /srv/nfs/shared as an NFSv4 export on the dedicated storage network."
fail_condition = "Node1 is reachable but the required export is confirmed absent, inactive, or not backed by /srv/nfs/shared."

[[assertions]]
id = "nfs-both-client-mounts-live"
probe = "nfs-service-and-mounts"
dimension = "functionality"
points = 2
critical = true
requires = ["nfs-server-export-live"]
pass_condition = "Node2 and node3 each have a live /mnt/shared mount backed by node1's required export."
fail_condition = "Either reachable client confirms /mnt/shared absent, stale, or backed by a different source."

[[assertions]]
id = "nfs-node2-write-visible"
probe = "nfs-cross-client-io"
dimension = "functionality"
points = 2
critical = true
requires = ["nfs-both-client-mounts-live"]
pass_condition = "A file committed as sharedops through node2 is immediately returned with identical content through node3 and node1."
fail_condition = "Healthy mounts confirm node2's committed evaluator file missing or inconsistent on node3 or node1."

[[assertions]]
id = "nfs-node3-write-visible"
probe = "nfs-cross-client-io"
dimension = "functionality"
points = 2
critical = true
requires = ["nfs-both-client-mounts-live"]
pass_condition = "A file committed as sharedops through node3 is immediately returned with identical content through node2 and node1."
fail_condition = "Healthy mounts confirm node3's committed evaluator file missing or inconsistent on node2 or node1."

[[assertions]]
id = "nfs-identity-and-modes-preserved"
probe = "nfs-cross-client-io"
dimension = "functionality"
points = 2
critical = true
requires = ["nfs-node2-write-visible", "nfs-node3-write-visible"]
pass_condition = "The sharedops identity is UID/GID 4200 on all nodes, the exported directory is 4200:4200 mode 2770, and evaluator files retain their authored numeric ownership and modes through every view."
fail_condition = "Live cross-client evidence confirms an inconsistent shared identity, incorrect export-directory metadata, or changed evaluator-file ownership/mode."

[[assertions]]
id = "nfs-state-clean"
probe = "nfs-operational-state"
dimension = "operational_hygiene"
points = 1
pass_condition = "Only role-appropriate NFS identities, packages, services, exports, mounts, configuration, logs, and necessary tooling remain."
fail_condition = "Concrete executor-created conflicting, duplicate, failed, debug, temporary, backup, or test state remains."

[[assertions]]
id = "nfs-server-and-client-persist"
probe = "nfs-server-client-reboots"
dimension = "persistence"
points = 2
critical = true
pass_condition = "Node1 and node2 have changed boot identities and the export, mount, preserved data metadata, and new sharedops cross-client I/O recover automatically."
fail_condition = "A completed server or client reboot is confirmed to lose the export, mount, data, ownership/modes, or working sharedops I/O."

[[assertions]]
id = "nfs-all-nodes-persist"
probe = "nfs-remaining-client-reboot"
dimension = "persistence"
points = 1
critical = true
pass_condition = "Node3 has changed boot identity and its persistent mount, shared data metadata, and sharedops I/O return automatically."
fail_condition = "Node3's completed reboot is confirmed to lose its mount, shared data, ownership/modes, or working I/O."
