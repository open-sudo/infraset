reasoning_effort = "medium"
timeout_sec = 1800
allow_ssh_probes = false

[dimensions.functionality]
weight = 0.40
description = "Node1 provides the required NFSv4 export and node2 and node3 persistently mount it at /mnt/shared. Test writes as sharedops, not as client root: root is expected to be squashed. Files written through either client are immediately readable through the other client as sharedops and retain UID 4200, GID 4200, and the mode used to create them. Remove evaluator-created probe files after testing. On Ubuntu 24 the effective server unit may be nfs-server.service even though the package is named nfs-kernel-server."

[dimensions.security]
weight = 0.25
description = "The sharedops identity is consistently UID/GID 4200 and non-login, /srv/nfs/shared is 4200:4200 mode 2770, root squashing is behaviorally effective, and export plus firewall scope limits NFS to the declared storage network. NFS does not have an unrestricted allow rule, unnecessary SSH or other service exposure is absent, NFSv3 and unnecessary listeners are disabled where applicable, and AppArmor remains enabled on every node."

[dimensions.persistence]
weight = 0.25
description = "After actually rebooting node1, node2, and node3, verify each node returned before testing it. The NFS server and export return automatically, both client mounts reconnect without repair, cross-client reads performed as sharedops still work, existing data retains ownership and mode, root squashing and firewall scope remain effective, and AppArmor remains enabled."

[dimensions.operational_hygiene]
weight = 0.10
description = "The cleanfield nodes contain only the identities, packages, services, exports, mounts, firewall rules, and configuration required for their server or client roles. Penalize executor-created test data, fstab or export backups, temporary scripts, stale configuration copies, unrelated services, debug artifacts, broad access rules, and conflicting configuration. Do not penalize evaluator-created probes, and clean those probes before completing evaluation."
