cluster = ["ubuntu24.04 x3"]
max_clusters = 3
base_runbooks = ["antrieb/primer", "antrieb/networking-primer"]
control_node = "node1"
endpoint = "https://antrieb.sh/mcp"

[[networks]]
name = "cache"
dhcp = true
egress = true

[nics]
node1 = [{ net = "cache" }]
node2 = [{ net = "cache" }]
node3 = [{ net = "cache" }]
