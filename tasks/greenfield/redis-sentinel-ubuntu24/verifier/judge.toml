reasoning_effort = "medium"
timeout_sec = 1500
allow_ssh_probes = false

[dimensions.functionality]
weight = 0.30
description = "Inspect all three Ubuntu 24.04 nodes and verify one writable Redis primary, two synchronized read-only replicas, and three Sentinels monitoring the master name infra-primary. Use authenticated TLS clients to confirm infra:proof equals ready, query every Redis and Sentinel endpoint, and prove that Sentinel reports the same topology. Score observable replication and client behavior rather than a particular package source, unit name, or configuration layout."

[dimensions.security]
weight = 0.25
description = "Verify effective TLS and authentication for Redis 6379 and Sentinel 26379 with node-name certificate validation. Plaintext, unauthenticated, default, and invalid-credential access must fail. Confirm Redis, replication, and Sentinel traffic are confined to the cache network; protected mode and appropriate command or ACL controls remain effective; secrets and private keys have restrictive ownership and modes; services lack unnecessary privilege; AppArmor and persistent firewall policy remain active; and SSH is not enabled. Accept equivalent secure ACL, firewall, and PKI implementations."

[dimensions.resilience]
weight = 0.20
description = "After initial replication proof, stop the actual Redis service on node1 and record the action. Confirm Sentinel promotes exactly one replica, clients can discover it, an evaluator-owned write succeeds there, and the remaining replica receives it. Restore node1 and confirm it automatically rejoins as a synchronized read-only replica without split brain or automatic failback. Always attempt to restore evaluator-changed services before finishing."

[dimensions.persistence]
weight = 0.15
description = "Record boot identities and reboot all three systems sequentially, waiting for Redis and Sentinel convergence after each reboot. Confirm changed boot identities, exactly one writable primary, two synchronized replicas, working Sentinel discovery, retained and new data, TLS and authentication enforcement, enabled service recovery, and persistent AppArmor and firewall controls without evaluator repair."

[dimensions.operational_hygiene]
weight = 0.10
description = "Inspect every node for failed units, abandoned downloads or installers, temporary scripts and credentials, world-readable secrets, stale Sentinel state, duplicate Redis stacks, debug or plaintext listeners, enabled SSH, unnecessary users, packages, services, or firewall openings, and conflicting configuration. Legitimate Redis data, persistence files, logs, PKI, service configuration, and runtime packages are expected. Remove evaluator-created keys, files, and state records before finishing."
