schema_version = 1

[[probes]]
id = "etcd-initial-state"
level = 1
targets = ["node1", "node2", "node3", "node4"]
max_exec_calls = 4
procedure = "Inspect exact initial membership, endpoint health/identity, node4 cold-replacement status, and the required restore-proof key."

[[probes]]
id = "etcd-linearizable-io"
level = 1
targets = ["node1", "node2", "node3"]
effect = "evaluator_owned_data"
max_exec_calls = 4
procedure = "Write one unique evaluator key through one member, linearly read it through every advertised client endpoint, compare revisions, and delete it."
cleanup = "Delete the evaluator key and confirm deletion through a different endpoint."

[[probes]]
id = "etcd-mtls-security"
level = 2
targets = ["node1", "node2", "node3", "node4"]
max_exec_calls = 5
procedure = "Test plaintext, unauthenticated, and untrusted access; inspect endpoint schemes, certificate identity/lifetime, distinct member keys, credential modes, service privilege, SELinux, firewalld scope, SSH, and insecure listeners."

[[probes]]
id = "etcd-snapshot"
level = 3
targets = ["node4"]
max_exec_calls = 3
procedure = "Use compatible tooling to inspect /var/backups/etcd/snapshot.db for integrity, revision, cluster content, and restore-proof data."

[[probes]]
id = "etcd-operational-state"
level = 5
targets = ["node1", "node2", "node3", "node4"]
max_exec_calls = 4
procedure = "Inspect failed/duplicate services, stale data, abandoned downloads/PKI, broad snapshots, debug/SSH exposure, unnecessary resources, and rollback residue."

[[probes]]
id = "member-loss"
level = 6
targets = ["node1", "node2", "node3"]
effect = "controlled_failure"
max_exec_calls = 8
procedure = "Stop node3 etcd, commit/read evaluator data through node1/node2, restore node3, and verify it receives the outage revision."
cleanup = "Restore node3, confirm three-member health, and delete evaluator keys."

[[probes]]
id = "snapshot-recovery"
level = 7
targets = ["node1", "node2", "node3", "node4"]
effect = "controlled_failure"
max_exec_calls = 14
procedure = "Preserve rollback material, stop the old service, and restore the verified snapshot as one new logical three-voter cluster on node1, node2, and node4 with node3 retired."
cleanup = "Leave the recovered topology healthy, or restore a documented healthy original topology from rollback material after a failed attempt."

[[probes]]
id = "recovered-cluster-reboots"
level = 8
targets = ["node1", "node2", "node4"]
effect = "reboot"
max_exec_calls = 11
procedure = "Record identities and reboot recovered members sequentially while preserving quorum; retest membership, I/O, TLS, SELinux, firewall policy, and data."
cleanup = "Wait for the recovered cluster and delete evaluator keys."

[[probes]]
id = "retired-node-reboot"
level = 10
targets = ["node3"]
effect = "reboot"
max_exec_calls = 4
procedure = "Record and reboot retired node3, then inspect its membership/service state and the recovered cluster."
cleanup = "Leave node3 safely retired and the recovered cluster healthy."

[[assertions]]
id = "initial-membership-exact"
probe = "etcd-initial-state"
dimension = "functionality"
points = 1
critical = true
pass_condition = "Node1-node3 are exactly three healthy voters of one cluster and node4 is absent."
fail_condition = "Administrative state confirms incorrect membership, identity, health, or node4 inclusion."

[[assertions]]
id = "restore-proof-present"
probe = "etcd-initial-state"
dimension = "functionality"
points = 1
critical = true
pass_condition = "/infraset/restore-proof equals ready through protected administrative access."
fail_condition = "A healthy authenticated cluster confirms the proof key missing or incorrect."

[[assertions]]
id = "all-endpoints-linearizable"
probe = "etcd-linearizable-io"
dimension = "functionality"
points = 1
critical = true
requires = ["initial-membership-exact"]
pass_condition = "Evaluator data commits and is linearly returned at a consistent revision through every advertised endpoint."
fail_condition = "A healthy intended endpoint is confirmed unable to participate in consistent I/O."

[[assertions]]
id = "client-peer-urls-use-https"
probe = "etcd-mtls-security"
dimension = "security"
points = 1
critical = true
pass_condition = "Every advertised client and peer URL uses HTTPS."
fail_condition = "Any advertised required endpoint is confirmed to use plaintext HTTP."

[[assertions]]
id = "mutual-tls-enforced"
probe = "etcd-mtls-security"
dimension = "security"
points = 2
critical = true
pass_condition = "Plaintext, unauthenticated, and untrusted clients are rejected while intended administrative trust succeeds."
fail_condition = "Plaintext/untrusted/unauthenticated access is confirmed accepted or intended trust cannot work despite correct credentials."

[[assertions]]
id = "member-keys-distinct-protected"
probe = "etcd-mtls-security"
dimension = "security"
points = 1
critical = true
pass_condition = "Member private keys are distinct, identity-correct, nonexpired, and narrowly readable."
fail_condition = "A member key is confirmed shared, mismatched, expired, or exposed beyond its role."

[[assertions]]
id = "etcd-selinux-enforcing"
probe = "etcd-mtls-security"
dimension = "security"
points = 1
critical = true
pass_condition = "SELinux remains enforcing on every CentOS Stream system."
fail_condition = "SELinux is confirmed permissive or disabled anywhere."

[[assertions]]
id = "etcd-network-privilege-limited"
probe = "etcd-mtls-security"
dimension = "security"
points = 1
pass_condition = "Service privilege, persistent firewalld, SSH, and listeners are limited to required identities and member peers."
fail_condition = "Unnecessary root privilege, insecure listener, broad etcd/SSH exposure, or nonpersistent policy is confirmed."

[[assertions]]
id = "snapshot-valid-current"
probe = "etcd-snapshot"
dimension = "functionality"
points = 1
critical = true
pass_condition = "The snapshot is internally valid/current and contains restore-proof=ready."
fail_condition = "Compatible tooling confirms the snapshot corrupt, stale, or missing committed proof data."

[[assertions]]
id = "etcd-state-clean"
probe = "etcd-operational-state"
dimension = "operational_hygiene"
points = 1
pass_condition = "Only required etcd tooling, member data, PKI, services, snapshots, logs, and operational state remains."
fail_condition = "Concrete executor-created failed, duplicate, stale, broad-secret, debug, SSH, unnecessary, or rollback state remains."

[[assertions]]
id = "quorum-survives-node3-loss"
probe = "member-loss"
dimension = "resilience"
points = 1
critical = true
pass_condition = "Node1/node2 commit and linearly return evaluator data while node3 is stopped."
fail_condition = "One confirmed member outage stops quorum I/O or loses committed data."

[[assertions]]
id = "node3-rejoins-current"
probe = "member-loss"
dimension = "resilience"
points = 1
critical = true
requires = ["quorum-survives-node3-loss"]
pass_condition = "Restored node3 rejoins the same cluster automatically with the outage revision."
fail_condition = "Restored node3 is reachable but cannot safely catch up without repair."

[[assertions]]
id = "snapshot-restores-three-voter-cluster"
probe = "snapshot-recovery"
dimension = "resilience"
points = 2
critical = true
requires = ["snapshot-valid-current"]
pass_condition = "One healthy node1/node2/node4 logical cluster is restored with exact membership and proof data, with node3 retired."
fail_condition = "True three-member recovery is confirmed to fail, lose data, or coexist unsafely with old membership."

[[assertions]]
id = "restored-cluster-keeps-mtls"
probe = "snapshot-recovery"
dimension = "resilience"
points = 1
critical = true
requires = ["snapshot-restores-three-voter-cluster"]
pass_condition = "Every recovered endpoint remains healthy with mutual TLS enforced."
fail_condition = "The recovered cluster is confirmed to weaken TLS or expose an unhealthy/insecure endpoint."

[[assertions]]
id = "recovered-cluster-persists"
probe = "recovered-cluster-reboots"
dimension = "persistence"
points = 2
critical = true
requires = ["snapshot-restores-three-voter-cluster"]
pass_condition = "All recovered-member boot identities change and exact membership, I/O, TLS, data, SELinux, and firewall state recover automatically."
fail_condition = "A completed reboot is confirmed to lose quorum, membership, data, TLS, or host controls."

[[assertions]]
id = "retired-node-stays-retired"
probe = "retired-node-reboot"
dimension = "persistence"
points = 1
critical = true
pass_condition = "Node3 reboots and remains safely outside membership while node1/node2/node4 stay healthy."
fail_condition = "Node3 is confirmed to reintroduce stale membership, split brain, or unsafe automatic service."
