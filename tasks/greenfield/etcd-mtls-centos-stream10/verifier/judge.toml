reasoning_effort = "medium"
timeout_sec = 1500
allow_ssh_probes = false

[dimensions.functionality]
weight = 0.20
description = "Verify live etcd behavior on four CentOS Stream 10 systems. Node1, node2, and node3 must be three healthy voting members, with node4 prepared but absent from initial membership. Discover and use the administrative client access provided on node1 to make linearizable writes and reads through every advertised client endpoint, including /infraset/restore-proof=ready. Confirm consistent member and cluster identity, persistent host-service management, and a valid current snapshot at /var/backups/etcd/snapshot.db on node4. Validate the snapshot semantically rather than accepting file presence alone; do not require a particular service unit, data directory, configuration layout, or credential filename."

[dimensions.security]
weight = 0.25
description = "Verify effective mutual TLS for both client and peer transport. Every advertised client and peer URL must use HTTPS; plaintext and unauthenticated client attempts must fail, while the provided administrative identity succeeds. Inspect runtime behavior and configuration to confirm trusted-CA validation, modern TLS, correct identities, unique member private keys, non-expired certificates, restrictive ownership and modes, and separation of service and administrative credentials. Confirm etcd runs without unnecessary privilege, SELinux remains enforcing, firewalld has persistent member-scoped access, and no unnecessary insecure listeners or remote-access service remains. Accept equivalent secure file and service layouts."

[dimensions.resilience]
weight = 0.25
description = "First stop node3's etcd.service, record that evaluator action, and prove node1 and node2 retain quorum by committing and linearly reading an evaluator key. Restore node3 and verify it rejoins the same cluster and receives the write. Then validate true disaster recovery: preserve rollback copies, stop the old cluster, restore the same verified snapshot as a new logical three-voter cluster on node1, node2, and replacement node4, and retire node3. Confirm the recovered membership is exactly node1/node2/node4, all endpoints are healthy, mutual TLS remains effective, and /infraset/restore-proof still equals ready. A snapshot restored into only one member of the live old cluster is invalid. Always attempt rollback or leave a clearly documented recoverable state after a failed recovery step."

[dimensions.persistence]
weight = 0.20
description = "Record boot identities and reboot node3 after it rejoins and node4 while it is still the cold replacement; verify both actually reboot and retain their intended state. After disaster recovery, reboot node1, node2, and node4 sequentially so quorum remains available. Confirm changed boot identities, enabled service recovery, exact restored membership, linearizable reads and writes, TLS enforcement, SELinux, persistent firewalld policy, restored data, and usable snapshot files without evaluator repair."

[dimensions.operational_hygiene]
weight = 0.10
description = "Inspect all nodes before destructive recovery for abandoned download archives, installers, temporary PKI material, stale backup configurations, duplicate etcd services or binaries, failed units, debug listeners, world-readable keys or snapshots, unnecessary users, packages, services, firewall openings, enabled SSH, and old data directories created by the executor. Legitimate etcd binaries, tools, member data, PKI, service configuration, and the required snapshot are expected. Remove all evaluator-created keys, files, rollback data, and state records that can be removed safely before finishing."
