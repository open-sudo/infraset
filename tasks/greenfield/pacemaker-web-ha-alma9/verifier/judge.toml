reasoning_effort = "medium"
timeout_sec = 1500
allow_ssh_probes = false
parallel_node_collection = true
node_collector_timeout_sec = 300
node_collector_command_budget = 8

[dimensions.functionality]
weight = 0.25
description = "Inspect all three AlmaLinux 9 systems and discover the executor's Pacemaker resource layout. Verify a healthy three-member infraset-ha cluster with node3 acting only as a quorum member. From a managed client node, exercise HTTP through the declared floating address on TCP 8080 and require a successful response containing infraset-ha. Prove that the floating address, replicated storage mounted at /srv/ha-web, and Apache service are cluster-managed, ordered safely, colocated on exactly one of node1 or node2, and not active on node3. Write an evaluator-owned file into the active replicated filesystem and prove it is served through the floating address. Accept DRBD, a replicated filesystem, or another implementation that provides equivalent synchronous ownership and failover behavior. Do not award credit merely for packages, copied files on both nodes, or configuration text."

[dimensions.security]
weight = 0.20
description = "Verify effective cluster and application security without prescribing one configuration layout. Require working non-dummy fencing backed by a live watchdog on every member, protected Corosync and Pacemaker authentication material, non-default protected cluster administration credentials, least-privileged service identities, and no simultaneous writable activation of replicated storage. Confirm SELinux remains enforcing and correctly permits the active services, and that runtime and persistent firewalld policy restrict Corosync, Pacemaker administration, storage replication, watchdog coordination, and TCP 8080 to the declared HA network or narrower role-specific peers. Reject broad application or cluster exposure, disabled mandatory controls, globally enabled SSH, permissive credentials, or fence_dummy and similarly non-operative fencing substitutes."

[dimensions.resilience]
weight = 0.25
description = "After recording the active service node, storage health, resource placement, and boot identities, create an evaluator-owned content probe on the active replicated filesystem. Inject one controlled unplanned loss of the active service node using cluster-network or Corosync isolation suitable for exercising the configured watchdog fencing; do not use a graceful standby as the sole failure test. Prove the isolated member is actually fenced or self-fences, the surviving service node acquires the declared floating address without concurrent writable activation, and the original and evaluator content remain available. Restore any evaluator-altered state, verify the fenced member returns online, storage becomes current, and the member is again eligible to host resources. Also verify a planned move between node1 and node2 preserves content. Never leave a node isolated, in standby, or with a temporary constraint."

[dimensions.persistence]
weight = 0.20
description = "Record boot identities and reboot node1, node2, and node3 sequentially while preserving application availability through the sequence. Confirm changed boot identities, automatic cluster membership, quorum, watchdog fencing readiness, replicated-storage health, persistent resource configuration, SELinux enforcement, and persistent firewalld policy without evaluator repair. After all reboots, move or fail over the application between node1 and node2 and prove both the original page and an evaluator-created persistent content probe are still served through the declared floating address on TCP 8080."

[dimensions.operational_hygiene]
weight = 0.10
description = "Inspect all nodes for failed cluster actions, stale location constraints, disabled fencing, unmanaged duplicate Apache instances, simultaneously mounted replicated data, stale DRBD or replication state, temporary setup scripts, broad secrets, repository artifacts, package archives, debug services, unnecessary listeners, enabled SSH, and unrelated packages or services. Legitimate Pacemaker, Corosync, watchdog, fencing, replication, Apache, firewall, and SELinux state is expected. Remove evaluator-created files, constraints, standby state, isolation rules, and test records before finishing, and verify the application remains healthy after cleanup."
