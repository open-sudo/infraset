cluster = ["sonic x2", "ubuntu24.04 x2"]
base_runbooks = [
  "antrieb/primer",
  "antrieb/networking-primer",
  "antrieb/sonic-reference",
]
control_node = "node3"
endpoint = "https://antrieb.sh/mcp"

[[networks]]
name = "mgmt"
dhcp = true
egress = true

[[networks]]
name = "transit-a"
dhcp = false
egress = false

[[networks]]
name = "transit-b"
dhcp = false
egress = false

[[networks]]
name = "lan-a"
dhcp = false
egress = false

[[networks]]
name = "lan-b"
dhcp = false
egress = false

[nics]
node1 = [{ net = "mgmt" }, { net = "transit-a" }, { net = "transit-b" }, { net = "lan-a" }]
node2 = [{ net = "mgmt" }, { net = "transit-a" }, { net = "transit-b" }, { net = "lan-b" }]
node3 = [{ net = "mgmt" }, { net = "lan-a" }]
node4 = [{ net = "mgmt" }, { net = "lan-b" }]
