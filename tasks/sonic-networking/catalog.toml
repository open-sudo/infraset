[[tasks]]
number = 1
slug = "transparent-l2-bridge"
difficulty = "medium"
agent_timeout_sec = 2400
verifier_timeout_sec = 1500
topology = "two-segment"
appliances = 1
linux_nodes = 2
control_node = "node2"
instruction = """
`node2` and `node3` are attached to two different segments of `node1`. Join
those segments into a single layer-2 domain, so the two hosts share one
subnet and reach each other directly with `node1` forwarding frames rather
than standing in the path as a routed hop.
"""

[[tasks]]
number = 2
slug = "port-isolation"
difficulty = "medium"
agent_timeout_sec = 2400
verifier_timeout_sec = 1500
topology = "single-segment"
appliances = 1
linux_nodes = 2
control_node = "node2"
instruction = """
`node2` and `node3` are attached to the same segment on `node1` and share a
subnet with it. Keep the two hosts from exchanging traffic with each other
directly, while both continue to reach `node1` itself on that subnet.
"""

[[tasks]]
number = 3
slug = "vlan-access-segmentation"
difficulty = "hard"
agent_timeout_sec = 2400
verifier_timeout_sec = 1500
topology = "two-segment"
appliances = 1
linux_nodes = 2
control_node = "node2"
instruction = """
`node1` connects `node2` on one segment and `node3` on another. Put each
host's segment into its own VLAN on `node1` as an untagged access port, so
the two hosts stay separated from one another while each keeps a working
link to `node1` inside its own VLAN.
"""

[[tasks]]
number = 4
slug = "inter-vlan-routing"
difficulty = "medium"
agent_timeout_sec = 2400
verifier_timeout_sec = 1500
topology = "two-segment"
appliances = 1
linux_nodes = 2
control_node = "node2"
instruction = """
`node2` and `node3` sit behind `node1` on separate VLANs, each in its own
subnet. Give `node1` a routed interface inside each VLAN and forward traffic
between them, so the two hosts reach each other across the VLAN boundary.
"""

[[tasks]]
number = 5
slug = "transit-traffic-acl"
difficulty = "medium"
agent_timeout_sec = 2400
verifier_timeout_sec = 1500
topology = "two-segment"
appliances = 1
linux_nodes = 2
control_node = "node2"
instruction = """
`node1` forwards traffic between `node2` and `node3`. Let the two hosts
reach each other on TCP port 8080, have `node1` refuse TCP port 23 passing
between them, and leave the rest of the forwarded traffic untouched.
"""

[[tasks]]
number = 6
slug = "dhcp-relay"
difficulty = "hard"
agent_timeout_sec = 2400
verifier_timeout_sec = 1500
topology = "two-segment"
appliances = 1
linux_nodes = 2
control_node = "node2"
instruction = """
`node2` runs an address-assignment service for the subnet `node3` belongs
to, but the two hosts sit on different segments of `node1`, so the service's
broadcast traffic stays on `node2`'s segment. Arrange for `node3` to obtain
its address from the service running on `node2`.
"""

[[tasks]]
number = 7
slug = "configdb-persistence"
difficulty = "medium"
agent_timeout_sec = 2400
verifier_timeout_sec = 1500
topology = "two-segment"
appliances = 1
linux_nodes = 2
control_node = "node2"
instruction = """
Give `node1` a routed address on each of its two segments and a working path
between `node2` and `node3`. Arrange for that configuration to return on its
own after `node1` is restarted, with the two hosts reaching each other again
once it comes back up.
"""

[[tasks]]
number = 8
slug = "dynamic-route-exchange"
difficulty = "hard"
agent_timeout_sec = 2400
verifier_timeout_sec = 1500
topology = "dual-site"
appliances = 2
linux_nodes = 2
control_node = "node3"
instruction = """
`node3` sits behind `node1` and `node4` sits behind `node2`, each on its own
private network, and the two switches share a transit link. Have `node1` and
`node2` learn each other's private network through a routing protocol rather
than from routes entered by hand, so `node3` and `node4` reach each other.
"""

[[tasks]]
number = 9
slug = "redundant-uplinks"
difficulty = "hard"
agent_timeout_sec = 2400
verifier_timeout_sec = 1500
topology = "dual-transit"
appliances = 2
linux_nodes = 2
control_node = "node3"
instruction = """
`node1` and `node2` are joined by two independent links, and each serves a
private network holding one host, `node3` and `node4`. Carry traffic between
the two private networks over both links, and keep `node3` and `node4`
reaching each other when either one of the links is taken out of service.
"""

[[tasks]]
number = 10
slug = "traffic-mirroring"
difficulty = "hard"
agent_timeout_sec = 2400
verifier_timeout_sec = 1500
topology = "single-segment"
appliances = 1
linux_nodes = 2
control_node = "node2"
instruction = """
`node1` shares one segment with `node2` and `node3`. Deliver a copy of the
traffic `node1` exchanges with `node2` to `node3` as well, so a capture
running on `node3` shows those packets even though they are addressed
elsewhere, while the traffic between `node1` and `node2` keeps flowing as it
did before.
"""
