timeout_sec = 180

[[steps]]
id = "prepare-inventory-data"
stage = 10
node = "node1"
command = '''
set -eu
        install -d -o root -g root -m 0755 /srv/inventory/data
        printf '%s
' 'sku-1001,keyboard,12' 'sku-1002,display,7' > /srv/inventory/data/records.csv
        printf '%s
' '{"site":"north","generation":4}' > /srv/inventory/data/config.json
        chown -R root:root /srv/inventory
        chmod 0755 /srv/inventory /srv/inventory/data
        chmod 0644 /srv/inventory/data/records.csv /srv/inventory/data/config.json
'''
