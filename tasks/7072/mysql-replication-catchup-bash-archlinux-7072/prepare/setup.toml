timeout_sec = 180

[[steps]]
id = "seed-node1"
stage = 10
node = "node1"
command = "set -eu\nPATH=/usr/sbin:/usr/bin:/sbin:/bin\nexport PATH\nLC_ALL=C\nexport LC_ALL\nas_root() {\n  if [ \"$(id -u)\" -eq 0 ]; then\n    \"$@\"\n  else\n    sudo -n \"$@\"\n  fi\n}\nas_root sh -s <<'BASH_MATRIX_SEED'\n# POSIX sh; works with GNU coreutils and BusyBox. No guest Python dependency.\nset -eu\numask 022\nLC_ALL=C\nTZ=UTC0\nexport LC_ALL TZ\nseed_root=/srv/legacy2/mysql-replication-catchup\nstaging=\ntrap '[ -z \"$staging\" ] || rm -f \"$staging\"' 0\ntrap 'exit 1' 1 2 15\n\nsafe_dir() (\n    [ ! -L \"$1\" ] || { printf 'Symlink directory: %s\\n' \"$1\" >&2; exit 1; }\n    if [ -e \"$1\" ]; then\n        [ -d \"$1\" ] || exit 1\n        return\n    fi\n    safe_dir \"$(dirname \"$1\")\"\n    mkdir -m 0755 \"$1\"\n)\n\ndestination() {\n    case \"$1\" in ''|/*|..|../*|*/../*|*/..) exit 1;; esac\n    path=\"$seed_root/$1\"\n    safe_dir \"$(dirname \"$path\")\"\n    # Check every existing parent, not just the final directory.\n    [ \"$(cd \"$(dirname \"$path\")\" && pwd -P)\" = \"$(dirname \"$path\")\" ] || exit 1\n}\n\nregular_destination() {\n    [ ! -L \"$path\" ] || exit 1\n    if [ -e \"$path\" ]; then [ -f \"$path\" ] || exit 1; fi\n}\n\nverify_regular() {\n    actual=$(sha256sum \"$path\")\n    [ \"${actual%% *}\" = \"$1\" ] || exit 1\n    [ \"$(stat -c '%a' \"$path\")\" = \"$2\" ] || exit 1\n    [ \"$(stat -c '%Y' \"$path\")\" = \"$3\" ] || exit 1\n}\n\nsafe_dir \"$seed_root\"\ndestination \"$(printf '\\154\\145\\144\\147\\145\\162\\056\\163\\161\\154')\"\nregular_destination\nstaging=$(mktemp \"$(dirname \"$path\")/.seed-XXXXXX\")\nbase64 -d > \"$staging\" <<'BASH_MATRIX_FILE'\nQ1JFQVRFIERBVEFCQVNFIGJyYW5jaF9sZWRnZXI7ClVTRSBicmFuY2hfbGVkZ2VyOwpDUkVBVEUgVEFCTEUgZW50cmllcyAoaWQgSU5URUdFUiBQUklNQVJZIEtFWSwgYW1vdW50IERFQ0lNQUwoMTIsMikgTk9UIE5VTEwpIEVOR0lORT1Jbm5vREI7CklOU0VSVCBJTlRPIGVudHJpZXMgVkFMVUVTICgxMDAxLDEyLjUwKSwoMTAwMiwtMy4yNSk7Cg==\nBASH_MATRIX_FILE\nchmod 644 \"$staging\"\ntouch -t 202311142213.20 \"$staging\"\nmv -f \"$staging\" \"$path\"\nstaging=\nverify_regular fcd54ac91dff5010c8dda0ddfa5cf2586d2d172456c7ca8ca33d0bffabc73700 644 1700000000\nprintf '%s\\n' 'Prepared and checked fixture contents, modes, timestamps and special files'\nBASH_MATRIX_SEED\n"

