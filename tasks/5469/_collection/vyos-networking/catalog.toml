[[tasks]]
number = 1
slug = "nat-egress"
difficulty = "medium"
topology = "single-lan"
appliances = 1
linux_nodes = 2
control_node = "node2"
instruction = """
`node2` and `node3` sit on a private network with no internet access of their
own. Configure `node1` to provide NAT so that processes on `node2` and
`node3` can reach the internet through it.
"""

[[tasks]]
number = 2
slug = "cross-lan-firewall"
difficulty = "medium"
topology = "dual-lan"
appliances = 1
linux_nodes = 2
control_node = "node2"
instruction = """
`node2` sits on `lan-a` and `node3` sits on `lan-b`; `node1` routes between
the two networks. Allow `node2` to reach `node3` on TCP port 5432, and
reject all other traffic between the two networks.
"""

[[tasks]]
number = 3
slug = "lan-to-lan-routing"
difficulty = "easy"
topology = "dual-lan"
appliances = 1
linux_nodes = 2
control_node = "node2"
instruction = """
`node2` sits on `lan-a` and `node3` sits on `lan-b`. Configure `node1` to
route between the two networks so `node2` and `node3` can reach each other
directly on any port, preserving their original source addresses.
"""

[[tasks]]
number = 4
slug = "wireguard-gateway"
difficulty = "medium"
topology = "gateway-client"
appliances = 1
linux_nodes = 2
control_node = "node2"
instruction = """
`node3` is outside the private network shared by `node1` and `node2`. Serve
an application from `node2` on TCP port 8080, and let `node3` reach it only
through a WireGuard tunnel terminated on `node1`.
"""

[[tasks]]
number = 5
slug = "dhcp-server"
difficulty = "easy"
topology = "single-lan"
appliances = 1
linux_nodes = 2
control_node = "node2"
instruction = """
Configure `node1` to run a DHCP server on the private network shared with
`node2` and `node3`, and configure `node2` and `node3` to obtain their
address on that network from `node1` rather than a static assignment.
"""

[[tasks]]
number = 6
slug = "port-forward"
difficulty = "medium"
topology = "gateway-client"
appliances = 1
linux_nodes = 2
control_node = "node2"
instruction = """
`node2` serves an application on TCP port 8080 on the private network it
shares with `node1`. `node3` is outside that network. Publish the application
through `node1` so `node3` can reach it on port 8080, without opening the rest
of the private network to `node3`.
"""

[[tasks]]
number = 7
slug = "dns-forwarding"
difficulty = "easy"
topology = "single-lan"
appliances = 1
linux_nodes = 2
control_node = "node2"
instruction = """
Make `node1` the DNS resolver for the private network it shares with `node2`
and `node3`. It should answer for `inventory.internal` with `node2`'s address
on that network and forward everything else upstream. Configure `node2` and
`node3` to resolve through it.
"""

[[tasks]]
number = 8
slug = "vlan-segmentation"
difficulty = "medium"
topology = "trunk"
appliances = 1
linux_nodes = 2
control_node = "node2"
instruction = """
`node1`, `node2`, and `node3` share a single link. Separate the two Linux
systems onto their own VLANs over that link, `node2` on VLAN 10 and `node3` on
VLAN 20, and route between the VLANs through `node1` so the two systems can
still reach each other.
"""

[[tasks]]
number = 9
slug = "vrrp-failover"
difficulty = "medium"
topology = "dual-router"
appliances = 2
linux_nodes = 2
control_node = "node3"
instruction = """
`node3` and `node4` sit on separate private networks joined only by the
routers `node1` and `node2`. Give `node3` a single gateway address for
reaching `node4` that stays available when either router is down, preferring
`node1` while it is healthy.
"""

[[tasks]]
number = 10
slug = "traffic-shaping"
difficulty = "medium"
topology = "dual-lan"
appliances = 1
linux_nodes = 2
control_node = "node2"
instruction = """
`node2` and `node3` sit on separate private networks and communicate through
`node1`. Limit traffic from `node2` toward `node3` to 1 Mbit/s, leaving
traffic in the other direction unrestricted.
"""
