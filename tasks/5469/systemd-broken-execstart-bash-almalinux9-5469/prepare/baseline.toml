timeout_sec = 120

[[observations]]
id = "prepared-failure-state"
stage = 10
node = "node1"
command = '''
set -eu
printf 'enabled=%s\n' "$(systemctl is-enabled telemetry-heartbeat.service)"
printf 'active=%s\n' "$(systemctl is-active telemetry-heartbeat.service || true)"
printf 'failed=%s\n' "$(systemctl is-failed telemetry-heartbeat.service || true)"
systemctl show telemetry-heartbeat.service -p Result -p ExecMainCode -p ExecMainStatus --value
test ! -e /run/telemetry-heartbeat/heartbeat
'''
required = true

[[observations]]
id = "broken-effective-execstart"
stage = 10
node = "node1"
command = "systemctl show telemetry-heartbeat.service -p ExecStart --value"
required = true

[[observations]]
id = "installed-program-hash"
stage = 10
node = "node1"
command = "sha256sum /usr/local/bin/telemetry-heartbeat"
required = true

[[observations]]
id = "service-identity"
stage = 10
node = "node1"
command = "id svc-heartbeat"
required = true

[[observations]]
id = "account-state"
stage = 10
node = "node1"
command = "getent passwd | sha256sum"
required = true

[[observations]]
id = "host-security-state"
stage = 10
node = "node1"
command = '''
getenforce
systemctl is-active firewalld.service || true
systemctl is-enabled firewalld.service || true
'''
required = true
