timeout_sec = 180

[[steps]]
id = "prepare-application-log"
stage = 10
node = "node1"
command = '''
set -eu
        install -d -o root -g root -m 0755 /var/log/inventory
        printf '%s
' 'inventory service started' 'inventory initial record count: 2' > /var/log/inventory/app.log
        chmod 0644 /var/log/inventory/app.log
'''
