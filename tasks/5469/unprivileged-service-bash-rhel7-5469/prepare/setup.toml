timeout_sec = 180

[[steps]]
id = "prepare-service-worker"
stage = 10
node = "node1"
command = '''
set -eu
cat <<'SCRIPT' | sudo -n tee /usr/local/bin/os-comparison-worker > /dev/null
#!/bin/sh
trap 'exit 0' TERM INT
while :; do sleep 30; done
SCRIPT
sudo -n chown root:root /usr/local/bin/os-comparison-worker
sudo -n chmod 0755 /usr/local/bin/os-comparison-worker
'''
