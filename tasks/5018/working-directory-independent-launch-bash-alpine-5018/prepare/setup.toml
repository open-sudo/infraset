[[steps]]
id = "seed-node1"
stage = 10
node = "node1"
command = "set -eu\nPATH=/usr/sbin:/usr/bin:/sbin:/bin\nexport PATH\nLC_ALL=C\nexport LC_ALL\nas_root() {\n  if [ \"$(id -u)\" -eq 0 ]; then\n    \"$@\"\n  else\n    sudo -n \"$@\"\n  fi\n}\nas_root sh -s <<'BASH_MATRIX_SEED'\n# POSIX sh; works with GNU coreutils and BusyBox. No guest Python dependency.\nset -eu\numask 022\nLC_ALL=C\nTZ=UTC0\nexport LC_ALL TZ\nseed_root=/srv/legacy2/working-directory-independent-launch\nstaging=\ntrap '[ -z \"$staging\" ] || rm -f \"$staging\"' 0\ntrap 'exit 1' 1 2 15\n\nsafe_dir() (\n    [ ! -L \"$1\" ] || { printf 'Symlink directory: %s\\n' \"$1\" >&2; exit 1; }\n    if [ -e \"$1\" ]; then\n        [ -d \"$1\" ] || exit 1\n        return\n    fi\n    safe_dir \"$(dirname \"$1\")\"\n    mkdir -m 0755 \"$1\"\n)\n\ndestination() {\n    case \"$1\" in ''|/*|..|../*|*/../*|*/..) exit 1;; esac\n    path=\"$seed_root/$1\"\n    safe_dir \"$(dirname \"$path\")\"\n    # Check every existing parent, not just the final directory.\n    [ \"$(cd \"$(dirname \"$path\")\" && pwd -P)\" = \"$(dirname \"$path\")\" ] || exit 1\n}\n\nregular_destination() {\n    [ ! -L \"$path\" ] || exit 1\n    if [ -e \"$path\" ]; then [ -f \"$path\" ] || exit 1; fi\n}\n\nverify_regular() {\n    actual=$(sha256sum \"$path\")\n    [ \"${actual%% *}\" = \"$1\" ] || exit 1\n    [ \"$(stat -c '%a' \"$path\")\" = \"$2\" ] || exit 1\n    [ \"$(stat -c '%Y' \"$path\")\" = \"$3\" ] || exit 1\n}\n\nsafe_dir \"$seed_root\"\ndestination \"$(printf '\\141\\160\\160\\056\\160\\171')\"\nregular_destination\nstaging=$(mktemp \"$(dirname \"$path\")/.seed-XXXXXX\")\nbase64 -d > \"$staging\" <<'BASH_MATRIX_FILE'\nIyEvdXNyL2Jpbi9weXRob24KaW1wb3J0IHN5cwpjb25maWcgPSBvcGVuKCdjb25maWcvcmVwb3J0LmNvbmYnKS5yZWFkKCkKc3lzLnN0ZG91dC53cml0ZShjb25maWcpCg==\nBASH_MATRIX_FILE\nchmod 755 \"$staging\"\ntouch -t 202311142213.20 \"$staging\"\nmv -f \"$staging\" \"$path\"\nstaging=\nverify_regular db4202f10ac12350cbbd70edb29071f3fffa8bbbeebd6bde8a54a8a08280fd1a 755 1700000000\ndestination \"$(printf '\\142\\151\\156\\057\\163\\164\\141\\162\\164\\055\\162\\145\\160\\157\\162\\164')\"\nregular_destination\nstaging=$(mktemp \"$(dirname \"$path\")/.seed-XXXXXX\")\nbase64 -d > \"$staging\" <<'BASH_MATRIX_FILE'\nIyEvYmluL3NoCnB5dGhvbiBhcHAucHkKZXhpdCAwCg==\nBASH_MATRIX_FILE\nchmod 755 \"$staging\"\ntouch -t 202311142213.20 \"$staging\"\nmv -f \"$staging\" \"$path\"\nstaging=\nverify_regular 99f677aeb9df39513fe9d10b8d74c31e1948bf4ee868a13e90ca405d7b14b508 755 1700000000\ndestination \"$(printf '\\143\\157\\156\\146\\151\\147\\057\\162\\145\\160\\157\\162\\164\\056\\143\\157\\156\\146')\"\nregular_destination\nstaging=$(mktemp \"$(dirname \"$path\")/.seed-XXXXXX\")\nbase64 -d > \"$staging\" <<'BASH_MATRIX_FILE'\ncmVnaW9uPXdlc3QKcmVwb3J0PXdlZWtseQo=\nBASH_MATRIX_FILE\nchmod 644 \"$staging\"\ntouch -t 202311142213.20 \"$staging\"\nmv -f \"$staging\" \"$path\"\nstaging=\nverify_regular a565fc057ad8bf80480acc3ec5065a040f5518b36e6d51853ed778b1eb47cd3f 644 1700000000\ndestination \"$(printf '\\157\\164\\150\\145\\162\\055\\144\\151\\162\\145\\143\\164\\157\\162\\171\\057\\143\\157\\156\\146\\151\\147\\057\\162\\145\\160\\157\\162\\164\\056\\143\\157\\156\\146')\"\nregular_destination\nstaging=$(mktemp \"$(dirname \"$path\")/.seed-XXXXXX\")\nbase64 -d > \"$staging\" <<'BASH_MATRIX_FILE'\ncmVnaW9uPXdyb25nLWNhbGxlci1kaXJlY3RvcnkK\nBASH_MATRIX_FILE\nchmod 644 \"$staging\"\ntouch -t 202311142213.20 \"$staging\"\nmv -f \"$staging\" \"$path\"\nstaging=\nverify_regular da8378335ce4e124b9296bd54c6771f9b46bf85c126a57cfadc3dc2b8f2c1520 644 1700000000\nprintf '%s\\n' 'Prepared and checked fixture contents, modes, timestamps and special files'\nBASH_MATRIX_SEED\n"
