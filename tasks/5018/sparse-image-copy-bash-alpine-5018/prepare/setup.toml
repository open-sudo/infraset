timeout_sec = 180

[[steps]]
id = "seed-node1"
stage = 10
node = "node1"
command = "set -eu\nPATH=/usr/sbin:/usr/bin:/sbin:/bin\nexport PATH\nLC_ALL=C\nexport LC_ALL\nas_root() {\n  if [ \"$(id -u)\" -eq 0 ]; then\n    \"$@\"\n  else\n    sudo -n \"$@\"\n  fi\n}\nas_root sh -s <<'BASH_MATRIX_SEED'\n# POSIX sh; works with GNU coreutils and BusyBox. No guest Python dependency.\nset -eu\numask 022\nLC_ALL=C\nTZ=UTC0\nexport LC_ALL TZ\nseed_root=/srv/legacy2/sparse-image-copy\nstaging=\ntrap '[ -z \"$staging\" ] || rm -f \"$staging\"' 0\ntrap 'exit 1' 1 2 15\n\nsafe_dir() (\n    [ ! -L \"$1\" ] || { printf 'Symlink directory: %s\\n' \"$1\" >&2; exit 1; }\n    if [ -e \"$1\" ]; then\n        [ -d \"$1\" ] || exit 1\n        return\n    fi\n    safe_dir \"$(dirname \"$1\")\"\n    mkdir -m 0755 \"$1\"\n)\n\ndestination() {\n    case \"$1\" in ''|/*|..|../*|*/../*|*/..) exit 1;; esac\n    path=\"$seed_root/$1\"\n    safe_dir \"$(dirname \"$path\")\"\n    # Check every existing parent, not just the final directory.\n    [ \"$(cd \"$(dirname \"$path\")\" && pwd -P)\" = \"$(dirname \"$path\")\" ] || exit 1\n}\n\nregular_destination() {\n    [ ! -L \"$path\" ] || exit 1\n    if [ -e \"$path\" ]; then [ -f \"$path\" ] || exit 1; fi\n}\n\nverify_regular() {\n    actual=$(sha256sum \"$path\")\n    [ \"${actual%% *}\" = \"$1\" ] || exit 1\n    [ \"$(stat -c '%a' \"$path\")\" = \"$2\" ] || exit 1\n    [ \"$(stat -c '%Y' \"$path\")\" = \"$3\" ] || exit 1\n}\n\nsafe_dir \"$seed_root\"\ndestination \"$(printf '\\142\\151\\156\\057\\143\\157\\160\\171\\055\\151\\155\\141\\147\\145')\"\nregular_destination\nstaging=$(mktemp \"$(dirname \"$path\")/.seed-XXXXXX\")\nbase64 -d > \"$staging\" <<'BASH_MATRIX_FILE'\nIyEvYmluL3NoCnNldCAtZXUKY2F0ICIkMSIgPiAiJDIiCg==\nBASH_MATRIX_FILE\nchmod 755 \"$staging\"\ntouch -t 202311142213.20 \"$staging\"\nmv -f \"$staging\" \"$path\"\nstaging=\nverify_regular f18c2571d8d7b3143fde3be15d6861b63bfb9b634f1a2b3a101a8e8ff1d4d94e 755 1700000000\ndestination \"$(printf '\\151\\155\\141\\147\\145\\055\\154\\141\\171\\157\\165\\164\\056\\164\\170\\164')\"\nregular_destination\nstaging=$(mktemp \"$(dirname \"$path\")/.seed-XXXXXX\")\nbase64 -d > \"$staging\" <<'BASH_MATRIX_FILE'\nTG9naWNhbCBsZW5ndGg6IDY3MTA4ODY0IGJ5dGVzLiBQYXlsb2FkIGF0IHRoZSBiZWdpbm5pbmcgYW5kIGVuZDsgaG9sZXMgYmV0d2Vlbi4K\nBASH_MATRIX_FILE\nchmod 644 \"$staging\"\ntouch -t 202311142213.20 \"$staging\"\nmv -f \"$staging\" \"$path\"\nstaging=\nverify_regular 37030f3da05df38658378b47126510ed9e53ee8dd322dfb874a83b89a6adf76e 644 1700000000\ndestination \"$(printf '\\163\\157\\165\\162\\143\\145\\056\\151\\155\\147')\"\nregular_destination\nstaging=$(mktemp \"$(dirname \"$path\")/.seed-XXXXXX\")\nprintf 'BRANCH-IMAGE\\n' > \"$staging\"\nprintf 'END\\n' | dd of=\"$staging\" bs=1 seek=67108860 conv=notrunc 2>/dev/null\nchmod 0644 \"$staging\"\ntouch -t 202311142213.20 \"$staging\"\nmv -f \"$staging\" \"$path\"\nstaging=\n[ \"$(stat -c %s \"$path\")\" = 67108864 ] || exit 1\n[ \"$(stat -c %b \"$path\")\" -lt 4096 ] || exit 1\nprintf '%s\\n' 'Prepared and checked fixture contents, modes, timestamps and special files'\nBASH_MATRIX_SEED\n"
