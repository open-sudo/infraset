[[steps]]
id = "seed-node1"
stage = 10
node = "node1"
command = "set -eu\nPATH=/usr/sbin:/usr/bin:/sbin:/bin\nexport PATH\nLC_ALL=C\nexport LC_ALL\nas_root() {\n  if [ \"$(id -u)\" -eq 0 ]; then\n    \"$@\"\n  else\n    sudo -n \"$@\"\n  fi\n}\nas_root sh -s <<'BASH_MATRIX_SEED'\n# POSIX sh; works with GNU coreutils and BusyBox. No guest Python dependency.\nset -eu\numask 022\nLC_ALL=C\nTZ=UTC0\nexport LC_ALL TZ\nseed_root=/srv/legacy2/selective-tape-restore\nstaging=\ntrap '[ -z \"$staging\" ] || rm -f \"$staging\"' 0\ntrap 'exit 1' 1 2 15\n\nsafe_dir() (\n    [ ! -L \"$1\" ] || { printf 'Symlink directory: %s\\n' \"$1\" >&2; exit 1; }\n    if [ -e \"$1\" ]; then\n        [ -d \"$1\" ] || exit 1\n        return\n    fi\n    safe_dir \"$(dirname \"$1\")\"\n    mkdir -m 0755 \"$1\"\n)\n\ndestination() {\n    case \"$1\" in ''|/*|..|../*|*/../*|*/..) exit 1;; esac\n    path=\"$seed_root/$1\"\n    safe_dir \"$(dirname \"$path\")\"\n    # Check every existing parent, not just the final directory.\n    [ \"$(cd \"$(dirname \"$path\")\" && pwd -P)\" = \"$(dirname \"$path\")\" ] || exit 1\n}\n\nregular_destination() {\n    [ ! -L \"$path\" ] || exit 1\n    if [ -e \"$path\" ]; then [ -f \"$path\" ] || exit 1; fi\n}\n\nverify_regular() {\n    actual=$(sha256sum \"$path\")\n    [ \"${actual%% *}\" = \"$1\" ] || exit 1\n    [ \"$(stat -c '%a' \"$path\")\" = \"$2\" ] || exit 1\n    [ \"$(stat -c '%Y' \"$path\")\" = \"$3\" ] || exit 1\n}\n\nsafe_dir \"$seed_root\"\ndestination \"$(printf '\\154\\151\\166\\145\\057\\143\\165\\163\\164\\157\\155\\145\\162\\163\\056\\143\\163\\166')\"\nregular_destination\nstaging=$(mktemp \"$(dirname \"$path\")/.seed-XXXXXX\")\nbase64 -d > \"$staging\" <<'BASH_MATRIX_FILE'\naWQsbmFtZQpDMTAwLE5vcnRoIEJyYW5jaCBMdGQKQzEwMSxOZXcgQ3VzdG9tZXIgTHRkCg==\nBASH_MATRIX_FILE\nchmod 644 \"$staging\"\ntouch -t 202311142213.20 \"$staging\"\nmv -f \"$staging\" \"$path\"\nstaging=\nverify_regular 0f060a93ce03b8a38e00181862fc775d127160011235f60f4d040afd98e84d51 644 1700000000\ndestination \"$(printf '\\162\\145\\163\\164\\157\\162\\145\\055\\162\\145\\161\\165\\145\\163\\164\\056\\164\\170\\164')\"\nregular_destination\nstaging=$(mktemp \"$(dirname \"$path\")/.seed-XXXXXX\")\nbase64 -d > \"$staging\" <<'BASH_MATRIX_FILE'\naW52b2ljZXMvSU5WLTEwMC50eHQKaW52b2ljZXMvSU5WLTEwMS50eHQK\nBASH_MATRIX_FILE\nchmod 644 \"$staging\"\ntouch -t 202311142213.20 \"$staging\"\nmv -f \"$staging\" \"$path\"\nstaging=\nverify_regular d734125d5736345805623b69a71c9f0030c2bb2c445d46d7bf0ef04cc7217f1a 644 1700000000\ndestination \"$(printf '\\164\\141\\160\\145\\163\\057\\146\\162\\151\\144\\141\\171\\056\\164\\141\\162')\"\nregular_destination\nstaging=$(mktemp \"$(dirname \"$path\")/.seed-XXXXXX\")\nbase64 -d > \"$staging\" <<'BASH_MATRIX_FILE'\\nBASH_MATRIX_FILE\nchmod 644 \"$staging\"\ntouch -t 202311142213.20 \"$staging\"\nmv -f \"$staging\" \"$path\"\nstaging=\nverify_regular 4fd7c4b8eced97b1ab345c87554f159f375a241867b233cff8e83c815a938fe4 644 1700000000\nprintf '%s\\n' 'Prepared and checked fixture contents, modes, timestamps and special files'\nBASH_MATRIX_SEED\n"
