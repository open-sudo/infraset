[[tasks]]
number = 1
slug = "static-lease-reservation"
difficulty = "easy"
topology = "single-lan"
appliances = 1
linux_nodes = 2
control_node = "node2"
instruction = """
`node1` is the router for the private network shared by `node2` and `node3`.
Have `node1` hand out addresses on that network, and make sure `node2`
always receives the same address across repeated leases while `node3` is
addressed from the general pool.
"""

[[tasks]]
number = 2
slug = "dns-hostname-override"
difficulty = "easy"
topology = "single-lan"
appliances = 1
linux_nodes = 2
control_node = "node2"
instruction = """
`node2` runs an HTTP service on TCP port 8080, reachable over the private
network shared with `node1` and `node3`. Make `node1` answer DNS for that
network so `node3` can reach the service by the name `app.internal` without
any local hosts-file entry.
"""

[[tasks]]
number = 3
slug = "inbound-service-publish"
difficulty = "medium"
topology = "gateway-client"
appliances = 1
linux_nodes = 2
control_node = "node2"
instruction = """
`node2` runs an HTTP service on TCP port 8080 on the private network it
shares with `node1`. `node3` is not on that network. Publish the service
through `node1` so that `node3` can reach it on TCP port 80 of `node1`'s
management address, with the service itself staying on the private network.
"""

[[tasks]]
number = 4
slug = "interzone-port-policy"
difficulty = "medium"
topology = "dual-lan"
appliances = 1
linux_nodes = 2
control_node = "node2"
instruction = """
`node2` sits on `lan-a` and `node3` sits on `lan-b`, with `node1` routing
between them. Permit `node2` to reach `node3` on TCP port 5432 and refuse
every other connection between the two networks, in both directions.
"""

[[tasks]]
number = 5
slug = "guest-network-isolation"
difficulty = "medium"
topology = "dual-lan"
appliances = 1
linux_nodes = 2
control_node = "node2"
instruction = """
`lan-a` carries trusted hosts and `lan-b` is for guests; `node2` is on the
first and `node3` on the second, with `node1` between them. Guests must be
able to reach services `node1` itself offers them, such as DNS, but no host
on `lan-b` may open a connection to any host on `lan-a`. Trusted hosts keep
full access in the other direction.
"""

[[tasks]]
number = 6
slug = "tagged-vlan-bridge"
difficulty = "hard"
topology = "trunk"
appliances = 1
linux_nodes = 2
control_node = "node2"
instruction = """
`node1`, `node2` and `node3` share one physical link. Carry two tagged
VLANs, 10 and 20, over that link: place `node2` in VLAN 10 and `node3` in
VLAN 20, each in its own subnet with `node1` as its router. Keep the two
VLANs isolated, so each host reaches `node1` on its own VLAN while traffic
between `node2` and `node3` is refused.
"""

[[tasks]]
number = 7
slug = "bandwidth-limit"
difficulty = "hard"
topology = "gateway-client"
appliances = 1
linux_nodes = 2
control_node = "node2"
instruction = """
`node2` shares a private network with `node1` and moves large transfers
through it. Limit the throughput `node2` obtains through `node1` to roughly
1 Mbit/s in each direction, and demonstrate the limit with a measured
transfer. Traffic from `node1` itself stays unshaped.
"""

[[tasks]]
number = 8
slug = "reboot-persistent-config"
difficulty = "medium"
topology = "single-lan"
appliances = 1
linux_nodes = 2
control_node = "node2"
instruction = """
`node1` routes the private network shared with `node2` and `node3`. Give
`node1` a fixed address of its own on that network, a DHCP service for the
other two, and a rule refusing TCP port 23 from that network, then show that
every one of those settings is still in place and serving traffic after
`node1` has been restarted.
"""

[[tasks]]
number = 9
slug = "site-to-site-tunnel"
difficulty = "hard"
topology = "dual-site"
appliances = 2
linux_nodes = 2
control_node = "node3"
instruction = """
`node3` sits behind `node1` on `lan-a` and `node4` sits behind `node2` on
`lan-b`. The two routers share a transit network but the two private
networks have no route between them. Build an encrypted tunnel between
`node1` and `node2` over the transit network and route the private networks
across it, so `node3` and `node4` reach each other by their private
addresses and that traffic is encrypted in transit.
"""

[[tasks]]
number = 10
slug = "gateway-failover"
difficulty = "hard"
topology = "redundant-gateway"
appliances = 2
linux_nodes = 1
control_node = "node3"
instruction = """
`node1` and `node2` both sit on the private network with `node3`. Give the
pair a single shared address on that network that one of them answers at a
time, with the other taking it over automatically when the first stops
serving. Demonstrate that `node3` keeps reaching the shared address across
one such transition.
"""
