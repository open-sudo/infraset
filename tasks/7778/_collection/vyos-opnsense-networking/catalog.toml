[[tasks]]
number = 1
slug = "transit-firewall-pair"
difficulty = "medium"
agent_timeout_sec = 2400
verifier_timeout_sec = 1500
topology = "dual-site"
appliances = 2
linux_nodes = 2
control_node = "node3"
instruction = """
`node3` sits behind `node1` on `lan-a`, `node4` sits behind `node2` on
`lan-b`, and the two routers face each other across a transit network. Both
routers refuse forwarded traffic by default. Open a path for `node3` to
reach an HTTP service `node4` serves on TCP port 8080, leaving other traffic
between the two networks refused.
"""

[[tasks]]
number = 2
slug = "published-service-two-hops"
difficulty = "medium"
agent_timeout_sec = 2400
verifier_timeout_sec = 1500
topology = "dual-site"
appliances = 2
linux_nodes = 2
control_node = "node3"
instruction = """
`node4` runs an HTTP service on TCP port 8080 on `lan-b` behind `node2`.
Publish it on TCP port 80 of `node2`'s transit address, and give `node1` a
route to that address, so `node3` on `lan-a` reaches the service by asking
`node2` rather than by addressing `node4` itself.
"""

[[tasks]]
number = 3
slug = "double-nat-path"
difficulty = "hard"
agent_timeout_sec = 2400
verifier_timeout_sec = 1500
topology = "dual-site"
appliances = 2
linux_nodes = 2
control_node = "node3"
instruction = """
`node3` on `lan-a` opens connections to an HTTP service `node4` serves on
TCP port 8080 on `lan-b`. Translate the source address twice along the way,
once on `node1` as traffic enters the transit network and once on `node2` as
it enters `lan-b`, so `node4` records the connection as arriving from
`node2` rather than from `node3` or from `node1`.
"""

[[tasks]]
number = 4
slug = "ipsec-vendor-interop"
difficulty = "hard"
agent_timeout_sec = 2400
verifier_timeout_sec = 1500
topology = "dual-site"
appliances = 2
linux_nodes = 2
control_node = "node3"
instruction = """
`node3` sits on `lan-a` behind `node1` and `node4` sits on `lan-b` behind
`node2`, with the two routers reachable to each other only across the
transit network. Establish an IPsec tunnel between `node1` and `node2` and
carry both private networks over it, so `node3` and `node4` reach each other
by their private addresses with that traffic encrypted in transit.
"""

[[tasks]]
number = 5
slug = "wireguard-vendor-interop"
difficulty = "hard"
agent_timeout_sec = 2400
verifier_timeout_sec = 1500
topology = "dual-site"
appliances = 2
linux_nodes = 2
control_node = "node3"
instruction = """
`node1` and `node2` face each other across the transit network, each serving
a private network with one host on it, `node3` and `node4`. Join the two
private networks with a WireGuard tunnel between the routers, so the hosts
reach each other by their private addresses and the traffic between the
routers travels inside the tunnel.
"""

[[tasks]]
number = 6
slug = "split-dns-authority"
difficulty = "medium"
agent_timeout_sec = 2400
verifier_timeout_sec = 1500
topology = "dual-site"
appliances = 2
linux_nodes = 2
control_node = "node3"
instruction = """
Each router answers DNS for the private network it serves. Have `node1`
resolve the name `app.internal` to `node3`'s address for hosts on `lan-a`,
and `node2` resolve the same name to `node4`'s address for hosts on `lan-b`,
so each host reaches the service on its own side of the transit network by
that one name.
"""

[[tasks]]
number = 7
slug = "dhcp-per-segment-gateway"
difficulty = "medium"
agent_timeout_sec = 2400
verifier_timeout_sec = 1500
topology = "dual-site"
appliances = 2
linux_nodes = 2
control_node = "node3"
instruction = """
`node1` serves addresses on `lan-a` and `node2` serves addresses on `lan-b`.
Have each router hand its own host an address from its own pool along with
itself as that host's default route, so `node3` and `node4` each obtain
their addressing from the router in front of them rather than from static
configuration.
"""

[[tasks]]
number = 8
slug = "firewall-log-correlation"
difficulty = "medium"
agent_timeout_sec = 2400
verifier_timeout_sec = 1500
topology = "dual-site"
appliances = 2
linux_nodes = 2
control_node = "node3"
instruction = """
Traffic from `node3` to `node4` on TCP port 23 crosses `node1` first and
`node2` second. Have `node1` permit that traffic and record it, and `node2`
refuse it and record the refusal, then show the pair of log entries produced
by one attempt from `node3` so the point where the traffic stopped is
evident from the records alone.
"""

[[tasks]]
number = 9
slug = "redundant-path-failover"
difficulty = "hard"
agent_timeout_sec = 2400
verifier_timeout_sec = 1500
topology = "dual-path"
appliances = 2
linux_nodes = 2
control_node = "node3"
instruction = """
`node1` and `node2` are joined by two independent transit networks, and each
serves a private network with one host on it, `node3` and `node4`. Carry
traffic between the two private networks so the hosts keep reaching each
other when either transit network is taken out of service, and show that
continuing across one such transition.
"""

[[tasks]]
number = 10
slug = "policy-based-egress"
difficulty = "hard"
agent_timeout_sec = 2400
verifier_timeout_sec = 1500
topology = "dual-path"
appliances = 2
linux_nodes = 2
control_node = "node3"
instruction = """
`node1` and `node2` are joined by two independent transit networks. Steer
traffic that `node3` sends to `node4` on TCP port 8080 across the first
transit network, and traffic it sends on TCP port 9090 across the second,
with both reaching `node4`. Show which transit network carried each flow.
"""
