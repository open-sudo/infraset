[[tasks]]
number = 1
slug = "mariadb-galera-cluster"
difficulty = "medium"
nodes = 3
instruction = """
Configure `node1`, `node2`, and `node3` as a three-member MariaDB Galera
cluster. Writes through any member should be available from the other members.

Keep the database available when one member is unavailable, and resynchronize
that member automatically when it returns.
"""

[[tasks]]
number = 2
slug = "mariadb-galera-cold-restart"
difficulty = "hard"
nodes = 3
instruction = """
Run a three-member MariaDB Galera cluster across `node1`, `node2`, and `node3`
holding application data.

The cluster has to come down completely for a maintenance window. Bring it
back afterwards with every committed write still present and all three members
serving again.
"""

[[tasks]]
number = 3
slug = "mariadb-galera-scale-out"
difficulty = "medium"
nodes = 4
instruction = """
Run a three-member MariaDB Galera cluster on `node1`, `node2`, and `node3`
holding application data.

Capacity is growing, so add `node4` as a fourth member. It should carry the
data that already exists and accept writes like the other members.
"""

[[tasks]]
number = 4
slug = "postgresql-streaming-replication"
difficulty = "medium"
nodes = 3
instruction = """
Configure PostgreSQL streaming replication across `node1`, `node2`, and
`node3`, using `node1` as the writable primary and the other two systems as
read-only standbys.

Changes committed on the primary should be visible on both standbys.
"""

[[tasks]]
number = 5
slug = "postgresql-failover"
difficulty = "hard"
nodes = 3
instruction = """
Run PostgreSQL streaming replication across `node1`, `node2`, and `node3` with
`node1` as the writable primary and the other two systems as standbys.

When the primary is lost, a standby has to take over as the writable primary
without losing committed data, and the recovered former primary has to come
back as a standby of whichever system is primary at that point.
"""

[[tasks]]
number = 6
slug = "postgresql-replication-tls"
difficulty = "medium"
nodes = 3
instruction = """
Configure PostgreSQL streaming replication across `node1`, `node2`, and
`node3` with `node1` as the writable primary.

Carry replication traffic over TLS using a certificate authority you create for
this cluster, and accept replication connections only from peers presenting a
certificate issued by that authority.
"""

[[tasks]]
number = 7
slug = "rabbitmq-cluster"
difficulty = "medium"
nodes = 3
instruction = """
Join `node1`, `node2`, and `node3` into a single RabbitMQ cluster with a
`payments` virtual host and an application account that can publish and consume
there.

Messages published to a durable queue must survive the loss of any one node and
stay consumable from the remaining nodes.
"""

[[tasks]]
number = 8
slug = "rabbitmq-tls"
difficulty = "medium"
nodes = 3
instruction = """
Run a RabbitMQ cluster across `node1`, `node2`, and `node3` that serves AMQP
over TLS, using a certificate authority you create for this cluster.

Accept only client connections presenting a certificate issued by that
authority, and keep the management interface reachable only from within the
cluster.
"""

[[tasks]]
number = 9
slug = "etcd-cluster"
difficulty = "medium"
nodes = 3
instruction = """
Build a three-member etcd cluster across `node1`, `node2`, and `node3`. A key
written through any member must be readable from the others.

The cluster should keep serving reads and writes while one member is
unavailable, and bring that member back up to date when it returns.
"""

[[tasks]]
number = 10
slug = "etcd-member-replacement"
difficulty = "hard"
nodes = 3
instruction = """
Run a three-member etcd cluster across `node1`, `node2`, and `node3` holding
application keys.

The member on `node3` is permanently lost and its data cannot be recovered.
Replace it with a working member on that same system so the cluster is back to
three healthy members with the existing keys intact.
"""
