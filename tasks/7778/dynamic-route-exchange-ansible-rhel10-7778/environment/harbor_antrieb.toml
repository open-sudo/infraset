cluster = ["sonic x2", "rhel10.0 x2", "ansible-controller"]
initialize = ["rhsm:30s"]
base_runbooks = [
  "antrieb/primer",
  "antrieb/networking-primer",
  "antrieb/sonic-reference",
]
control_node = "node5"
endpoint = "https://antrieb.sh/mcp"

[[networks]]
name = "mgmt"
dhcp = true
egress = true

[[networks]]
name = "transit"
dhcp = false
egress = false

[[networks]]
name = "lan-a"
dhcp = false
egress = false

[[networks]]
name = "lan-b"
dhcp = false
egress = false

[nics]
node1 = [{ net = "mgmt" }, { net = "transit" }, { net = "lan-a" }]
node2 = [{ net = "mgmt" }, { net = "transit" }, { net = "lan-b" }]
node3 = [{ net = "mgmt" }, { net = "lan-a" }]
node4 = [{ net = "mgmt" }, { net = "lan-b" }]
node5 = [{ net = "mgmt" }]
