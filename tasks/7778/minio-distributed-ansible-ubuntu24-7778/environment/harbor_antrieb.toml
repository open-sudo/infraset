cluster = ["ubuntu24.04 x4", "ansible-controller"]
max_clusters = 3
base_runbooks = ["antrieb/primer", "antrieb/networking-primer"]
control_node = "node5"
endpoint = "https://antrieb.sh/mcp"

[[networks]]
name = "storage"
dhcp = true
egress = true

[nics]
node1 = [{ net = "storage" }]
node2 = [{ net = "storage" }]
node3 = [{ net = "storage" }]
node4 = [{ net = "storage" }]
node5 = [{ net = "storage" }]
