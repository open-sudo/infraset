cluster = ["ubuntu24.04 x3", "ansible-controller"]
base_runbooks = ["antrieb/primer", "antrieb/networking-primer"]
control_node = "node4"
endpoint = "https://antrieb.sh/mcp"

[[networks]]
name = "storage"
dhcp = true
egress = true

[nics]
node1 = [{ net = "storage" }]
node2 = [{ net = "storage" }]
node3 = [{ net = "storage" }]
node4 = [{ net = "storage" }]
