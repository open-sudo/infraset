schema_version = 1
usecase = "site-to-site-tunnel"
title = "Site to site tunnel"
description = "node3 sits behind node1 on lan-a and node4 sits behind node2 on lan-b. The two routers share a transit network but the two private networks have no route between them. Build an encrypted tunnel between node1 and node2 over the transit network and route the private networks across it, so node3 and node4 reach each other by their private addresses and that traffic is encrypted in transit."
category = "openwrt-networking"
tags = ["openwrt-networking"]
language = "ansible"
os = "alpine"
difficulty = "hard"
id = "7778"

[prompt]
path = "instruction.md"
sha256 = "0854c436ff1748d225332aa2f35427255c20c3db76e73c9589c6a61c3f9ba63e"

[environment]
images = ["openwrt", "alpine", "ansible-controller"]
node_count = 5
initial_state = "greenfield"
