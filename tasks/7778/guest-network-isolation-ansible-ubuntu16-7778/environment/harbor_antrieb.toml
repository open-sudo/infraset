cluster = ["openwrt", "ubuntu16.04 x2", "ansible-controller"]
base_runbooks = [
  "antrieb/primer",
  "antrieb/networking-primer",
  "antrieb/openwrt-reference",
]
control_node = "node4"
endpoint = "https://antrieb.sh/mcp"

[[networks]]
name = "mgmt"
dhcp = true
egress = true

[[networks]]
name = "lan-a"
dhcp = false
egress = false

[[networks]]
name = "lan-b"
dhcp = false
egress = false

[nics]
node1 = [{ net = "mgmt" }, { net = "lan-a" }, { net = "lan-b" }]
node2 = [{ net = "mgmt" }, { net = "lan-a" }]
node3 = [{ net = "mgmt" }, { net = "lan-b" }]
node4 = [{ net = "mgmt" }]
