cluster = ["sonic", "rhel7.9 x2", "ansible-controller"]
initialize = ["rhsm:30s"]
base_runbooks = [
  "antrieb/primer",
  "antrieb/networking-primer",
  "antrieb/sonic-reference",
]
control_node = "node4"
endpoint = "https://antrieb.sh/mcp"

[[networks]]
name = "mgmt"
dhcp = true
egress = true

[[networks]]
name = "seg"
dhcp = false
egress = false

[nics]
node1 = [{ net = "mgmt" }, { net = "seg" }]
node2 = [{ net = "mgmt" }, { net = "seg" }]
node3 = [{ net = "mgmt" }, { net = "seg" }]
node4 = [{ net = "mgmt" }]
