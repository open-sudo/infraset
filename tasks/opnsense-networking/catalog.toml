[[tasks]]
number = 1
slug = "default-deny-baseline"
difficulty = "medium"
topology = "dual-lan"
appliances = 1
linux_nodes = 2
control_node = "node2"
instruction = """
`node2` sits on `lan-a` and `node3` on `lan-b`, with `node1` between them
refusing forwarded traffic by default. Open exactly one path through it: let
`node2` reach `node3` on TCP port 8080, leaving every other flow between the
two networks refused as it already is.
"""

[[tasks]]
number = 2
slug = "alias-based-policy"
difficulty = "medium"
topology = "dual-lan"
appliances = 1
linux_nodes = 2
control_node = "node2"
instruction = """
`node1` routes between `lan-a` and `lan-b`. Permit `node2` to reach `node3`
on TCP ports 8080, 8443 and 9000, expressing that set of ports as a single
named object on `node1` and referring to the object from the rule instead of
writing one rule for each port.
"""

[[tasks]]
number = 3
slug = "restricted-service-publish"
difficulty = "medium"
topology = "gateway-client"
appliances = 1
linux_nodes = 2
control_node = "node2"
instruction = """
`node2` runs an HTTP service on TCP port 8080 on the private network it
shares with `node1`. Publish it on TCP port 80 of `node1`'s management
address so that `node3` reaches it there, while the same published port
stays refused for every other source address.
"""

[[tasks]]
number = 4
slug = "hairpin-nat-reflection"
difficulty = "hard"
topology = "single-lan"
appliances = 1
linux_nodes = 2
control_node = "node2"
instruction = """
`node2` runs an HTTP service on TCP port 8080 on the private network shared
with `node1` and `node3`. Publish that service on TCP port 80 of `node1`'s
outward-facing address, and arrange for `node3`, which sits on the same
private network as the service, to reach it through that outward-facing
address rather than by contacting `node2` directly.
"""

[[tasks]]
number = 5
slug = "outbound-nat-mapping"
difficulty = "hard"
topology = "dual-lan"
appliances = 1
linux_nodes = 2
control_node = "node2"
instruction = """
`node1` routes between `lan-a` and `lan-b`. When `node2` on `lan-a` opens a
connection to `node3` on `lan-b`, have `node3` observe it as arriving from
an address of your choosing on `node1` rather than from `node2`'s own
address, while connections in the other direction keep their original
source.
"""

[[tasks]]
number = 6
slug = "dns-domain-blocking"
difficulty = "medium"
topology = "single-lan"
appliances = 1
linux_nodes = 2
control_node = "node2"
instruction = """
`node1` provides name resolution for the private network it shares with
`node2` and `node3`. Resolve names normally for both hosts, with the single
exception of the domain `blocked.example` and everything under it, which
resolves to nothing usable from either host.
"""

[[tasks]]
number = 7
slug = "logged-block-policy"
difficulty = "medium"
topology = "dual-lan"
appliances = 1
linux_nodes = 2
control_node = "node2"
instruction = """
`node1` routes between `lan-a` and `lan-b`. Refuse TCP port 23 between the
two networks and record every refused attempt in a log on `node1`, then show
a log entry produced by an attempt made from `node2`.
"""

[[tasks]]
number = 8
slug = "additional-zone-interface"
difficulty = "medium"
topology = "dual-lan"
appliances = 1
linux_nodes = 2
control_node = "node2"
instruction = """
`node1` has an interface facing `lan-b` that carries no configuration yet,
and `node3` sits on that network. Bring the interface into service as its
own zone with an address on `lan-b`, so `node3` reaches `node1` there and
reaches `node2` on `lan-a` through it.
"""

[[tasks]]
number = 9
slug = "haproxy-service-frontend"
difficulty = "hard"
topology = "frontend-backends"
appliances = 1
linux_nodes = 3
control_node = "node2"
instruction = """
`node2` and `node3` each serve HTTP on TCP port 8080 on the private network
they share with `node1`, and each returns content identifying which host
answered. Have `node1` present one entry point on TCP port 80 of its
management address that spreads requests across both hosts, and show `node4`
receiving answers from each of them through that entry point.
"""

[[tasks]]
number = 10
slug = "ipsec-site-tunnel"
difficulty = "hard"
topology = "dual-site"
appliances = 2
linux_nodes = 2
control_node = "node3"
instruction = """
`node3` sits behind `node1` on `lan-a` and `node4` sits behind `node2` on
`lan-b`. The two firewalls share a transit network, while the private
networks have no path between them. Build an IPsec tunnel between `node1`
and `node2` and carry the private networks over it, so `node3` and `node4`
reach each other by their private addresses with that traffic encrypted in
transit.
"""
