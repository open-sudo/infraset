[[tasks]]
number = 1
slug = "nat-egress"
difficulty = "medium"
topology = "single-lan"
control_node = "node2"
instruction = """
`node2` and `node3` sit on a private network with no internet access of their
own. Configure `node1` to provide NAT so that processes on `node2` and
`node3` can reach the internet through it.
"""

[[tasks]]
number = 2
slug = "cross-lan-firewall"
difficulty = "medium"
topology = "dual-lan"
control_node = "node2"
instruction = """
`node2` sits on `lan-a` and `node3` sits on `lan-b`; `node1` routes between
the two networks. Allow `node2` to reach `node3` on TCP port 5432, and
reject all other traffic between the two networks.
"""

[[tasks]]
number = 3
slug = "lan-to-lan-routing"
difficulty = "easy"
topology = "dual-lan"
control_node = "node2"
instruction = """
`node2` sits on `lan-a` and `node3` sits on `lan-b`. Configure `node1` to
route between the two networks so `node2` and `node3` can reach each other
directly on any port, preserving their original source addresses.
"""

[[tasks]]
number = 4
slug = "wireguard-gateway"
difficulty = "medium"
topology = "gateway-client"
control_node = "node2"
instruction = """
`node3` is outside the private network shared by `node1` and `node2`. Serve
an application from `node2` on TCP port 8080, and let `node3` reach it only
through a WireGuard tunnel terminated on `node1`.
"""

[[tasks]]
number = 5
slug = "dhcp-server"
difficulty = "easy"
topology = "single-lan"
control_node = "node2"
instruction = """
Configure `node1` to run a DHCP server on the private network shared with
`node2` and `node3`, and configure `node2` and `node3` to obtain their
address on that network from `node1` rather than a static assignment.
"""
