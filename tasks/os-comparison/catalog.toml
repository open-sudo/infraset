[[tasks]]
number = 1
slug = "admin-account"
difficulty = "easy"
instruction = """
On `node1`, create a local administrator account named `opsadmin` with a private home directory and full administrative privileges.
"""

[[tasks]]
number = 2
slug = "service-account"
difficulty = "easy"
instruction = """
On `node1`, create a system account named `inventorysvc` with `/var/lib/inventory` as its home directory and no interactive login access.
"""

[[tasks]]
number = 3
slug = "shared-group-directory"
difficulty = "easy"
instruction = """
On `node1`, create the `platform` group and a `/srv/platform` workspace where group members can collaborate while other users have no access.
"""

[[tasks]]
number = 4
slug = "restricted-sudo"
difficulty = "medium"
instruction = """
On `node1`, create a `helpdesk` account that can restart the SSH service with sudo but has no other administrative privileges.
"""

[[tasks]]
number = 5
slug = "password-aging"
difficulty = "easy"
instruction = """
On `node1`, create the local account `contractor` and configure its password to expire every 60 days with a 10-day warning period.
"""

[[tasks]]
number = 6
slug = "login-lockout"
difficulty = "medium"
instruction = """
On `node1`, configure local password authentication to lock an account for five minutes after five failed login attempts.
"""

[[tasks]]
number = 7
slug = "secure-umask"
difficulty = "easy"
instruction = """
On `node1`, configure new interactive login sessions to use a default umask of `027`.
"""

[[tasks]]
number = 8
slug = "ssh-key-only"
difficulty = "medium"
instruction = """
On `node1`, configure `opsadmin` for SSH access with the public key `ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINMKA2+oNHxgmpABaV61Sar8lVW2YxSL8Aw9d7b5yLh1 os-comparison@example.invalid`, and require key-based SSH authentication.
"""

[[tasks]]
number = 9
slug = "ssh-group-access"
difficulty = "medium"
instruction = """
On `node1`, restrict SSH login access to members of a local group named `remote-access`, and add `opsadmin` to that group.
"""

[[tasks]]
number = 10
slug = "sftp-only-account"
difficulty = "medium"
instruction = """
On `node1`, create an SFTP-only account named `dropbox` confined to `/srv/sftp/dropbox`, with a writable `incoming` directory.
"""

[[tasks]]
number = 11
slug = "login-banner"
difficulty = "easy"
instruction = """
On `node1`, display `Authorized access only` before local and SSH logins.
"""

[[tasks]]
number = 12
slug = "system-hostname"
difficulty = "easy"
instruction = """
On `node1`, set the persistent system hostname to `os-lab.infra.test` and ensure the host can resolve that name locally.
"""

[[tasks]]
number = 13
slug = "system-timezone"
difficulty = "easy"
instruction = """
On `node1`, configure the system timezone as `America/Toronto`.
"""

[[tasks]]
number = 14
slug = "time-synchronization"
difficulty = "medium"
instruction = """
On `node1`, configure the system clock to synchronize with `pool.ntp.org` and keep synchronization active across restarts.
"""

[[tasks]]
number = 15
slug = "system-locale"
difficulty = "medium"
instruction = """
On `node1`, configure `C.UTF-8` as the default locale for new login sessions and services.
"""

[[tasks]]
number = 16
slug = "persistent-dns-settings"
difficulty = "medium"
instruction = """
On `node1`, make the currently supplied DNS nameservers persistent and add `infra.test` as the system search domain.
"""

[[tasks]]
number = 17
slug = "security-updates"
difficulty = "medium"
preparation = "inventory-data"
instruction = """
On `node1`, apply the security updates available from the configured software repositories while preserving the existing inventory data.
"""

[[tasks]]
number = 18
slug = "kernel-network-hardening"
difficulty = "medium"
instruction = """
On `node1`, persistently disable acceptance of ICMP redirects and source-routed packets for IPv4 networking.
"""

[[tasks]]
number = 19
slug = "account-resource-limits"
difficulty = "medium"
instruction = """
On `node1`, create the `appworker` account and give its login sessions a limit of 8,192 open files and 256 processes.
"""

[[tasks]]
number = 20
slug = "disable-core-dumps"
difficulty = "medium"
instruction = """
On `node1`, disable core dumps for processes run by local service accounts while retaining normal crash logging.
"""

[[tasks]]
number = 21
slug = "swap-file"
difficulty = "medium"
instruction = """
On `node1`, add a 512 MiB swap file that is activated now and after future boots.
"""

[[tasks]]
number = 22
slug = "persistent-bind-mount"
difficulty = "medium"
instruction = """
On `node1`, create `/srv/inventory` and make it persistently available at `/mnt/inventory` through a bind mount.
"""

[[tasks]]
number = 23
slug = "shared-directory-acl"
difficulty = "medium"
instruction = """
On `node1`, configure `/srv/reports` so members of `report-writers` can modify its contents and members of `report-readers` have read-only access.
"""

[[tasks]]
number = 24
slug = "setgid-workspace"
difficulty = "easy"
instruction = """
On `node1`, configure `/srv/releases` as a `release-team` workspace where newly created files inherit the workspace group.
"""

[[tasks]]
number = 25
slug = "sticky-drop-directory"
difficulty = "easy"
instruction = """
On `node1`, configure `/srv/drop` as a shared writable directory where users cannot remove files owned by other users.
"""

[[tasks]]
number = 26
slug = "repair-application-permissions"
difficulty = "medium"
preparation = "inventory-data"
instruction = """
On `node1`, repair `/srv/inventory` so its existing data is owned by `inventorysvc`, readable by `inventory-readers`, and inaccessible to other users. Preserve the existing contents.
"""

[[tasks]]
number = 27
slug = "scheduled-backup"
difficulty = "medium"
preparation = "inventory-data"
instruction = """
On `node1`, back up `/srv/inventory/data` to `/var/backups/inventory` every day and retain the seven most recent backups.
"""

[[tasks]]
number = 28
slug = "restore-latest-backup"
difficulty = "medium"
preparation = "restore-data"
instruction = """
On `node1`, restore `/srv/inventory/data/config.json` from the latest backup in `/var/backups/inventory` while preserving the other current inventory files.
"""

[[tasks]]
number = 29
slug = "temporary-file-cleanup"
difficulty = "medium"
preparation = "temporary-files"
instruction = """
On `node1`, remove inventory temporary files in `/var/tmp/inventory` after they are seven days old and run that cleanup automatically each day.
"""

[[tasks]]
number = 30
slug = "application-log-rotation"
difficulty = "medium"
preparation = "application-log"
instruction = """
On `node1`, rotate `/var/log/inventory/app.log` daily, keep seven compressed rotations, and allow the application to continue writing after rotation.
"""

[[tasks]]
number = 31
slug = "audit-sensitive-file"
difficulty = "medium"
preparation = "audit-target"
instruction = """
On `node1`, record successful and unsuccessful changes to `/etc/inventory.conf` in the system audit log using the key `inventory-config`.
"""

[[tasks]]
number = 32
slug = "local-log-retention"
difficulty = "medium"
instruction = """
On `node1`, configure system logging so local logs survive restarts and are retained for 14 days without unbounded disk growth.
"""

[[tasks]]
number = 33
slug = "separate-authentication-logs"
difficulty = "medium"
instruction = """
On `node1`, route authentication and authorization messages to `/var/log/auth-events.log` while keeping normal system logging operational.
"""

[[tasks]]
number = 34
slug = "scheduled-maintenance"
difficulty = "easy"
preparation = "maintenance-command"
instruction = """
On `node1`, run `/usr/local/bin/inventory-maintenance` every day at 02:15 and retain its output in `/var/log/inventory-maintenance.log`.
"""

[[tasks]]
number = 35
slug = "boot-service"
difficulty = "medium"
preparation = "service-worker"
instruction = """
On `node1`, run `/usr/local/bin/os-comparison-worker` as a managed service named `inventory-worker` and start it automatically during boot.
"""

[[tasks]]
number = 36
slug = "service-restart-on-failure"
difficulty = "medium"
preparation = "flaky-worker"
instruction = """
On `node1`, run `/usr/local/bin/os-comparison-flaky-worker` as `inventory-worker` and have the service recover automatically after the worker fails.
"""

[[tasks]]
number = 37
slug = "unprivileged-service"
difficulty = "medium"
preparation = "service-worker"
instruction = """
On `node1`, run `/usr/local/bin/os-comparison-worker` as a managed service named `inventory-worker` under the dedicated `inventorysvc` account.
"""

[[tasks]]
number = 38
slug = "service-dependency"
difficulty = "medium"
preparation = "dependent-workers"
instruction = """
On `node1`, manage the supplied `inventory-database` and `inventory-api` programs as services, with the API starting only after the database is ready.
"""

[[tasks]]
number = 39
slug = "service-resource-limits"
difficulty = "medium"
preparation = "resource-worker"
instruction = """
On `node1`, run `/usr/local/bin/os-comparison-resource-worker` as `inventory-worker` with at most 25 percent of one CPU and 128 MiB of memory.
"""

[[tasks]]
number = 40
slug = "graceful-service-shutdown"
difficulty = "medium"
preparation = "graceful-worker"
instruction = """
On `node1`, run `/usr/local/bin/os-comparison-graceful-worker` as `inventory-worker` and allow it up to 30 seconds to finish cleanly when the service stops.
"""

[[tasks]]
number = 41
slug = "host-firewall-baseline"
difficulty = "medium"
instruction = """
On `node1`, enable a persistent host firewall that permits SSH and TCP port 8080 while rejecting unrelated inbound connections.
"""

[[tasks]]
number = 42
slug = "ssh-rate-limiting"
difficulty = "medium"
instruction = """
On `node1`, configure the host firewall to rate-limit repeated new SSH connections while keeping normal administrative access available.
"""

[[tasks]]
number = 43
slug = "loopback-only-service"
difficulty = "medium"
instruction = """
On `node1`, configure a web service on TCP port 8081 that is reachable through the loopback interface but not through the system's external interfaces.
"""

[[tasks]]
number = 44
slug = "custom-ca-trust"
difficulty = "medium"
instruction = """
On `node1`, create a local certificate authority named `OS Comparison Root CA` and install its certificate as a trusted system certificate authority.
"""

[[tasks]]
number = 45
slug = "static-web-service"
difficulty = "easy"
instruction = """
On `node1`, configure a web server to return `os-comparison-ready` at `/` over TCP port 8080.
"""

[[tasks]]
number = 46
slug = "https-web-service"
difficulty = "medium"
instruction = """
On `node1`, configure a web server to return `secure-os-comparison-ready` at `/` over HTTPS on TCP port 8443 using a certificate trusted by the system.
"""

[[tasks]]
number = 47
slug = "reverse-proxy"
difficulty = "medium"
instruction = """
On `node1`, configure a local backend on TCP port 8091 that returns `backend-ready`, and publish it through a reverse proxy on TCP port 8090.
"""

[[tasks]]
number = 48
slug = "caching-dns-resolver"
difficulty = "medium"
instruction = """
On `node1`, configure a local caching DNS resolver for applications on the system while preserving normal external name resolution.
"""

[[tasks]]
number = 49
slug = "mariadb-local-service"
difficulty = "medium"
instruction = """
On `node1`, configure MariaDB with an `inventory` database, an `items` table, and a local application account whose generated credential is stored in `/etc/inventory-db.env` with root-only access.
"""

[[tasks]]
number = 50
slug = "redis-persistent-service"
difficulty = "medium"
instruction = """
On `node1`, configure Redis with persistent storage and a dedicated `inventory` application identity whose generated credential is stored in `/etc/redis-inventory.env` with root-only access.
"""
