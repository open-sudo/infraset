timeout_sec = 120

[[observations]]
id = "prepared-inventory-data"
stage = 10
node = "node1"
command = '''
set -eu
find /srv/inventory/data -type f -print0 | sort -z | xargs -0 sha256sum
stat -c '%U:%G:%a:%n' /srv/inventory /srv/inventory/data /srv/inventory/data/records.csv /srv/inventory/data/config.json
'''
required = true
