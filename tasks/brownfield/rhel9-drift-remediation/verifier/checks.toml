schema_version = 1

[[probes]]
id = "drift-convergence"
level = 1
targets = ["node1", "node2", "node3", "node4"]
max_exec_calls = 12
procedure = "Inspect every node's installed rsyslog package identity, service enabled/active state, effective configuration validity, TCP 5514 listener, local evaluator message path, configured log destination, and prepared data file. Establish that every node has converged to the same intended service behavior while retaining the existing application data."

[[probes]]
id = "security-and-preservation"
level = 2
targets = ["node1", "node2", "node3", "node4"]
max_exec_calls = 12
procedure = "Inspect SELinux enforcement and effective contexts for the log destination, rsyslog's service identity and writable paths, firewalld runtime and persistent policy, configuration ownership and modes, failed units, duplicate listeners, and the prepared records.db content and metadata. Compare the live data with the preparation baseline and confirm the candidate repaired labels and controls without replacing existing data."

[[probes]]
id = "idempotence-and-hygiene"
level = 5
targets = ["node1", "node2", "node3", "node4"]
max_exec_calls = 12
procedure = "Inspect all rsyslog configuration fragments and systemd state for duplicate TCP listeners or destinations, conflicting drop-ins, preparation error directives, backup copies, abandoned repair scripts, temporary files, debug settings, unnecessary packages or services, and executor residue. Validate the native rsyslog configuration again and determine whether the converged configuration is coherent and repeatable rather than a pile of overrides."

[[probes]]
id = "drift-reboot-persistence"
level = 8
targets = ["node1", "node2", "node3", "node4"]
effect = "reboot"
max_exec_calls = 16
procedure = "Record boot identities, package identity, enabled/active service state, SELinux mode and log-file context, firewall state, records.db hash and metadata, and a fresh local syslog message. Reboot node1 through node4 sequentially, waiting for each node to return, then repeat the service, security, listener, configuration, log-delivery, and data checks without applying repair."
cleanup = "Wait for every node to return healthy and leave all four nodes with the converged rsyslog service, SELinux labels, firewall policy, and preserved application data."

[[assertions]]
id = "all-nodes-serve-application"
probe = "drift-convergence"
dimension = "functionality"
points = 4
critical = true
pass_condition = "Every node has the supported rsyslog package, an enabled active service, a valid configuration, a TCP 5514 listener, and successful delivery of a local0 message to the required log destination."
fail_condition = "Any node remains inactive, invalid, misconfigured, unavailable on TCP 5514, or fails to persist the required local0 message."

[[assertions]]
id = "package-state-converged"
probe = "drift-convergence"
dimension = "functionality"
points = 2
pass_condition = "All four nodes have the same installed rsyslog package identity or an equivalent supported package state appropriate to RHEL 9."
fail_condition = "Live package evidence confirms a node is missing rsyslog or remains on an incompatible divergent package state."

[[assertions]]
id = "selinux-and-firewall-effective"
probe = "security-and-preservation"
dimension = "security"
points = 3
critical = true
pass_condition = "SELinux is enforcing with an effective rsyslog-writable label on the log destination, and firewalld is enabled with persistent policy for the required service access."
fail_condition = "SELinux is permissive/disabled, the application requires a labeling bypass, or firewalld is disabled, nonpersistent, or broadly weakened."

[[assertions]]
id = "prepared-data-preserved"
probe = "security-and-preservation"
dimension = "functionality"
points = 3
critical = true
pass_condition = "Every node's prepared records.db retains its baseline content, owner, group, and mode, and rsyslog uses the existing prepared log destination."
fail_condition = "Any prepared data file is missing, changed, replaced by empty data, relocated without preservation, or has changed protected metadata."

[[assertions]]
id = "configuration-clean-and-idempotent"
probe = "idempotence-and-hygiene"
dimension = "operational_hygiene"
points = 3
critical = true
pass_condition = "Rsyslog configuration is valid and coherent with one effective service contract, with preparation breakage, duplicate directives, conflicting overrides, failed units, debug bypasses, and executor residue removed."
fail_condition = "Concrete evidence confirms duplicate/conflicting configuration, a surviving preparation fault, failed service state, insecure bypass, or abandoned repair residue."

[[assertions]]
id = "reboot-state-persists"
probe = "drift-reboot-persistence"
dimension = "persistence"
points = 4
critical = true
pass_condition = "All four boot identities change and each node automatically returns with rsyslog active/enabled, valid TCP 5514 behavior, enforcing SELinux, persistent firewall policy, and unchanged prepared data."
fail_condition = "A completed reboot loses service availability, configuration, security controls, application response, or prepared data, or requires manual repair."
