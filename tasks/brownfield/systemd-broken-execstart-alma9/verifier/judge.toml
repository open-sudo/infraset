reasoning_effort = "medium"
timeout_sec = 900
allow_ssh_probes = false
parallel_node_collection = true
node_collector_timeout_sec = 180
node_collector_command_budget = 8

[dimensions.functionality]
weight = 0.40
description = "Verify telemetry-heartbeat.service is loaded, enabled, and active (running), with a nonzero stable MainPID. Inspect the effective ExecStart and prove it launches the existing /usr/local/bin/telemetry-heartbeat program rather than the prepared missing path, a wrapper, or a compatibility symlink. Observe /run/telemetry-heartbeat/heartbeat changing across multiple samples and verify every timestamp is parseable, recent, and refreshed within five seconds. Confirm the active process belongs to the service and no restart loop is occurring."

[dimensions.security]
weight = 0.20
description = "Compare with the baseline and verify the service still runs as the existing non-login svc-heartbeat identity, never as root. Confirm the installed program and effective unit configuration remain root-controlled and not group- or world-writable. Inspect effective systemd properties to preserve NoNewPrivileges, PrivateTmp, strict filesystem and home protection, kernel/control-group protections, an empty capability bounding set, restricted address families, and only the declared writable runtime directory. Verify SELinux remains enforcing and host security state was not weakened."

[dimensions.persistence]
weight = 0.25
description = "Record node1's boot identity, reboot it once, and prove the boot identity changes. Without repairing anything after reboot, confirm telemetry-heartbeat.service automatically becomes active (running), remains enabled, uses the repaired effective ExecStart and svc-heartbeat identity, retains its security restrictions, and produces two distinct fresh heartbeat timestamps within five seconds. Confirm SELinux and the baseline host security state persist."

[dimensions.operational_hygiene]
weight = 0.15
description = "Compare with the preparation baseline. Verify the installed heartbeat program hash and svc-heartbeat identity are unchanged and the unit changed only as needed to produce a coherent effective service. Inspect for failed units after recovery, stale start-limit state, duplicate service processes, obsolete wrappers or symlinks for the missing executable, conflicting drop-ins, unit backups, temporary files, debug overrides, extra users, packages, credentials, services, or listeners. Historical 203/EXEC journal entries created by preparation are expected evidence and are not residue; current unit state and post-repair starts must be clean."
