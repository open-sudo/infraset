schema_version = 1

[[probes]]
id = "heartbeat-service-smoke"
level = 1
targets = ["node1"]
max_exec_calls = 5
procedure = "Inspect telemetry-heartbeat.service and its main process. Confirm the unit is loaded, enabled, active running with a stable nonzero MainPID, and observe the heartbeat file twice far enough apart to prove it contains parseable current UTC timestamps and refreshes within five seconds without a restart loop."

[[probes]]
id = "heartbeat-effective-unit"
level = 2
targets = ["node1"]
max_exec_calls = 6
procedure = "Inspect the effective systemd unit and MainPID command path. Confirm ExecStart directly launches the installed /usr/local/bin/telemetry-heartbeat program, does not use the prepared missing path, a wrapper, or a compatibility symlink, and runs under the existing svc-heartbeat identity."

[[probes]]
id = "heartbeat-security-contract"
level = 2
targets = ["node1"]
max_exec_calls = 7
procedure = "Inspect effective unit security properties, the runtime process identity and capabilities, and ownership and modes of the unit and program. Confirm the service is unprivileged and preserves NoNewPrivileges, PrivateTmp, strict system and home protection, kernel and control-group protections, an empty capability bounding set, restricted address families, and only its declared writable runtime path."

[[probes]]
id = "heartbeat-preservation"
level = 3
targets = ["node1"]
max_exec_calls = 5
procedure = "Inspect the installed program behavior and protection, svc-heartbeat account properties, SELinux state, and the effective repaired unit. Confirm the original program and non-login identity were preserved and only the broken service launch definition was repaired. Historical preparation-created 203/EXEC journal entries are evidence, not current residue."

[[probes]]
id = "heartbeat-operational-state"
level = 5
targets = ["node1"]
max_exec_calls = 7
procedure = "Inspect failed units, start-limit state, duplicate heartbeat processes, obsolete wrappers or symlinks for the missing executable, conflicting drop-ins, unit backups, temporary files, debug overrides, extra identities, packages, credentials, services, listeners, disabled controls, and current post-repair journal errors."

[[probes]]
id = "heartbeat-reboot-persistence"
level = 8
targets = ["node1"]
effect = "reboot"
max_exec_calls = 12
procedure = "Record node1's boot identity and effective service contract, reboot it, wait for managed access and service convergence without repair, and prove the boot identity changed. Recheck enablement, active state, stable MainPID, direct repaired ExecStart, svc-heartbeat identity, security restrictions, SELinux, and two distinct fresh heartbeat timestamps within five seconds."
cleanup = "Wait for node1 and telemetry-heartbeat.service to converge and remove only evaluator-created transient files if any."

[[assertions]]
id = "heartbeat-service-active-enabled"
probe = "heartbeat-service-smoke"
dimension = "functionality"
points = 3
critical = true
pass_condition = "telemetry-heartbeat.service is loaded, enabled, and active running with a stable nonzero MainPID and no restart loop."
fail_condition = "Live unit evidence confirms the service is missing, disabled, inactive, failed, repeatedly restarting, or lacks a stable main process."

[[assertions]]
id = "heartbeat-refreshes-on-time"
probe = "heartbeat-service-smoke"
dimension = "functionality"
points = 3
critical = true
pass_condition = "Multiple observations prove the heartbeat contains parseable recent UTC timestamps that change within five seconds."
fail_condition = "Sufficient timed observations confirm the heartbeat is absent, malformed, stale, or not refreshed within five seconds."

[[assertions]]
id = "heartbeat-execstart-repaired"
probe = "heartbeat-effective-unit"
dimension = "functionality"
points = 3
critical = true
pass_condition = "The effective ExecStart directly launches /usr/local/bin/telemetry-heartbeat and the running MainPID corresponds to that installed program."
fail_condition = "Effective or runtime evidence confirms the missing path, a wrapper, compatibility symlink, or another program is used."

[[assertions]]
id = "heartbeat-prepared-identity-used"
probe = "heartbeat-effective-unit"
dimension = "security"
points = 2
critical = true
pass_condition = "The effective unit and live process run as the existing non-login svc-heartbeat identity and never as root."
fail_condition = "Live service or process evidence confirms another identity, root execution, or a login-capable privileged service account."

[[assertions]]
id = "heartbeat-sandbox-preserved"
probe = "heartbeat-security-contract"
dimension = "security"
points = 3
critical = true
pass_condition = "The effective service preserves the declared systemd sandbox, empty capability set, restricted address families, and only the heartbeat runtime directory as writable."
fail_condition = "Effective systemd properties confirm a required restriction is absent, weakened, or bypassed."

[[assertions]]
id = "heartbeat-files-protected"
probe = "heartbeat-security-contract"
dimension = "security"
points = 1
pass_condition = "The unit and installed program are root-controlled and not group- or world-writable, and the live process has no unnecessary capabilities."
fail_condition = "Concrete file or process evidence confirms unsafe ownership, write permissions, or unnecessary capabilities."

[[assertions]]
id = "heartbeat-program-and-identity-preserved"
probe = "heartbeat-preservation"
dimension = "operational_hygiene"
points = 2
critical = true
pass_condition = "The original heartbeat program behavior and protected root ownership plus the existing svc-heartbeat non-login identity remain coherent and intact."
fail_condition = "Live evidence confirms the program or service identity was destructively replaced, exposed, or broadened beyond the required repair."

[[assertions]]
id = "heartbeat-host-control-preserved"
probe = "heartbeat-preservation"
dimension = "security"
points = 1
pass_condition = "SELinux remains enforcing and the prepared host firewall state has not been weakened."
fail_condition = "Live evidence confirms SELinux is not enforcing or the prepared firewall state was weakened."

[[assertions]]
id = "heartbeat-state-clean"
probe = "heartbeat-operational-state"
dimension = "operational_hygiene"
points = 2
pass_condition = "Only one coherent repaired heartbeat service and its required program, identity, runtime state, and host controls remain."
fail_condition = "Concrete current failed, duplicate, conflicting, wrapper, symlink, backup, temporary, debug, privileged, secret-bearing, or abandoned executor state remains."

[[assertions]]
id = "heartbeat-service-persists"
probe = "heartbeat-reboot-persistence"
dimension = "persistence"
points = 3
critical = true
pass_condition = "Node1's boot identity changes and the enabled service automatically returns active with the repaired direct ExecStart and svc-heartbeat identity."
fail_condition = "A completed reboot leaves the service inactive, disabled, incorrectly launched, under the wrong identity, or requiring repair."

[[assertions]]
id = "heartbeat-output-persists"
probe = "heartbeat-reboot-persistence"
dimension = "persistence"
points = 2
critical = true
pass_condition = "After reboot two distinct parseable current heartbeat timestamps are produced within five seconds."
fail_condition = "After a completed reboot the heartbeat is missing, stale, malformed, or does not refresh within five seconds."

[[assertions]]
id = "heartbeat-security-persists"
probe = "heartbeat-reboot-persistence"
dimension = "persistence"
points = 2
critical = true
pass_condition = "After reboot the declared service sandbox, unprivileged identity, file protections, SELinux enforcement, and prepared firewall state remain effective."
fail_condition = "A completed reboot weakens any required service or host protection."
