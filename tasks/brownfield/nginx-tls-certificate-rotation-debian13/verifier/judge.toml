reasoning_effort = "medium"
timeout_sec = 1200
allow_ssh_probes = false
parallel_node_collection = true
node_collector_timeout_sec = 240
node_collector_command_budget = 8

[dimensions.functionality]
weight = 0.30
description = "From node2, use openssl s_client against node1:443 with SNI node1 and prove the endpoint serves a certificate whose SHA-256 fingerprint differs from the expired preparation baseline. Verify the served and locally configured certificates are identical, the certificate matches DNS name node1, is currently valid with at least 180 days remaining, is self-issued with a valid self-signature, and the existing HTTPS page and health response remain available. Confirm the Debian nginx package, configuration test, active service, and enabled boot state."

[dimensions.security]
weight = 0.20
description = "Inspect the effective TLS endpoint and certificate/key material. Require TLS 1.2 or newer, an appropriate modern signature and key strength, a matching certificate/private-key pair, root-controlled private-key permissions, and absence of the private key from node2, process arguments, logs, temporary paths, or broadly readable files. Verify nginx exposes the intended HTTPS listener without an unnecessary plaintext listener, workers run without root privilege, and host controls were not weakened. Accept equivalent secure certificate paths and key algorithms."

[dimensions.resilience]
weight = 0.15
description = "Before evaluator disruption, compare with the baseline and verify both preparation-owned node2 probes retain their original PIDs and remain active: the slow transfer proves the established TLS connection survived executor work, while the rapid probe proves endpoint availability remained continuous. Then run an evaluator-owned rapid client probe while gracefully reloading nginx once, verify zero request failures, confirm the nginx master PID remains unchanged across reload, and restore or stop evaluator probes. Treat the two preparation probe units and the sparse continuity object as expected baseline instrumentation."

[dimensions.persistence]
weight = 0.20
description = "After resilience evidence is captured, stop the preparation probes, record boot identities, and reboot node1 and node2 sequentially. Prove both boot identities changed. From node2 after both reboots, repeat certificate fingerprint, hostname, validity, self-signature, TLS, page, and health checks. Confirm nginx is enabled and active, the protected matching key remains available, and the existing web-content checksum still matches the preparation baseline."

[dimensions.operational_hygiene]
weight = 0.15
description = "Compare both hosts with the preparation baseline. Preserve the existing web content and account state. Inspect for failed units, nginx restart or crash evidence during executor rotation, duplicate/default listeners, conflicting server blocks, stale old certificates, private-key copies, backup files, CSRs, temporary OpenSSL configs, abandoned downloads, scripts, packages, credentials, debug settings, and unrelated services or users. Preparation-owned probe units under /run and /var/www/html/continuity.bin are expected; stop the probes after collecting pre-reboot resilience evidence and do not attribute evaluator reboot effects to the executor."
