schema_version = 1

[[probes]]
id = "nginx-tls-service-smoke"
level = 1
targets = ["node1", "node2"]
max_exec_calls = 6
procedure = "On node1 validate the effective Nginx configuration and confirm the distribution service is enabled and active. From node2 connect to node1:443 with SNI node1, capture the served leaf certificate, and request the declared HTTPS health endpoint."

[[probes]]
id = "rotated-certificate-contract"
level = 2
targets = ["node1", "node2"]
max_exec_calls = 8
procedure = "From node2 use openssl s_client with SNI node1 to inspect the served certificate. Verify it is currently valid, remains valid for at least 180 days, matches DNS name node1, is self-issued, and verifies against itself. On node1 discover Nginx's effective certificate path and confirm the configured certificate has the same SHA-256 fingerprint as the served certificate."

[[probes]]
id = "tls-key-and-endpoint-security"
level = 2
targets = ["node1", "node2"]
max_exec_calls = 9
procedure = "Discover the effective certificate and private-key paths from validated Nginx configuration without printing the key. Compare derived public-key fingerprints to prove the pair matches. Inspect algorithm strength, signature, key ownership and modes, enabled TLS protocols, listeners, worker identities, and host controls. Confirm TLS 1.2 or newer works, obsolete protocol negotiation fails, port 80 is not exposed, and no private-key material appears on node2 or in process arguments or common temporary paths."

[[probes]]
id = "tls-content-preservation"
level = 3
targets = ["node1", "node2"]
max_exec_calls = 6
procedure = "From node2 retrieve the HTTPS root page and health endpoint and confirm their exact declared content. On node1 inspect the existing page, effective site configuration, certificate artifacts, and account state for preservation without requiring one certificate directory layout."

[[probes]]
id = "prepared-continuity-evidence"
level = 5
targets = ["node2"]
max_exec_calls = 5
procedure = "Inspect the preparation-owned infraset-continuity and infraset-availability units before any evaluator disruption. Confirm both remain active with live nonzero processes: the long-lived slow transfer must still be running and the rapid health loop must not have exited. Use their uninterrupted active state as evidence that executor rotation did not drop the established connection or endpoint availability."

[[probes]]
id = "tls-operational-state"
level = 5
targets = ["node1", "node2"]
max_exec_calls = 8
procedure = "Inspect failed units, Nginx restart or crash evidence after preparation, duplicate listeners or conflicting server blocks, stale expired certificates, private-key copies, backups, CSRs, temporary OpenSSL files, scripts, downloads, credentials, debug settings, unrelated services, users, packages, and account changes. Treat the preparation-owned probe units and continuity.bin as legitimate instrumentation."

[[probes]]
id = "evaluator-graceful-reload"
level = 6
targets = ["node1", "node2"]
effect = "controlled_failure"
max_exec_calls = 10
procedure = "Record the Nginx master PID. Start a uniquely named evaluator-owned rapid HTTPS health loop on node2 that records every failure, validate Nginx configuration, gracefully reload Nginx once, and let the probe span the reload. Confirm the master PID is unchanged, the evaluator probe records zero failures, and both preparation-owned probes remain active."
cleanup = "Stop and remove only the evaluator-owned rapid probe and its output, confirm Nginx is active, and leave the preparation-owned probes running for later persistence preparation."

[[probes]]
id = "tls-server-reboot"
level = 8
targets = ["node1", "node2"]
effect = "reboot"
max_exec_calls = 12
procedure = "On node2 stop the two preparation-owned transient probe units after their continuity evidence has been collected. Record node1's boot identity and the served certificate fingerprint, reboot node1, wait for HTTPS recovery without repair, and prove its boot identity changed. From node2 revalidate the certificate identity, remaining validity, self-signature, fingerprint, page, health endpoint, TLS policy, and protected matching key on node1."
cleanup = "Keep the preparation-owned transient probes stopped, wait for node1 and Nginx to converge, and remove only evaluator-created transient files."

[[probes]]
id = "tls-client-reboot"
level = 10
targets = ["node1", "node2"]
effect = "reboot"
max_exec_calls = 12
procedure = "Record node2's boot identity, reboot node2, wait for managed access and name resolution without repair, and prove its boot identity changed. From the rebooted client repeat the certificate, hostname, validity, self-signature, TLS, page, and health checks against node1 and confirm the original certificate fingerprint is still served."
cleanup = "Wait for node2 networking to converge and remove only evaluator-created certificate or connection artifacts."

[[assertions]]
id = "nginx-https-ready"
probe = "nginx-tls-service-smoke"
dimension = "functionality"
points = 3
critical = true
pass_condition = "Nginx configuration validates, the service is enabled and active, node2 completes TLS to node1:443 with SNI node1, and /healthz returns certificate-rotation-ready."
fail_condition = "Correctly targeted live evidence confirms invalid configuration, inactive or disabled Nginx, failed TLS, or an incompatible health response."

[[assertions]]
id = "rotated-certificate-valid-for-node1"
probe = "rotated-certificate-contract"
dimension = "functionality"
points = 3
critical = true
pass_condition = "The served certificate matches DNS name node1, is currently valid with at least 180 days remaining, is self-issued, and validates against itself."
fail_condition = "The live served certificate fails hostname, current validity, 180-day remaining validity, self-issue, or self-signature validation."

[[assertions]]
id = "served-and-configured-certificates-match"
probe = "rotated-certificate-contract"
dimension = "functionality"
points = 2
critical = true
pass_condition = "The certificate served to node2 has the same SHA-256 fingerprint as the certificate in Nginx's effective configuration."
fail_condition = "Live fingerprints prove Nginx serves a different certificate from its effective configured certificate."

[[assertions]]
id = "tls-private-key-matches-and-is-protected"
probe = "tls-key-and-endpoint-security"
dimension = "security"
points = 2
critical = true
pass_condition = "The configured private key matches the certificate, is root-controlled with restrictive permissions, and is absent from node2, process arguments, logs, and common temporary paths."
fail_condition = "Derived public keys do not match or concrete evidence confirms unsafe key ownership, permissions, copying, or exposure."

[[assertions]]
id = "tls-endpoint-modern-and-minimal"
probe = "tls-key-and-endpoint-security"
dimension = "security"
points = 2
pass_condition = "The endpoint uses a modern signature and strong key, negotiates TLS 1.2 or newer but not obsolete protocols, has no unnecessary plaintext listener, and Nginx workers are unprivileged."
fail_condition = "Live cryptographic, protocol, listener, or process evidence confirms weak material, obsolete TLS, plaintext exposure, or root worker processes."

[[assertions]]
id = "https-content-preserved"
probe = "tls-content-preservation"
dimension = "functionality"
points = 2
pass_condition = "Node2 receives the existing HTTPS content and exact certificate-rotation-ready health response from node1."
fail_condition = "Correct live HTTPS requests confirm the existing page or health content was lost or changed incompatibly."

[[assertions]]
id = "executor-rotation-preserved-connections"
probe = "prepared-continuity-evidence"
dimension = "resilience"
points = 3
critical = true
pass_condition = "Both preparation-owned probes remain continuously active: the original slow TLS transfer is still connected and the rapid health loop has not exited."
fail_condition = "Live unit and process evidence confirms either preparation-owned continuity probe exited or restarted during executor work."

[[assertions]]
id = "tls-state-clean"
probe = "tls-operational-state"
dimension = "operational_hygiene"
points = 2
pass_condition = "Only coherent required Nginx, certificate, protected key, content, probe instrumentation, package, account, and host-control state remains."
fail_condition = "Concrete failed, restarted, duplicate, conflicting, expired, copied-key, backup, CSR, temporary, debug, credential-bearing, or unrelated executor state remains."

[[assertions]]
id = "graceful-reload-keeps-master"
probe = "evaluator-graceful-reload"
dimension = "resilience"
points = 2
critical = true
pass_condition = "A validated graceful reload completes with the same Nginx master PID."
fail_condition = "The controlled reload fails or live PID evidence confirms the Nginx master was replaced."

[[assertions]]
id = "graceful-reload-keeps-https-available"
probe = "evaluator-graceful-reload"
dimension = "resilience"
points = 2
critical = true
pass_condition = "The evaluator-owned rapid client records zero HTTPS health failures across the graceful reload and the prepared probes remain active."
fail_condition = "A correctly running controlled client probe records any request failure across reload or a prepared continuity probe exits."

[[assertions]]
id = "tls-server-state-persists"
probe = "tls-server-reboot"
dimension = "persistence"
points = 3
critical = true
pass_condition = "Node1's boot identity changes and Nginx automatically serves the same valid node1 certificate, page, and health endpoint with matching protected key and modern TLS."
fail_condition = "A completed node1 reboot loses or changes required HTTPS, certificate, key, content, or TLS state or requires repair."

[[assertions]]
id = "tls-client-access-persists"
probe = "tls-client-reboot"
dimension = "persistence"
points = 3
critical = true
pass_condition = "Node2's boot identity changes and the rebooted client again validates the same certificate identity, validity, self-signature, TLS policy, page, and health endpoint."
fail_condition = "A completed node2 reboot prevents or changes required client validation or access."
