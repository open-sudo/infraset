timeout_sec = 180

[[observations]]
id = "expired-certificate-fingerprint"
stage = 10
node = "node1"
command = "openssl x509 -in /etc/nginx/tls/server.crt -noout -fingerprint -sha256"
required = true

[[observations]]
id = "served-expired-certificate-fingerprint"
stage = 10
node = "node2"
command = "timeout 8 openssl s_client -connect node1:443 -servername node1 </dev/null 2>/dev/null | openssl x509 -noout -fingerprint -sha256"
required = true

[[observations]]
id = "expired-certificate-state"
stage = 10
node = "node1"
command = '''
set -eu
openssl x509 -in /etc/nginx/tls/server.crt -noout -subject -issuer -serial -dates -ext subjectAltName
if openssl x509 -in /etc/nginx/tls/server.crt -checkend 0 -noout >/dev/null; then
  exit 1
fi
printf '%s\n' expired=true
'''
required = true

[[observations]]
id = "nginx-master-pid"
stage = 10
node = "node1"
command = "cat /run/nginx.pid"
required = true

[[observations]]
id = "prepared-client-probe-pids"
stage = 10
node = "node2"
command = '''
systemctl show infraset-continuity.service -p MainPID --value
systemctl show infraset-availability.service -p MainPID --value
'''
required = true

[[observations]]
id = "existing-web-content"
stage = 10
node = "node1"
command = "sha256sum /var/www/html/index.html"
required = true

[[observations]]
id = "server-account-state"
stage = 10
node = "node1"
command = "getent passwd | sha256sum"
required = true

[[observations]]
id = "client-account-state"
stage = 10
node = "node2"
command = "getent passwd | sha256sum"
required = true
