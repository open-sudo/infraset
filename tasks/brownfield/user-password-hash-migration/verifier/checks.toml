schema_version = 1

[[probes]]
id = "migrated-identity-smoke"
level = 1
targets = ["node1", "node2"]
max_exec_calls = 7
procedure = "Confirm node1 is Ubuntu 16.04 and node2 is Ubuntu 24.04. On both systems inspect the local passwd and group records for mira, niko, sana, their primary groups, and legacy-users. Compare UID, primary GID, comment, home, shell, supplementary membership, and declared group IDs across nodes without using SSH or copying protected files."

[[probes]]
id = "migrated-shadow-contract"
level = 2
targets = ["node1", "node2"]
max_exec_calls = 7
procedure = "Using privileged local reads that do not print secrets into the final report, compare each declared user's password-hash digest and every password-aging field between source and destination. Confirm each destination hash is nonempty and unlocked and the aging state does not require an immediate reset or prevent login. Report only equality, algorithm identifiers, and account-state conclusions, never hashes."

[[probes]]
id = "migrated-home-contract"
level = 2
targets = ["node1", "node2"]
max_exec_calls = 8
procedure = "For mira, niko, and sana, independently inventory each home tree on both nodes using relative paths, file types, content digests, symbolic-link targets, numeric ownership, group ownership, and permission modes. Compare the inventories across nodes and confirm all regular and hidden files, directories, executable bits, and sana's contact-current symlink are preserved. Do not transfer or modify user data."

[[probes]]
id = "migrated-account-security"
level = 2
targets = ["node2"]
max_exec_calls = 7
procedure = "Inspect the three migrated accounts, their groups, shadow protections, home traversal and file permissions, sudo eligibility, UID-zero identities, AppArmor state, SSH enablement, and exposed transfer services. Confirm they are ordinary users, their hashes are unlocked but not readable by ordinary users, their private home content is protected, and no unnecessary remote migration path remains."

[[probes]]
id = "original-password-proof"
level = 3
targets = ["node2"]
max_exec_calls = 8
procedure = "Without invoking interactive su in the headless managed session and without printing passwords or hashes, use the destination shadow hashes with the task-private original test passwords Mira-Legacy_42!, Niko-Legacy_73!, and Sana-Legacy_58! through the installed system crypt implementation. Prove each correct password reproduces its stored hash, a known incorrect password does not, and account aging permits authentication without a forced reset."

[[probes]]
id = "source-and-destination-preservation"
level = 4
targets = ["node1", "node2"]
max_exec_calls = 9
procedure = "Recompare source identities, protected shadow digests and aging, and complete home inventories with the declared migrated state. Inspect unrelated destination passwd and group state for coherent preservation and verify AppArmor and prepared SSH states on both hosts. Distinguish the required three users and four groups from unrelated account changes."

[[probes]]
id = "migration-operational-state"
level = 5
targets = ["node1", "node2"]
max_exec_calls = 8
procedure = "Inspect for migration archives, password or shadow copies, temporary credentials, copied package databases, staging directories, transfer services, enabled SSH introduced for migration, failed units, temporary scripts, unexpected packages, altered unrelated users or groups, debug settings, and files with unresolved numeric ownership. Treat the declared users, groups, and their destination homes as required state."

[[probes]]
id = "destination-migration-reboot"
level = 8
targets = ["node1", "node2"]
effect = "reboot"
max_exec_calls = 13
procedure = "Record node2's boot identity and compact digests of its declared identities, shadow and aging records, and home inventories. Reboot node2, wait for managed access without repair, and prove its boot identity changed. Recheck the three identities, groups, unlocked matching password state, task-private original-password crypt proofs, complete home content and metadata, and security controls."
cleanup = "Wait for node2 account and filesystem services to converge and remove only evaluator-created transient comparison data, never user data."

[[probes]]
id = "source-migration-reboot"
level = 10
targets = ["node1", "node2"]
effect = "reboot"
max_exec_calls = 13
procedure = "Record node1's boot identity and compact source identity, shadow, aging, and home-tree digests. Reboot node1, wait for managed access without repair, and prove its boot identity changed. Confirm source identities and homes remain intact, then compare both nodes again to prove the complete migration contract and destination authentication state remain correct after both reboots."
cleanup = "Wait for node1 and node2 account and filesystem services to converge and remove only evaluator-created transient comparison data."

[[assertions]]
id = "destination-platform-correct"
probe = "migrated-identity-smoke"
dimension = "functionality"
points = 1
critical = true
pass_condition = "Node1 is Ubuntu 16.04 and node2 is Ubuntu 24.04 as declared."
fail_condition = "Live operating-system evidence confirms either node has the wrong declared platform."

[[assertions]]
id = "migrated-identities-match"
probe = "migrated-identity-smoke"
dimension = "functionality"
points = 3
critical = true
pass_condition = "Mira, niko, and sana have matching source and destination UID, primary GID, comment, home, shell, primary group, legacy-users membership, and declared group IDs."
fail_condition = "Complete live identity records confirm any declared identity, group, numeric ID, shell, home, comment, or membership is missing or differs."

[[assertions]]
id = "migrated-password-hashes-match"
probe = "migrated-shadow-contract"
dimension = "functionality"
points = 3
critical = true
pass_condition = "For all three users, protected source and destination password hashes are byte-identical, nonempty, and unlocked."
fail_condition = "Privileged digest comparisons confirm any password hash is missing, locked, or differs between source and destination."

[[assertions]]
id = "migrated-password-aging-matches"
probe = "migrated-shadow-contract"
dimension = "functionality"
points = 2
critical = true
pass_condition = "Every password-aging field matches between source and destination and permits login without an immediate forced reset."
fail_condition = "Protected live records confirm any aging field differs or destination aging prevents normal login or forces an unrequested reset."

[[assertions]]
id = "migrated-home-content-matches"
probe = "migrated-home-contract"
dimension = "functionality"
points = 3
critical = true
pass_condition = "Each destination home has exactly the source relative paths, file types, regular and hidden file contents, directory structure, and symbolic-link targets."
fail_condition = "Complete normalized inventories confirm a missing, extra, altered, wrong-type, or incorrectly targeted home entry."

[[assertions]]
id = "migrated-home-metadata-matches"
probe = "migrated-home-contract"
dimension = "functionality"
points = 2
critical = true
pass_condition = "Every migrated home entry preserves source user ownership, group ownership, and permission mode."
fail_condition = "Complete normalized metadata inventories confirm any ownership, group, or mode differs."

[[assertions]]
id = "migrated-users-remain-unprivileged"
probe = "migrated-account-security"
dimension = "security"
points = 2
critical = true
pass_condition = "The migrated users are ordinary non-UID-zero users without sudo, root, shadow, or unnecessary administrative membership or capability."
fail_condition = "Live identity and authorization evidence confirms any migrated user has unnecessary privilege."

[[assertions]]
id = "migrated-credentials-and-homes-protected"
probe = "migrated-account-security"
dimension = "security"
points = 2
critical = true
pass_condition = "Ordinary users cannot read protected shadow data or another migrated user's private home content, and no unnecessary remote transfer service or weakened host control remains."
fail_condition = "Controlled local access or host-state evidence confirms readable credential material, cross-user private-data exposure, unnecessary remote access, or weakened controls."

[[assertions]]
id = "original-passwords-remain-valid"
probe = "original-password-proof"
dimension = "functionality"
points = 3
critical = true
pass_condition = "Each of the three task-private original passwords reproduces its destination hash, incorrect passwords do not, and account aging permits authentication without reset."
fail_condition = "A protected non-interactive crypt proof confirms any original password no longer matches, an incorrect password matches, or account state prevents normal authentication."

[[assertions]]
id = "source-state-remains-intact"
probe = "source-and-destination-preservation"
dimension = "operational_hygiene"
points = 3
critical = true
pass_condition = "Node1 retains the declared identities, password and aging state, and complete home content and metadata used as the migration source."
fail_condition = "Live source evidence confirms any declared account, credential state, or home entry was removed or altered."

[[assertions]]
id = "unrelated-destination-state-preserved"
probe = "source-and-destination-preservation"
dimension = "operational_hygiene"
points = 1
pass_condition = "Node2's unrelated account, group, and host-security state remains coherent and unchanged except for the declared migrated identities."
fail_condition = "Concrete live evidence attributes an unrelated account, group, or host-control change to the migration."

[[assertions]]
id = "migration-state-clean"
probe = "migration-operational-state"
dimension = "operational_hygiene"
points = 2
pass_condition = "No migration archive, credential copy, staging state, transfer service, temporary script, failed unit, ownership defect, or unrelated executor change remains."
fail_condition = "Concrete live evidence confirms migration residue, exposed credentials, unresolved ownership, failed services, or unrelated changes."

[[assertions]]
id = "destination-identities-and-auth-persist"
probe = "destination-migration-reboot"
dimension = "persistence"
points = 3
critical = true
pass_condition = "Node2's boot identity changes and all migrated identities, groups, matching hashes and aging, and original-password proofs remain correct without repair."
fail_condition = "A completed node2 reboot loses or changes identity or authentication state or requires repair."

[[assertions]]
id = "destination-homes-persist"
probe = "destination-migration-reboot"
dimension = "persistence"
points = 2
critical = true
pass_condition = "After node2 reboots every migrated home retains its complete content, structure, symlinks, ownership, group, and modes."
fail_condition = "A completed node2 reboot loses or changes any required home entry or metadata."

[[assertions]]
id = "source-state-persists-after-reboot"
probe = "source-migration-reboot"
dimension = "persistence"
points = 2
critical = true
pass_condition = "Node1's boot identity changes and its original identities, protected password and aging state, and complete home trees remain intact."
fail_condition = "A completed node1 reboot loses or changes any required source identity, credential state, or home data."

[[assertions]]
id = "complete-migration-persists-after-reboots"
probe = "source-migration-reboot"
dimension = "persistence"
points = 2
critical = true
pass_condition = "After both systems reboot, source and destination still match for every declared identity, password state, and home property and destination authentication remains usable."
fail_condition = "After completed sequential reboots any required source-to-destination migration property differs or destination authentication is unusable."
