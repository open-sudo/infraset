schema_version = 1

[[probes]]
id = "destination-database"
level = 1
targets = ["node1", "node2"]
max_exec_calls = 10
procedure = "On node1 and node2, inspect the operating-system release and MariaDB service state. On node1 record the source database table names and row counts. On node2 confirm MariaDB is installed, active, enabled, and that legacy_shop exists. Use local MariaDB clients and report concrete command output; do not use SSH or modify either node."

[[probes]]
id = "schema-and-content"
level = 2
targets = ["node1", "node2"]
max_exec_calls = 12
procedure = "On both nodes, collect the legacy_shop table list, table engines, columns, nullability, keys, and indexes. For each of customers, orders, order_items, and audit_events collect row counts and a deterministic SHA-256 digest of tab-separated rows sorted by all columns. Compare destination evidence to the prepared source baseline and confirm foreign keys and unique keys are present. Do not print passwords or modify data."

[[probes]]
id = "relational-integrity"
level = 4
targets = ["node2"]
max_exec_calls = 8
procedure = "Query the destination database to prove the migrated relationships and values: every order references an existing customer, every order has the expected sum of item quantities and prices, order totals match their item sums, all audit event entity references are meaningful, and the prepared edge statuses and timestamps are present. Also inspect the destination service's enabled state and configured data directory."

[[probes]]
id = "migration-hygiene"
level = 5
targets = ["node1", "node2"]
max_exec_calls = 12
procedure = "Inspect both nodes for migration-only dump archives, copied credential files, temporary database passwords, staging directories, ad-hoc transfer listeners or services, failed units, and scripts left in /root, /home, /tmp, /var/tmp, /opt, /usr/local/bin, and systemd unit locations. Treat the prepared source database and the destination MariaDB installation as required state. Confirm the source database row counts and content digests still equal its baseline. Do not delete anything during this probe."

[[probes]]
id = "destination-reboot"
level = 8
targets = ["node2"]
effect = "reboot"
max_exec_calls = 14
procedure = "Record node2's boot identity, MariaDB service state, table row counts, schema summary, relational-integrity query results, and content digests. Reboot node2 and wait for managed access without repair. Prove the boot identity changed, MariaDB is active and enabled, legacy_shop is available, all four table digests and row counts still match node1's prepared baseline, and the integrity queries still pass."
cleanup = "Wait for node2 and MariaDB to become reachable and active. Remove only evaluator-created transient comparison files, never database files or candidate-created migration artifacts."

[[assertions]]
id = "destination-platform-and-service"
probe = "destination-database"
dimension = "functionality"
points = 2
critical = true
pass_condition = "Node2 is Ubuntu 24.04 with MariaDB installed, active, enabled, and serving the legacy_shop database."
fail_condition = "Live evidence shows the destination has the wrong platform, MariaDB is unavailable, or legacy_shop is absent."

[[assertions]]
id = "database-tables-and-counts"
probe = "destination-database"
dimension = "functionality"
points = 3
critical = true
pass_condition = "The destination contains customers, orders, order_items, and audit_events with exactly the prepared source row counts."
fail_condition = "Any required table is absent or any destination row count differs from the prepared source baseline."

[[assertions]]
id = "schema-preserved"
probe = "schema-and-content"
dimension = "functionality"
points = 3
critical = true
pass_condition = "Destination columns, types, nullability, primary keys, unique keys, indexes, foreign keys, and InnoDB table engines match the prepared source schema."
fail_condition = "Concrete schema evidence shows missing, changed, or fabricated structure."

[[assertions]]
id = "data-content-preserved"
probe = "schema-and-content"
dimension = "functionality"
points = 4
critical = true
pass_condition = "All four destination table content digests match the prepared source digests, with no missing or extra row values."
fail_condition = "Any table digest differs from the prepared source baseline."

[[assertions]]
id = "relationships-and-values-preserved"
probe = "relational-integrity"
dimension = "functionality"
points = 3
critical = true
pass_condition = "Destination relationship and value queries pass for customer references, order item totals, statuses, timestamps, and audit entities."
fail_condition = "Any relationship is broken or any computed value, status, timestamp, or audit reference is altered."

[[assertions]]
id = "source-remains-authoritative"
probe = "migration-hygiene"
dimension = "operational_hygiene"
points = 3
critical = true
pass_condition = "Node1 remains an active Ubuntu 16.04 MariaDB source and its schema, row counts, and content digests are unchanged."
fail_condition = "The source was emptied, altered, disabled, or otherwise no longer matches the prepared baseline."

[[assertions]]
id = "migration-residue-absent"
probe = "migration-hygiene"
dimension = "operational_hygiene"
points = 2
pass_condition = "No migration dump, copied credential, temporary transfer service, staging directory, failed unit, or migration script remains in the inspected locations."
fail_condition = "Live evidence finds migration-only residue or exposed migration credentials."

[[assertions]]
id = "destination-survives-reboot"
probe = "destination-reboot"
dimension = "persistence"
points = 4
critical = true
pass_condition = "Node2 reboots successfully and MariaDB, the complete schema, all row counts, all content digests, and relational integrity remain correct afterward."
fail_condition = "The destination cannot reboot, MariaDB does not return enabled and active, or any migrated data or schema fails after reboot."
