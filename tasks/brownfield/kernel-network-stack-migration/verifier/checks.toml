schema_version = 1

[[probes]]
id = "modern-target-contract"
level = 1
targets = ["node1", "node2"]
max_exec_calls = 8
procedure = "Discover each node's default-route client interface and separate application-LAN interface from live routes and addresses. Confirm node2 is Ubuntu 24.04 on a 6.x kernel, retains predictable interface names rather than net.ifnames=0, and selects nftables-backed iptables. Resolve legacy-netapp.service.lan from both nodes and verify it names node2's application-facing address. From node1's application interface, request the target health endpoint."

[[probes]]
id = "migrated-endpoint-contract"
level = 2
targets = ["node1", "node2"]
max_exec_calls = 8
procedure = "From node1's application-facing interface, exercise legacy-netapp.service.lan on port 4180 and inspect the exact /health and /identity responses. On node2 inspect the listening socket and effective service state, proving the listener uses only the discovered application-facing IPv4 address rather than a wildcard, loopback, client-LAN, or IPv6 address."

[[probes]]
id = "migrated-network-boundary"
level = 2
targets = ["node1", "node2"]
max_exec_calls = 10
procedure = "First establish the positive application-LAN request from node1. Then make bounded requests explicitly sourced from node1's client-LAN address or interface and confirm they are denied. Inspect node2's live nftables-backed iptables rules, counters, persistent firewall hook, conntrack handling, and rate-limited deny logging. Confirm the allow rule is limited to the application interface, application subnet, node2 application address, TCP, and port 4180."

[[probes]]
id = "reuseport-worker-contract"
level = 3
targets = ["node1", "node2"]
max_exec_calls = 9
procedure = "Sample /worker often enough from node1's application interface to observe both and only worker=1 and worker=2. On node2 correlate the two distinct listener processes sharing the same application address and port with their service units, effective user, capabilities, and runtime configuration. Establish SO_REUSEPORT from the running implementation or socket configuration without stopping, replacing, or rebinding the service."

[[probes]]
id = "source-retirement-and-preservation"
level = 4
targets = ["node1", "node2"]
max_exec_calls = 9
procedure = "Confirm node1 remains Ubuntu 16.04 with its prepared 4.4 kernel, net.ifnames=0, and eth0/eth1 naming. Verify the legacy application source, site identity migration-cohort-44, configuration, launch helper, firewall helper, and unit definitions remain present with sensible ownership and modes, while legacy listener units and their application-specific firewall hook are inactive and disabled. Confirm node2 contains a coherent migrated implementation without destructive changes to unrelated host configuration."

[[probes]]
id = "migration-operational-state"
level = 5
targets = ["node1", "node2"]
max_exec_calls = 7
procedure = "Inspect failed units, duplicate or wildcard listeners, stale source firewall chains or hooks, conflicting name mappings, abandoned migration scripts, backups, temporary files, debug settings, unexpected privileged identities, unnecessary capabilities, enabled SSH, unrelated packages, and disabled host controls. Distinguish preserved legacy source artifacts required by the task from active obsolete runtime state."

[[probes]]
id = "target-migration-reboot"
level = 8
targets = ["node1", "node2"]
effect = "reboot"
max_exec_calls = 12
procedure = "Record node2's boot identity, service alias, application address, effective firewall boundary, and worker identities. Reboot node2, wait for network and service convergence without repair, and prove the boot identity changed. Recheck the alias, exact endpoint responses, both workers, application-only listener, nft-backed firewall behavior, and positive application-LAN and negative client-LAN requests."
cleanup = "Wait for node2 and the migrated service to converge and remove only evaluator-created transient files or connections, leaving application and firewall state unchanged."

[[probes]]
id = "source-retirement-reboot"
level = 10
targets = ["node1", "node2"]
effect = "reboot"
max_exec_calls = 12
procedure = "Record node1's boot identity, reboot node1, and wait for network convergence without repair. Prove the boot identity changed, the old listener and application firewall hook remain retired, the legacy artifacts remain intact, and node1 still reaches every required migrated endpoint only through its application-facing interface while the client-LAN attempt remains denied."
cleanup = "Wait for node1 and both LANs to converge and remove only evaluator-created transient files or connections."

[[assertions]]
id = "modern-network-platform-retained"
probe = "modern-target-contract"
dimension = "functionality"
points = 2
critical = true
pass_condition = "Node2 is Ubuntu 24.04 on a 6.x kernel, uses two predictable non-legacy interface names, does not boot with net.ifnames=0, and selects nftables-backed iptables."
fail_condition = "Live platform evidence confirms the wrong operating system or kernel, legacy eth-style naming, net.ifnames=0, a missing required interface, or legacy iptables selection."

[[assertions]]
id = "service-alias-targets-application-address"
probe = "modern-target-contract"
dimension = "functionality"
points = 2
critical = true
pass_condition = "Both nodes resolve legacy-netapp.service.lan to node2's discovered application-facing IPv4 address."
fail_condition = "Live name and interface evidence confirms inconsistent resolution or an address on node1, loopback, or node2's client LAN."

[[assertions]]
id = "migrated-health-endpoint-works"
probe = "modern-target-contract"
dimension = "functionality"
points = 2
critical = true
pass_condition = "A request sourced from node1's application-facing interface reaches legacy-netapp.service.lan:4180 and /health returns exactly legacy-netapp-ok."
fail_condition = "A correctly sourced live request confirms the migrated health endpoint is unreachable or returns incompatible content."

[[assertions]]
id = "migrated-identity-preserved"
probe = "migrated-endpoint-contract"
dimension = "functionality"
points = 2
critical = true
pass_condition = "The migrated /identity endpoint returns exactly migration-cohort-44 through the application LAN."
fail_condition = "A correctly sourced live request confirms the identity endpoint is missing or returns a different identity."

[[assertions]]
id = "listener-uses-only-application-address"
probe = "migrated-endpoint-contract"
dimension = "functionality"
points = 2
critical = true
pass_condition = "The port-4180 listeners bind only node2's discovered application-facing IPv4 address and required service units are active."
fail_condition = "Live socket evidence confirms no required listener, an inactive required unit, or binding on wildcard, loopback, client-LAN, or IPv6 addresses."

[[assertions]]
id = "application-lan-allowed-client-lan-denied"
probe = "migrated-network-boundary"
dimension = "security"
points = 2
critical = true
pass_condition = "A correctly sourced application-LAN request succeeds and a correctly sourced client-LAN request to port 4180 is rejected."
fail_condition = "Controlled requests confirm the application LAN is blocked or the client LAN can reach the service."

[[assertions]]
id = "stateful-bounded-firewall-preserved"
probe = "migrated-network-boundary"
dimension = "security"
points = 2
critical = true
pass_condition = "Node2's persistent nft-backed policy scopes new port-4180 traffic to the application interface, subnet, and destination, handles established/related and invalid state, and rate-limits deny logging before rejection."
fail_condition = "Effective rules and behavior confirm overly broad allowance, missing state handling, unbounded deny logging, absent final denial, legacy backend selection, or nonpersistent policy."

[[assertions]]
id = "two-reuseport-workers-serve"
probe = "reuseport-worker-contract"
dimension = "functionality"
points = 3
critical = true
pass_condition = "Repeated live requests observe both and only worker=1 and worker=2, backed by two distinct processes sharing node2's application address and port through SO_REUSEPORT."
fail_condition = "Sufficient live sampling and process/socket evidence confirms a worker is missing, an unexpected worker responds, processes do not share the listener, or SO_REUSEPORT is not used."

[[assertions]]
id = "workers-run-without-unnecessary-privilege"
probe = "reuseport-worker-contract"
dimension = "security"
points = 1
pass_condition = "Both application workers run as an appropriate unprivileged identity without unnecessary capabilities or privilege escalation."
fail_condition = "Concrete process and service evidence confirms a worker runs as root or retains unnecessary capabilities or escalation rights."

[[assertions]]
id = "legacy-platform-and-artifacts-preserved"
probe = "source-retirement-and-preservation"
dimension = "operational_hygiene"
points = 1
pass_condition = "Node1 retains the prepared Ubuntu 16.04, 4.4-kernel, eth0/eth1, net.ifnames=0 platform and its legacy application, identity, configuration, helpers, and unit definitions with sensible protections."
fail_condition = "Live evidence confirms the legacy platform contract or required source artifacts were destructively changed, removed, or exposed."

[[assertions]]
id = "legacy-runtime-retired"
probe = "source-retirement-and-preservation"
dimension = "operational_hygiene"
points = 1
critical = true
pass_condition = "Node1 has no active or enabled legacy application worker, no port-4180 listener, and no active application-specific firewall hook while remaining usable as a client."
fail_condition = "Live evidence confirms an old worker, listener, enablement, or firewall hook remains active, or node1 was made unusable as a client."

[[assertions]]
id = "migration-state-clean"
probe = "migration-operational-state"
dimension = "operational_hygiene"
points = 1
pass_condition = "Both systems contain only coherent required legacy-preservation, migrated-service, naming, firewall, and host-control state."
fail_condition = "Concrete failed, duplicate, wildcard, stale, conflicting, privileged, temporary, debug, backup, or abandoned executor state remains."

[[assertions]]
id = "target-service-persists-after-reboot"
probe = "target-migration-reboot"
dimension = "persistence"
points = 3
critical = true
pass_condition = "Node2's boot identity changes and the alias, exact health and identity responses, and both SO_REUSEPORT workers recover automatically without repair."
fail_condition = "A completed node2 reboot loses the migrated endpoint contract or worker model or requires manual repair."

[[assertions]]
id = "target-boundary-persists-after-reboot"
probe = "target-migration-reboot"
dimension = "persistence"
points = 2
critical = true
pass_condition = "After node2 reboots, the application-only listener, predictable interfaces, nft-backed persistent firewall, allowed application-LAN path, and denied client-LAN path remain correct."
fail_condition = "A completed node2 reboot changes the listener scope, network-stack selection, firewall behavior, or LAN access boundary."

[[assertions]]
id = "source-retirement-persists-after-reboot"
probe = "source-retirement-reboot"
dimension = "persistence"
points = 2
critical = true
pass_condition = "Node1's boot identity changes and its old listener and application firewall hook remain retired while required legacy files remain intact."
fail_condition = "A completed node1 reboot reactivates legacy runtime state or loses required preserved artifacts."

[[assertions]]
id = "complete-migration-persists-after-reboots"
probe = "source-retirement-reboot"
dimension = "persistence"
points = 2
critical = true
pass_condition = "After both systems have rebooted, node1 reaches the exact migrated endpoints through the application LAN and remains denied through the client LAN without additional repair."
fail_condition = "After completed sequential reboots, the migrated application path or access boundary does not recover automatically."
