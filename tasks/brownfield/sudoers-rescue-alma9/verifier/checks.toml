schema_version = 1

[[probes]]
id = "sudoers-recovery-smoke"
level = 1
targets = ["node1"]
max_exec_calls = 4
procedure = "Validate the complete sudo policy with visudo and inspect /etc/sudoers for the prepared invalid entry. Confirm the policy parses and the invalid BROKEN SUDOERS ENTRY is gone without modifying any policy."

[[probes]]
id = "administrative-operation"
level = 2
targets = ["node1"]
max_exec_calls = 6
procedure = "Inspect the default and active systemd targets and current operating state. Through a non-interactive identity switch, execute sudo -n as the existing opsadmin account and prove it can run an administrative identity command as UID 0. Confirm managed exec remains available and the host is in normal multi-user operation rather than rescue or emergency mode."

[[probes]]
id = "sudo-security-contract"
level = 2
targets = ["node1"]
max_exec_calls = 7
procedure = "Inspect effective sudo authorization for opsadmin, ownership and modes of /etc/sudoers and relevant included fragments, include handling, UID-zero accounts, opsadmin groups and account status, SELinux state, and firewalld state. Confirm the repaired policy grants only the prepared opsadmin authorization and introduces no additional privileged identity or writable policy path."

[[probes]]
id = "sudo-brownfield-preservation"
level = 3
targets = ["node1"]
max_exec_calls = 5
procedure = "Confirm /srv/operations/keep.txt retains exactly the declared operations record with opsadmin ownership and mode 0640. Inspect opsadmin's UID, primary and supplementary groups, home, shell, and the 90-opsadmin policy semantics, plus root account lock status, for coherent preservation of the prepared administrative state."

[[probes]]
id = "sudo-recovery-hygiene"
level = 5
targets = ["node1"]
max_exec_calls = 8
procedure = "Inspect failed units, default-target and kernel boot overrides, rescue or emergency dependencies other than the preparation-owned vsock-agent rescue link, stale transient recovery units, sudoers backups or repair files, duplicate policy fragments, unexpected users or group changes, temporary credentials, scripts, debug artifacts, unnecessary packages or services, conflicting configuration, and provider-management availability."

[[probes]]
id = "sudo-recovery-reboot"
level = 8
targets = ["node1"]
effect = "reboot"
max_exec_calls = 12
procedure = "Record node1's boot identity and recovered operating state, reboot it, wait for managed access and normal target convergence without repair, and prove the boot identity changed. Revalidate the complete sudo policy, non-interactive opsadmin sudo, default and active multi-user state, SELinux enforcement, enabled active firewalld, opsadmin identity and authorization, root account status, and preserved operations record."
cleanup = "Wait for node1, multi-user.target, firewalld, and managed access to converge and remove only evaluator-created transient files if any."

[[assertions]]
id = "sudoers-policy-valid"
probe = "sudoers-recovery-smoke"
dimension = "functionality"
points = 3
critical = true
pass_condition = "visudo validates the complete effective sudo policy and the prepared invalid entry is absent."
fail_condition = "A complete visudo validation fails or the invalid BROKEN SUDOERS ENTRY remains in effective policy."

[[assertions]]
id = "opsadmin-sudo-operational"
probe = "administrative-operation"
dimension = "functionality"
points = 3
critical = true
pass_condition = "The existing opsadmin account successfully performs a non-interactive sudo command as UID 0."
fail_condition = "A correctly executed non-interactive identity-switch test confirms opsadmin cannot use its required sudo authorization."

[[assertions]]
id = "normal-multi-user-operation-restored"
probe = "administrative-operation"
dimension = "functionality"
points = 3
critical = true
pass_condition = "multi-user.target is the default and active normal operating target, rescue and emergency modes are not active, and managed access works."
fail_condition = "Live systemd evidence confirms rescue or emergency operation persists, multi-user is not the default active state, or the host is not manageable."

[[assertions]]
id = "sudo-policy-protected-and-bounded"
probe = "sudo-security-contract"
dimension = "security"
points = 2
critical = true
pass_condition = "Effective sudo policy and includes are root-controlled and not group- or world-writable, and opsadmin has its prepared authorization without an additional unrelated grant."
fail_condition = "Effective authorization or file evidence confirms unsafe policy permissions, duplicate or broader authorization, or a missing required opsadmin grant."

[[assertions]]
id = "privileged-identities-controlled"
probe = "sudo-security-contract"
dimension = "security"
points = 1
pass_condition = "No additional UID-zero or unnecessary privileged account exists, opsadmin remains the intended administrative identity, and root account status is coherent with the recovered system."
fail_condition = "Concrete account evidence confirms an unexpected UID-zero identity, unnecessary privilege, or unsafe account-state change."

[[assertions]]
id = "sudo-host-controls-active"
probe = "sudo-security-contract"
dimension = "security"
points = 1
critical = true
pass_condition = "SELinux is enforcing and firewalld is enabled and active."
fail_condition = "Live evidence confirms SELinux is not enforcing or firewalld is disabled or inactive."

[[assertions]]
id = "operations-data-preserved"
probe = "sudo-brownfield-preservation"
dimension = "operational_hygiene"
points = 2
critical = true
pass_condition = "/srv/operations/keep.txt retains the declared existing operations record, opsadmin ownership, and mode 0640."
fail_condition = "Live content or metadata evidence confirms the operations record was removed, altered, or exposed."

[[assertions]]
id = "opsadmin-state-preserved"
probe = "sudo-brownfield-preservation"
dimension = "functionality"
points = 1
pass_condition = "opsadmin's identity, wheel membership, home, shell, and prepared NOPASSWD administrative policy remain coherent and usable."
fail_condition = "Live identity or policy evidence confirms a required prepared property was lost or altered incompatibly."

[[assertions]]
id = "sudo-recovery-state-clean"
probe = "sudo-recovery-hygiene"
dimension = "operational_hygiene"
points = 2
pass_condition = "Only coherent required sudo, account, operations-data, normal-boot, security-control, and provider-management state remains."
fail_condition = "Concrete failed, recovery-only, backup, duplicate, temporary, debug, privileged, credential-bearing, or conflicting executor state remains beyond the declared provider rescue link."

[[assertions]]
id = "sudo-normal-state-persists"
probe = "sudo-recovery-reboot"
dimension = "persistence"
points = 3
critical = true
pass_condition = "Node1's boot identity changes and it automatically returns to manageable multi-user operation with valid sudoers and working non-interactive opsadmin sudo."
fail_condition = "A completed reboot returns to recovery mode, loses managed access or sudo validity, or requires manual repair."

[[assertions]]
id = "sudo-security-persists"
probe = "sudo-recovery-reboot"
dimension = "persistence"
points = 2
critical = true
pass_condition = "After reboot the protected opsadmin authorization, account state, root status, SELinux enforcement, and enabled active firewalld remain correct."
fail_condition = "A completed reboot weakens or loses a required policy, identity, SELinux, or firewall property."

[[assertions]]
id = "sudo-brownfield-data-persists"
probe = "sudo-recovery-reboot"
dimension = "persistence"
points = 1
pass_condition = "After reboot the existing operations record remains unchanged with its required ownership and permissions."
fail_condition = "A completed reboot loses, alters, or exposes the existing operations record."
