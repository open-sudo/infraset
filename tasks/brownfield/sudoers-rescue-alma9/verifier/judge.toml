reasoning_effort = "medium"
timeout_sec = 900
allow_ssh_probes = false
parallel_node_collection = true
node_collector_timeout_sec = 240
node_collector_command_budget = 10

[dimensions.functionality]
weight = 0.35
description = "Verify on node1 that the complete sudo policy parses successfully, the invalid entry is gone, and the system has returned from its prepared single-user state to an active multi-user target. Exercise the existing opsadmin identity directly and prove it can still perform non-interactive administrative commands through sudo. Confirm the host remains manageable throughout evaluation. Accept any secure repair that satisfies the declared outcome while preserving the established opsadmin authorization from the preparation baseline."

[dimensions.security]
weight = 0.25
description = "Inspect effective sudo policy, ownership, modes, include handling, privileged identities, and account state. Confirm /etc/sudoers and relevant fragments are root-controlled and not group- or world-writable, opsadmin has only its prepared authorization, no additional UID-zero or unnecessary privileged account was introduced, and the root account status matches the baseline. Verify SELinux is enforcing and firewalld is enabled and active. Treat the baseline rescue-target vsock-agent dependency as provider management plumbing rather than executor-created exposure, while checking for other unnecessary listeners, credentials, keys, permissive files, or weakened controls."

[dimensions.persistence]
weight = 0.25
description = "Record the current boot identity, reboot node1 once, wait for managed exec to return, and prove the boot identity changed. After reboot, repeat the functional and security tests: multi-user.target must be the default and active operating target, sudoers must parse, opsadmin sudo must work, SELinux must enforce, firewalld must be enabled and active, and the prepared opsadmin identity, sudo authorization, root account status, and /srv/operations/keep.txt must remain consistent with the baseline."

[dimensions.operational_hygiene]
weight = 0.15
description = "Compare the recovered system with the preparation baseline and inspect it after the evaluator reboot. Verify /srv/operations/keep.txt and the opsadmin identity and policy were preserved. Look for failed units, rescue or emergency boot overrides, stale transient recovery units, sudoers backup or repair files, duplicate policy fragments, unexpected users or group changes, temporary credentials, abandoned scripts, debug artifacts, unnecessary packages or services, and conflicting configuration. The preparation-created rescue.target dependency for vsock-agent is expected baseline state and is not operational residue."
