timeout_sec = 180

[[observations]]
id = "prepared-recovery-state"
stage = 10
node = "node1"
command = '''
set -eu
printf 'default=%s\n' "$(systemctl get-default)"
printf 'rescue=%s\n' "$(systemctl is-active rescue.target)"
printf 'management=%s\n' "$(systemctl is-active vsock-agent.service)"
if visudo -cf /etc/sudoers >/dev/null 2>&1; then
  exit 1
fi
printf '%s\n' 'sudoers=invalid'
'''
required = true

[[observations]]
id = "opsadmin-policy-hash"
stage = 10
node = "node1"
command = "sha256sum /etc/sudoers.d/90-opsadmin"
required = true

[[observations]]
id = "operations-data-hash"
stage = 10
node = "node1"
command = "sha256sum /srv/operations/keep.txt"
required = true

[[observations]]
id = "opsadmin-identity"
stage = 10
node = "node1"
command = "id opsadmin"
required = true

[[observations]]
id = "root-account-status"
stage = 10
node = "node1"
command = "passwd -S root"
required = true

[[observations]]
id = "recovery-management-link"
stage = 10
node = "node1"
command = "readlink -f /etc/systemd/system/rescue.target.wants/vsock-agent.service"
required = true
