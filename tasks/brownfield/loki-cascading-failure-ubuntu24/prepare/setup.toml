timeout_sec = 720

[[steps]]
id = "prepare-observability-prerequisites"
stage = 10
node = "node1"
retries = 3
retry_delay_sec = 10
command = '''
set -eu
export DEBIAN_FRONTEND=noninteractive
apt-get -o Acquire::Retries=5 update -qq
apt-get -o Acquire::Retries=5 install -y -qq ca-certificates curl jq openssl ufw unzip >/dev/null

sed -i '/# BEGIN INFRASET CLUSTER HOSTS/,/# END INFRASET CLUSTER HOSTS/d' /etc/hosts
printf '# BEGIN INFRASET CLUSTER HOSTS\n%s\n# END INFRASET CLUSTER HOSTS\n' "$CLUSTER_HOSTS" >> /etc/hosts
getent group loki >/dev/null 2>&1 || groupadd --system loki
id loki >/dev/null 2>&1 || useradd --system --gid loki --home-dir /var/lib/loki --shell /usr/sbin/nologin loki
install -d -o root -g loki -m 0750 /etc/loki
install -d -o loki -g loki -m 0750 /var/lib/loki /var/lib/loki/chunks /var/lib/loki/rules
'''

[[steps]]
id = "install-loki"
stage = 20
node = "node1"
retries = 3
retry_delay_sec = 5
command = '''
set -eu
if ! printf '%s  %s\n' \
    '4449378c6e74281e99163dec9cca70479b6095d139c0403042f59bd962ec8791' \
    '/tmp/loki-linux-amd64.zip' | sha256sum --check --status 2>/dev/null; then
  if ! curl --fail --location --retry 5 --retry-all-errors \
      --continue-at - \
      --output /tmp/loki-linux-amd64.zip \
      https://github.com/grafana/loki/releases/download/v3.4.2/loki-linux-amd64.zip; then
    rm -f /tmp/loki-linux-amd64.zip
    curl --fail --location --retry 5 --retry-all-errors \
      --output /tmp/loki-linux-amd64.zip \
      https://github.com/grafana/loki/releases/download/v3.4.2/loki-linux-amd64.zip
  fi
fi
printf '%s  %s\n' \
  '4449378c6e74281e99163dec9cca70479b6095d139c0403042f59bd962ec8791' \
  '/tmp/loki-linux-amd64.zip' | sha256sum --check --status
rm -rf /tmp/infraset-loki-install
install -d -m 0755 /tmp/infraset-loki-install
unzip -q /tmp/loki-linux-amd64.zip -d /tmp/infraset-loki-install
install -o root -g root -m 0755 /tmp/infraset-loki-install/loki-linux-amd64 /usr/local/bin/loki

cat > /etc/loki/config.yaml <<'LOKI_CONFIG'
auth_enabled: false

server:
  http_listen_address: 0.0.0.0
  http_listen_port: 3100
  grpc_listen_address: 127.0.0.1
  grpc_listen_port: 9096
  log_level: info

common:
  instance_addr: 127.0.0.1
  path_prefix: /var/lib/loki
  storage:
    filesystem:
      chunks_directory: /var/lib/loki/chunks
      rules_directory: /var/lib/loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

analytics:
  reporting_enabled: false
LOKI_CONFIG
chown root:loki /etc/loki/config.yaml
chmod 0640 /etc/loki/config.yaml
cat > /etc/systemd/system/loki.service <<'LOKI_UNIT'
[Unit]
Description=InfraSet Loki service
After=network-online.target
Wants=network-online.target

[Service]
Type=simple
User=loki
Group=loki
ExecStart=/usr/local/bin/loki -config.file=/etc/loki/config.yaml
Restart=on-failure
RestartSec=3
NoNewPrivileges=true
PrivateTmp=true
ProtectHome=true
ProtectSystem=strict
ReadWritePaths=/var/lib/loki

[Install]
WantedBy=multi-user.target
LOKI_UNIT
rm -rf /tmp/infraset-loki-install /tmp/loki-linux-amd64.zip
'''

[[steps]]
id = "install-and-configure-grafana"
stage = 20
node = "node1"
retries = 3
retry_delay_sec = 5
command = '''
set -eu
export DEBIAN_FRONTEND=noninteractive
if ! printf '%s  %s\n' \
    'c5159ce58c1eb7b4a47474951f0334055dd1a4b3325ffc432ef1761da6474b2a' \
    '/tmp/grafana.deb' | sha256sum --check --status 2>/dev/null; then
  if ! curl --fail --location --retry 5 --retry-all-errors \
      --continue-at - \
      --output /tmp/grafana.deb \
      https://dl.grafana.com/oss/release/grafana_11.6.0_amd64.deb; then
    rm -f /tmp/grafana.deb
    curl --fail --location --retry 5 --retry-all-errors \
      --output /tmp/grafana.deb \
      https://dl.grafana.com/oss/release/grafana_11.6.0_amd64.deb
  fi
fi
printf '%s  %s\n' \
  'c5159ce58c1eb7b4a47474951f0334055dd1a4b3325ffc432ef1761da6474b2a' \
  '/tmp/grafana.deb' | sha256sum --check --status
apt-get -o Acquire::Retries=5 install -y -qq /tmp/grafana.deb >/dev/null

install -d -o root -g grafana -m 0750 /etc/grafana
if ! test -s /etc/grafana/infraset-admin.env; then
  umask 077
  grafana_password="$(openssl rand -hex 24)"
  printf 'GF_SECURITY_ADMIN_USER=admin\nGF_SECURITY_ADMIN_PASSWORD=%s\nGF_SERVER_HTTP_ADDR=127.0.0.1\nGF_SERVER_HTTP_PORT=3000\n' \
    "$grafana_password" > /etc/grafana/infraset-admin.env
fi
chown root:grafana /etc/grafana/infraset-admin.env
chmod 0640 /etc/grafana/infraset-admin.env
install -d -o root -g root -m 0755 /etc/systemd/system/grafana-server.service.d
cat > /etc/systemd/system/grafana-server.service.d/infraset.conf <<'GRAFANA_UNIT'
[Service]
EnvironmentFile=/etc/grafana/infraset-admin.env
GRAFANA_UNIT
install -d -o root -g grafana -m 0750 /etc/grafana/provisioning/datasources
cat > /etc/grafana/provisioning/datasources/infraset-loki.yaml <<'GRAFANA_DATASOURCE'
apiVersion: 1
datasources:
  - name: Loki
    uid: infraset-loki
    type: loki
    access: proxy
    url: http://127.0.0.1:3100
    isDefault: true
    editable: false
GRAFANA_DATASOURCE
chown root:grafana /etc/grafana/provisioning/datasources/infraset-loki.yaml
chmod 0640 /etc/grafana/provisioning/datasources/infraset-loki.yaml
rm -f /tmp/grafana.deb
'''

[[steps]]
id = "start-and-secure-observability"
stage = 30
node = "node1"
retries = 2
retry_delay_sec = 5
command = '''
set -eu
systemctl daemon-reload
systemctl enable loki.service grafana-server.service >/dev/null
systemctl restart loki.service grafana-server.service
timeout 180 sh -c 'until curl -fsS http://127.0.0.1:3100/ready >/dev/null; do sleep 2; done'
timeout 180 sh -c 'until curl -fsS http://127.0.0.1:3000/api/health | jq -e '\''[.database,.version] | all(type == "string" and length > 0)'\'' >/dev/null; do sleep 2; done'
systemctl is-active --quiet loki.service
systemctl is-active --quiet grafana-server.service
systemctl disable --now ssh.socket ssh.service 2>/dev/null || true
node2_ip="$(getent ahostsv4 node2 | awk 'NR == 1 {print $1}')"
node3_ip="$(getent ahostsv4 node3 | awk 'NR == 1 {print $1}')"
node4_ip="$(getent ahostsv4 node4 | awk 'NR == 1 {print $1}')"
ufw --force reset >/dev/null
ufw default deny incoming >/dev/null
ufw default allow outgoing >/dev/null
ufw allow from "$node2_ip" to any port 3100 proto tcp >/dev/null
ufw allow from "$node3_ip" to any port 3100 proto tcp >/dev/null
ufw allow from "$node4_ip" to any port 3100 proto tcp >/dev/null
ufw --force enable >/dev/null
'''

