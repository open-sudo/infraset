[[steps]]
id = "verify-healthy-chain-before-incident"
stage = 40
node = "node1"
command = "curl -fsS http://node4:18083/health | grep -Fq '\"status\":\"ok\"'"

[[steps]]
id = "inject-originating-node2-failure"
stage = 50
node = "node2"
command = '''
set -eu
sed -i '/server_name _;/a\    upstream_timeoutx 5s;' /etc/nginx/sites-available/infraset-cascade.conf
if nginx -t >/run/INC-042-node2.log 2>&1; then
  exit 1
fi
systemctl restart nginx.service >/dev/null 2>&1 || true
! systemctl is-active --quiet nginx.service
timestamp="$(date +%s%N)"
line="$(tr '\n' ' ' < /run/INC-042-node2.log)"
payload="$(jq -cn --arg timestamp "$timestamp" --arg line "$line" '{streams:[{stream:{job:"infraset-cascade",incident:"INC-042",host:"node2",service:"catalog-api",event:"configuration_error"},values:[[$timestamp,$line]]}]}')"
curl -fsS -H 'Content-Type: application/json' -X POST --data "$payload" http://node1:3100/loki/api/v1/push
rm -f /run/INC-042-node2.log
'''

[[steps]]
id = "record-node3-dependent-failure"
stage = 60
node = "node3"
command = '''
set -eu
sleep 2
status="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18082/health || true)"
test "$status" != 200
timestamp="$(date +%s%N)"
line="incident=INC-042 level=error dependency=node2:18081 status=${status:-000} message=upstream_catalog_unavailable"
payload="$(jq -cn --arg timestamp "$timestamp" --arg line "$line" '{streams:[{stream:{job:"infraset-cascade",incident:"INC-042",host:"node3",service:"orders-api",event:"dependency_error"},values:[[$timestamp,$line]]}]}')"
curl -fsS -H 'Content-Type: application/json' -X POST --data "$payload" http://node1:3100/loki/api/v1/push
'''

[[steps]]
id = "record-node4-dependent-failure"
stage = 70
node = "node4"
command = '''
set -eu
sleep 2
status="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18083/health || true)"
test "$status" != 200
timestamp="$(date +%s%N)"
line="incident=INC-042 level=error dependency=node3:18082 status=${status:-000} message=upstream_orders_unavailable"
payload="$(jq -cn --arg timestamp "$timestamp" --arg line "$line" '{streams:[{stream:{job:"infraset-cascade",incident:"INC-042",host:"node4",service:"checkout-api",event:"dependency_error"},values:[[$timestamp,$line]]}]}')"
curl -fsS -H 'Content-Type: application/json' -X POST --data "$payload" http://node1:3100/loki/api/v1/push
'''

[[steps]]
id = "verify-prepared-loki-timeline"
stage = 80
node = "node1"
retries = 15
retry_delay_sec = 2
command = '''
set -eu
body="$(curl -fsSG http://127.0.0.1:3100/loki/api/v1/query_range --data-urlencode 'query={job="infraset-cascade",incident="INC-042"}' --data-urlencode 'since=1h' --data-urlencode 'direction=forward' --data-urlencode 'limit=20')"
printf '%s' "$body" | jq -e '
  .status == "success" and
  ([.data.result[] as $stream | $stream.values[] |
    {timestamp: .[0], host: $stream.stream.host}] | length) >= 3 and
  ([.data.result[] as $stream | $stream.values[] |
    {timestamp: .[0], host: $stream.stream.host}] | sort_by(.timestamp) | .[0].host) == "node2"
' >/dev/null
'''
