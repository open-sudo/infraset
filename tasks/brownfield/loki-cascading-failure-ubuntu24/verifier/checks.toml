schema_version = 1

[[probes]]
id = "cascade-service-contract"
level = 1
targets = ["node1", "node2", "node3", "node4"]
max_exec_calls = 8
procedure = "Discover the live addresses used by the declared service path. On each service node verify its local health endpoint, and from node1 verify the complete path through checkout-api. Capture response bodies and service state so a downstream proxy returning a cached, synthetic, or unhealthy response is not mistaken for a healthy dependency chain."

[[probes]]
id = "incident-correlation"
level = 2
targets = ["node1"]
max_exec_calls = 8
procedure = "Verify Loki and Grafana readiness. Query Loki for incident INC-042 over an explicit range that includes the retained incident, expand all returned streams into individual nanosecond timestamped events, and globally order them rather than relying on stream order. Establish the earliest relevant event, its host, service, event label, and complete message. Inspect /root/INC-042-report.txt without modifying it and compare its originating node, timestamp, and initiating error with that live Loki evidence. Confirm the original node2, node3, and node4 incident events remain queryable."

[[probes]]
id = "cascade-security-boundaries"
level = 2
targets = ["node1", "node2", "node3", "node4"]
max_exec_calls = 10
procedure = "Inspect effective listeners, process identities, AppArmor state, persistent host firewall policy, SSH state, and permissions of the incident report and Grafana credentials. Exercise the intended node1-to-node4, node4-to-node3, node3-to-node2, and service-node-to-Loki paths and bounded negative attempts for bypass access to upstream tiers and remote Grafana administration. Distinguish a rejected path from a test that used the wrong address or interface."

[[probes]]
id = "cascade-repair-preservation"
level = 3
targets = ["node2", "node3", "node4"]
max_exec_calls = 8
procedure = "Validate node2's effective Nginx configuration and confirm the incident-causing upstream_timeoutx directive is absent. Inspect node3 and node4's effective proxy relationships and required ports without requiring a particular formatting or file layout. Confirm the catalog still reports version 7 with exactly the existing alpha, bravo, and charlie records and that required files retain sensible ownership and modes."

[[probes]]
id = "cascade-operational-state"
level = 5
targets = ["node1", "node2", "node3", "node4"]
max_exec_calls = 8
procedure = "Inspect failed units, duplicate or conflicting listeners, disabled controls, enabled SSH, new privileged identities, unrelated packages or services, backup copies of the broken configuration, temporary Loki query output, abandoned repair scripts, debug state, and exposed credentials. Treat retained Loki incident history, normal service logs, the repaired site configuration, catalog data, and the required incident report as legitimate state."

[[probes]]
id = "observability-and-origin-reboots"
level = 8
targets = ["node1", "node2"]
effect = "reboot"
max_exec_calls = 12
procedure = "Record boot identities and the ordered INC-042 evidence. Reboot node1 and wait for Grafana and Loki to become ready without repair; verify its boot identity changed and the original ordered incident history and report remain. Then reboot node2, wait for automatic recovery, verify its boot identity changed, and confirm catalog health and preserved catalog records."
cleanup = "Wait for node1 and node2 and all required services to converge, remove only evaluator-created transient files if any, and leave incident history, the report, and application data unchanged."

[[probes]]
id = "downstream-and-complete-path-reboots"
level = 10
targets = ["node1", "node3", "node4"]
effect = "reboot"
max_exec_calls = 12
procedure = "Record node3 and node4 boot identities. Reboot node3 and node4 sequentially, waiting for each service to recover automatically before continuing. Verify both boot identities changed, orders-api and checkout-api recovered, node1 again receives a healthy response through the complete request path, and the retained incident evidence remains queryable."
cleanup = "Wait for node3 and node4 and the complete request path to converge and remove only evaluator-created transient files if any."

[[assertions]]
id = "catalog-api-healthy"
probe = "cascade-service-contract"
dimension = "functionality"
points = 2
critical = true
pass_condition = "Node2's live catalog-api health endpoint on port 18081 returns the declared healthy response."
fail_condition = "A correctly targeted live request confirms catalog-api is unavailable, unhealthy, or serving an incompatible health response."

[[assertions]]
id = "orders-api-healthy"
probe = "cascade-service-contract"
dimension = "functionality"
points = 1
critical = true
pass_condition = "Node3's live orders-api health endpoint on port 18082 succeeds while using the catalog dependency."
fail_condition = "A correctly targeted live request confirms orders-api is unavailable, unhealthy, or cannot use its catalog dependency."

[[assertions]]
id = "checkout-api-healthy"
probe = "cascade-service-contract"
dimension = "functionality"
points = 1
critical = true
pass_condition = "Node4's live checkout-api health endpoint on port 18083 succeeds while using the orders dependency."
fail_condition = "A correctly targeted live request confirms checkout-api is unavailable, unhealthy, or cannot use its orders dependency."

[[assertions]]
id = "complete-request-path-healthy"
probe = "cascade-service-contract"
dimension = "functionality"
points = 2
critical = true
pass_condition = "A fresh request from node1 through node4 reaches the complete checkout-to-orders-to-catalog path and returns the declared healthy response."
fail_condition = "A correctly sourced fresh request from node1 confirms the complete dependency path is unavailable or unhealthy."

[[assertions]]
id = "incident-timeline-correct"
probe = "incident-correlation"
dimension = "functionality"
points = 2
critical = true
pass_condition = "A global nanosecond ordering of retained INC-042 events proves node2's catalog-api configuration_error containing the invalid upstream_timeoutx directive is the earliest relevant event, followed by dependency failures on node3 and node4."
fail_condition = "Complete live Loki evidence proves the incident is missing, incorrectly ordered, lacks a required node event, or identifies a different initiating event."

[[assertions]]
id = "incident-report-accurate"
probe = "incident-correlation"
dimension = "functionality"
points = 2
critical = true
pass_condition = "/root/INC-042-report.txt exists and accurately records node2, the exact earliest relevant Loki timestamp, and the initiating invalid-directive error established from the live timeline."
fail_condition = "The report is absent or live Loki evidence confirms its node, timestamp, or initiating error is wrong."

[[assertions]]
id = "observability-ready-and-history-retained"
probe = "incident-correlation"
dimension = "functionality"
points = 1
pass_condition = "Grafana and Loki are ready and Loki still returns the original incident events from all three service nodes."
fail_condition = "Live readiness and query evidence confirms Grafana or Loki is unavailable or the original three-node incident history was lost."

[[assertions]]
id = "cascade-network-boundaries-effective"
probe = "cascade-security-boundaries"
dimension = "security"
points = 2
critical = true
pass_condition = "The intended dependency and log-ingestion paths work while bypass access to upstream tiers, remote Grafana administration, SSH, and unintended listeners is effectively denied."
fail_condition = "Controlled live attempts confirm a required path is blocked or an undeclared bypass, remote administration, SSH, or unintended listener is exposed."

[[assertions]]
id = "cascade-host-controls-and-secrets-protected"
probe = "cascade-security-boundaries"
dimension = "security"
points = 2
pass_condition = "AppArmor and persistent host firewall controls are active, service workers are appropriately unprivileged, and the report and Grafana credentials are protected from ordinary users."
fail_condition = "Concrete live evidence confirms a disabled control, unnecessarily privileged worker, or ordinary-user access to protected report or credential material."

[[assertions]]
id = "origin-configuration-repaired"
probe = "cascade-repair-preservation"
dimension = "operational_hygiene"
points = 1
critical = true
pass_condition = "Node2's effective Nginx configuration validates and no longer contains the incident-causing upstream_timeoutx directive."
fail_condition = "Live configuration evidence confirms the invalid directive remains, validation fails, or a conflicting broken site is still active."

[[assertions]]
id = "downstream-proxy-contract-preserved"
probe = "cascade-repair-preservation"
dimension = "operational_hygiene"
points = 1
pass_condition = "Node3 and node4 retain coherent orders-to-catalog and checkout-to-orders proxy relationships on the declared ports without unrelated replacement configuration."
fail_condition = "Effective configuration confirms a required downstream relationship was removed, redirected incorrectly, or replaced by unrelated or conflicting state."

[[assertions]]
id = "catalog-data-preserved"
probe = "cascade-repair-preservation"
dimension = "operational_hygiene"
points = 1
critical = true
pass_condition = "The catalog remains version 7 with exactly the alpha, bravo, and charlie records and sensible protected file ownership and modes."
fail_condition = "Live catalog evidence confirms its version, record set, ownership, or protection was changed incompatibly."

[[assertions]]
id = "cascade-state-clean"
probe = "cascade-operational-state"
dimension = "operational_hygiene"
points = 1
pass_condition = "Only coherent required observability, service, incident, report, security-control, and package state remains on the four nodes."
fail_condition = "Concrete failed, duplicate, conflicting, privileged, secret-bearing, temporary, debug, backup, or abandoned executor state remains."

[[assertions]]
id = "observability-persists-after-reboot"
probe = "observability-and-origin-reboots"
dimension = "persistence"
points = 2
critical = true
pass_condition = "Node1's boot identity changes and Grafana, Loki, the original ordered INC-042 history, and the accurate report recover automatically without repair."
fail_condition = "A completed node1 reboot loses observability readiness, incident evidence, report accuracy, or requires manual repair."

[[assertions]]
id = "catalog-persists-after-reboot"
probe = "observability-and-origin-reboots"
dimension = "persistence"
points = 2
critical = true
pass_condition = "Node2's boot identity changes and catalog-api plus the version-7 catalog records recover automatically without repair."
fail_condition = "A completed node2 reboot loses catalog service or data or requires manual repair."

[[assertions]]
id = "downstream-services-persist-after-reboot"
probe = "downstream-and-complete-path-reboots"
dimension = "persistence"
points = 2
critical = true
pass_condition = "Node3 and node4 boot identities change and orders-api and checkout-api recover automatically after their sequential reboots."
fail_condition = "A completed node3 or node4 reboot leaves its required service unavailable or needing repair."

[[assertions]]
id = "complete-cascade-persists-after-reboots"
probe = "downstream-and-complete-path-reboots"
dimension = "persistence"
points = 2
critical = true
pass_condition = "After the downstream reboots, node1 again reaches a healthy complete request path and the retained incident evidence remains available."
fail_condition = "After completed sequential reboots, the full request path or retained incident evidence does not recover automatically."
