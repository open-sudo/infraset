interface:
  display_name: "InfraSet Task Builder"
  short_description: "Build complete evidence-ready InfraSet tasks"
  default_prompt: "Use $infraset-task-builder to create a complete, evidence-ready InfraSet task from this infrastructure request."

dependencies:
  tools:
    - type: "mcp"
      value: "antrieb"
      description: "Read authoritative Antrieb primers and image references while authoring task topology."
      transport: "streamable_http"
      url: "https://antrieb.sh/mcp"
