<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">How InfraSet works</title>
  <desc id="desc">The collector records system state before preparation, after preparation, and after execution. The verifier scores the captured evidence without live system access.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#172554" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #0f172a; }
      .label { font: 700 20px Arial, sans-serif; fill: #0f172a; }
      .small { font: 400 15px Arial, sans-serif; fill: #475569; }
      .step { font: 700 16px Arial, sans-serif; fill: #0f172a; }
      .line { stroke: #64748b; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="700" rx="28" fill="url(#bg)"/>
  <text x="60" y="68" class="title">How InfraSet turns an idea into evidence</text>

  <text x="60" y="118" class="small">Three components provide the runner, infrastructure, and connection.</text>
  <rect x="60" y="145" width="300" height="120" rx="18" fill="#ffffff" stroke="#93c5fd" stroke-width="2" filter="url(#shadow)"/>
  <rect x="450" y="145" width="300" height="120" rx="18" fill="#ffffff" stroke="#c4b5fd" stroke-width="2" filter="url(#shadow)"/>
  <rect x="840" y="145" width="300" height="120" rx="18" fill="#ffffff" stroke="#86efac" stroke-width="2" filter="url(#shadow)"/>
  <text x="210" y="188" text-anchor="middle" class="label">Harbor</text>
  <text x="210" y="218" text-anchor="middle" class="small">execution framework and trace</text>
  <text x="600" y="188" text-anchor="middle" class="label">harbor-antrieb</text>
  <text x="600" y="218" text-anchor="middle" class="small">connects execution to Antrieb</text>
  <text x="990" y="188" text-anchor="middle" class="label">Antrieb</text>
  <text x="990" y="218" text-anchor="middle" class="small">provides disposable systems</text>
  <path d="M360 205 H440" class="line"/>
  <path d="M750 205 H830" class="line"/>

  <text x="60" y="325" class="small">A task is prepared, executed, verified, and published as a recorded job.</text>
  <g filter="url(#shadow)">
    <rect x="60" y="360" width="150" height="105" rx="16" fill="#dbeafe"/>
    <rect x="250" y="360" width="150" height="105" rx="16" fill="#ede9fe"/>
    <rect x="440" y="360" width="150" height="105" rx="16" fill="#dcfce7"/>
    <rect x="630" y="360" width="150" height="105" rx="16" fill="#fef3c7"/>
    <rect x="820" y="360" width="150" height="105" rx="16" fill="#ffedd5"/>
    <rect x="1010" y="360" width="150" height="105" rx="16" fill="#fce7f3"/>
  </g>
  <text x="135" y="402" text-anchor="middle" class="label">Task</text>
  <text x="135" y="430" text-anchor="middle" class="small">scenario and outcome</text>
  <text x="325" y="402" text-anchor="middle" class="label">Prepare</text>
  <text x="325" y="430" text-anchor="middle" class="small">create starting state</text>
  <text x="515" y="402" text-anchor="middle" class="label">Executor</text>
  <text x="515" y="430" text-anchor="middle" class="small">record commands</text>
  <text x="705" y="402" text-anchor="middle" class="label">AI agent</text>
  <text x="705" y="430" text-anchor="middle" class="small">operate systems</text>
  <text x="895" y="402" text-anchor="middle" class="label">Verifier</text>
  <text x="895" y="430" text-anchor="middle" class="small">score evidence</text>
  <text x="1085" y="402" text-anchor="middle" class="label">Job</text>
  <text x="1085" y="430" text-anchor="middle" class="small">trace and result</text>
  <path d="M210 412 H240" class="line"/>
  <path d="M400 412 H430" class="line"/>
  <path d="M590 412 H620" class="line"/>
  <path d="M780 412 H810" class="line"/>
  <path d="M970 412 H1000" class="line"/>

  <path d="M230 525 H800" stroke="#0ea5e9" stroke-width="3" fill="none"/>
  <circle cx="230" cy="525" r="7" fill="#0ea5e9"/>
  <circle cx="420" cy="525" r="7" fill="#0ea5e9"/>
  <circle cx="800" cy="525" r="7" fill="#0ea5e9"/>
  <text x="515" y="554" text-anchor="middle" class="step">Collector snapshots</text>
  <text x="230" y="580" text-anchor="middle" class="small">before prepare</text>
  <text x="420" y="580" text-anchor="middle" class="small">after prepare</text>
  <text x="800" y="580" text-anchor="middle" class="small">after executor</text>

  <rect x="60" y="620" width="1080" height="48" rx="14" fill="#ffffff" opacity=".8"/>
  <text x="600" y="651" text-anchor="middle" class="small">The verifier scores captured evidence; it does not troubleshoot or modify the systems.</text>
</svg>
